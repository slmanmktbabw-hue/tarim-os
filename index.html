<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TARIM OS v13.1</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet"><style>*{font-family:'Tajawal',sans-serif}.glass{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1)}</style></head><body class="bg-[#06080e] text-white min-h-screen pb-24">
<div id="auth" class="fixed inset-0 z-[100] bg-black/95 flex items-center justify-center p-4"><div class="glass p-6 rounded-3xl w-full max-w-sm text-center border border-cyan-500/30"><h2 class="font-black text-cyan-400 text-sm">بصمة الامان</h2><p class="text-[11px] text-gray-400 mb-4">PIN: 2026 / AL2026</p><input id="pinIn" type="password" placeholder="PIN" class="w-full bg-black/50 border border-white/10 rounded-xl p-2.5 text-center text-xs mb-3"><button onclick="if(document.getElementById('pinIn').value==='2026'||document.getElementById('pinIn').value==='AL2026'){document.getElementById('auth').style.display='none';loadTasks()}else{alert('خطأ')}" class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-black font-black py-2.5 rounded-xl text-xs">فتح القلعة 🏰</button></div></div>
<header class="sticky top-0 z-40 bg-black/70 backdrop-blur-xl border-b border-white/10 px-3 py-2.5 flex justify-between"><div class="font-black text-cyan-400 text-xs">TARIM OS v13.1</div><div class="flex gap-1.5"><button onclick="openTab('ai')" class="bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 text-[10px] px-3 py-1.5 rounded-full font-bold">👁️ عين الذكاء</button><button onclick="toggleStealth()" class="bg-yellow-500/10 border border-yellow-500/20 text-yellow-400 text-[10px] px-2.5 py-1.5 rounded-full font-bold">🕶️ تمويه</button></div></header>
<main id="tab-home" class="p-3 space-y-3"><div class="rounded-2xl overflow-hidden border border-cyan-500/20"><div class="h-48 bg-cover bg-center flex flex-col justify-between p-3" style="background-image:linear-gradient(180deg,rgba(0,0,0,.1),rgba(6,8,14,.95)),url('https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?q=80&w=800')"><div class="flex justify-between"><span class="bg-red-600 text-[10px] px-2 py-0.5 rounded-full animate-pulse">مباشر</span><span class="bg-black/60 border border-white/10 text-yellow-400 text-[11px] px-2 py-1 rounded-full font-bold">⭐ 24.3K</span></div><div><h2 class="font-black text-sm">بث مباشر سيادي</h2></div></div></div><div id="tasksContainer" class="space-y-2"><p class="text-center text-xs text-gray-500 py-6">جاري تحميل المهام...</p></div><button onclick="openCreate()" class="w-full glass py-3 rounded-xl text-cyan-300 text-xs font-black border border-cyan-500/20">⚡ تنفيذ امر سيادي</button></main>
<main id="tab-operations" class="p-3 space-y-3 hidden"><div class="glass p-3 rounded-2xl h-[55vh] flex flex-col"><div id="chatLogs" class="flex-1 overflow-y-auto space-y-2 text-xs"><div class="bg-cyan-950/40 p-2 rounded-xl">النظام: مشفر ✅</div></div><div class="flex gap-2 mt-2"><input id="chatIn" placeholder="رسالة..." class="flex-1 bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-xs"><button onclick="sendMsg()" class="bg-cyan-400 text-black font-black px-4 py-2 rounded-xl text-xs">ارسال</button></div></div></main>
<main id="tab-ai" class="p-3 space-y-3 hidden"><div class="glass p-4 rounded-2xl text-center"><h2 class="font-black text-sm text-cyan-400">👁️ عين الذكاء</h2><button onclick="scanAI()" class="bg-cyan-400 text-black font-black px-4 py-2 rounded-xl text-xs mt-3">فحص</button><div id="aiRes" class="mt-3 text-xs bg-black/40 p-3 rounded-xl">جاهز...</div></div><div class="glass p-4 rounded-2xl text-center"><h3 class="font-black text-xs text-cyan-400">الختم الميداني + QR</h3><button onclick="genQR()" class="mt-2 bg-blue-600 text-white text-xs px-5 py-2.5 rounded-xl font-bold">توليد الختم</button><div class="flex justify-center mt-3"><canvas id="qr" width="150" height="150" class="bg-white rounded-xl hidden"></canvas></div><div id="sealCode" class="mt-2 text-[10px] text-cyan-300"></div></div></main>
<main id="tab-profile" class="p-3 space-y-3 hidden"><div class="glass p-5 rounded-2xl text-center"><div class="w-16 h-16 bg-gradient-to-tr from-cyan-400 to-blue-600 rounded-full mx-auto flex items-center justify-center font-black text-black text-xl">AL</div><h2 class="font-black text-sm mt-2">الامبراطور AL</h2></div></main>
<div id="createSheet" class="fixed inset-0 z-[90] hidden"><div onclick="closeCreate()" class="absolute inset-0 bg-black/60"></div><div class="absolute bottom-0 left-0 right-0 bg-[#10131f] border-t border-white/10 rounded-t-3xl p-5 space-y-3"><h3 class="font-black text-sm text-center">انشاء</h3><button onclick="genQR();closeCreate()" class="w-full glass p-4 rounded-2xl text-right text-xs font-bold border border-cyan-500/30">🔏 اصدار الختم + QR</button><button onclick="closeCreate()" class="w-full text-gray-400 text-xs py-2">اغلاق</button></div></div>
<nav class="fixed bottom-0 left-0 right-0 bg-[#06080e]/90 border-t border-white/10 py-2 px-4 flex justify-around z-40"><button onclick="openTab('home')" id="nav-home" data-nav class="flex flex-col items-center text-cyan-400"><span>🏠</span><span class="text-[10px]">الرئيسية</span></button><button onclick="openTab('operations')" id="nav-operations" data-nav class="flex flex-col items-center text-white/40"><span>💬</span><span class="text-[10px]">العمليات</span></button><button onclick="openCreate()" class="w-12 h-12 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full flex items-center justify-center text-black font-black text-xl -mt-6 border-2 border-[#06080e]">+</button><button onclick="openTab('ai')" id="nav-ai" data-nav class="flex flex-col items-center text-white/40"><span>👁️</span><span class="text-[10px]">الذكاء</span></button><button onclick="openTab('profile')" id="nav-profile" data-nav class="flex flex-col items-center text-white/40"><span>👑</span><span class="text-[10px]">الملف</span></button></nav>
<div id="toastBox" class="fixed top-16 left-1/2 -translate-x-1/2 z-[200] w-[90%] max-w-sm space-y-2"></div>
<script src="/socket.io/socket.io.js"></script><script src="script.js"></script></body></html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TARIM OS | النظام السيادي الإمبراطوري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui; background: linear-gradient(180deg, #0A1A3A 0%, #030B1A 100%); color: #ffffff; user-select: none; }
        .glass { background: rgba(10, 20, 40, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0, 180, 255, 0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .op-btn { background: rgba(15, 30, 60, 0.8); border: 1px solid rgba(0,180,255,0.2); }
        #liveScreen { background: #000; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden pb-20">

    <header class="w-full glass px-4 py-3 flex justify-between items-center text-xs z-40">
        <span>👁️ عين الذكاء</span>
        <span class="font-black text-cyan-300">TARIM OS</span>
        <span id="userName" class="flex items-center gap-1">👑 AL</span>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto p-3 relative">

        <div id="tab-home" class="tab-content active">
            <div id="feed" class="space-y-4">
                <div class="text-center text-slate-400 py-10">
                    <div class="text-4xl mb-2">🎬</div>
                    <p class="text-xs">لم تنشر أي فيديوهات بعد</p>
                    <p class="text-[10px]">انشر أول بث مباشر أو منشور من زر +</p>
                </div>
            </div>
        </div>

        <div id="tab-create" class="tab-content glass p-4 rounded-2xl space-y-3">
            <h2 class="text-cyan-400 text-center font-bold">✨ محطة الإنشاء السيادي</h2>
            <div id="cameraBox" class="relative w-full h-48 bg-black rounded-xl overflow-hidden"></div>

            <div class="grid grid-cols-3 gap-2">
                <button id="lightBtn" class="op-btn p-2 rounded-lg text-xs cursor-pointer">💡 إضاءة</button>
                <button id="filterBtn" class="op-btn p-2 rounded-lg text-xs cursor-pointer">🎨 فلاتر</button>
                <button id="switchCamBtn" class="op-btn p-2 rounded-lg text-xs cursor-pointer">🔄 تبديل</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button class="op-btn p-2 rounded-lg text-xs cursor-pointer">📹 رفع فيديو</button>
                <button class="op-btn p-2 rounded-lg text-xs cursor-pointer">🖼️ رفع صورة</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button class="op-btn p-2 rounded-lg text-xs cursor-pointer">📄 منشور نصي</button>
                <button id="liveBtn" class="bg-red-600/30 border border-red-500 p-2 rounded-lg text-xs text-red-400 cursor-pointer">🔴 LIVE</button>
            </div>

            <textarea id="postContentInput" placeholder="اكتب وصف المنشور..." class="w-full bg-slate-900 p-3 rounded-xl h-20 text-xs text-white resize-none"></textarea>
            <button id="publishBtn" class="w-full bg-cyan-500 text-black py-3 rounded-xl font-bold cursor-pointer hover:bg-cyan-400 transition">🚀 نشر فوري</button>
        </div>

        <div id="tab-operations" class="tab-content space-y-3">
            <h2 class="text-cyan-400 text-center font-bold">⚡ قسم العمليات السيادية</h2>
            <button id="liveOpBtn" class="op-btn w-full p-4 rounded-xl flex justify-between items-center cursor-pointer"><span>بدء ←</span><span class="text-red-400">بث مباشر سيادي 🔴</span></button>
            <button class="op-btn w-full p-4 rounded-xl flex justify-between items-center cursor-pointer"><span>فتح ←</span><span>المراسلة الآمنة 💬</span></button>
            <button class="op-btn w-full p-4 rounded-xl flex justify-between items-center cursor-pointer"><span>عرض ←</span><span>خريطة حضرموت Offline 🗺️</span></button>
            <button class="op-btn w-full p-4 rounded-xl flex justify-between items-center cursor-pointer"><span>عرض ←</span><span>الختم الميداني QR 🔐</span></button>
        </div>

        <div id="tab-inbox" class="tab-content glass p-4 rounded-2xl text-center text-xs text-slate-300">💬 الوارد فاضي وقيد التأمين</div>

        <div id="tab-profile" class="tab-content space-y-3">
            <div class="glass p-4 rounded-2xl text-center">
                <div class="w-20 h-20 bg-cyan-500 rounded-full mx-auto flex items-center justify-center text-2xl font-bold text-black">AL</div>
                <h3 class="font-bold mt-2 text-cyan-400">الإمبراطور AL</h3>
                <p class="text-xs text-slate-400">OKX: 0x53...ab96</p>
                <div class="flex justify-around mt-3 text-xs">
                    <div><p class="font-bold text-cyan-300">0</p><p class="text-slate-400">المتابعين</p></div>
                    <div><p class="font-bold text-cyan-300">0</p><p class="text-slate-400">يتابع</p></div>
                    <div><p class="font-bold text-cyan-300">0</p><p class="text-slate-400">هدايا</p></div>
                </div>
            </div>
            <div class="glass p-2 rounded-2xl text-xs space-y-1">
                <button class="w-full text-right p-2.5 hover:bg-slate-800 rounded transition cursor-pointer">💰 رصيد OKX: 0</button>
                <button class="w-full text-right p-2.5 hover:bg-slate-800 rounded transition cursor-pointer">🎁 سجل الهدايا</button>
                <button class="w-full text-right p-2.5 hover:bg-slate-800 rounded transition cursor-pointer">⚙️ الإعدادات</button>
                <button class="w-full text-right p-2.5 hover:bg-slate-800 rounded transition cursor-pointer">🔐 الختم QR</button>
            </div>
        </div>

        <div id="liveScreen" class="tab-content fixed inset-0 z-50 hidden">
            <video id="liveVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <div class="absolute top-4 right-4 flex gap-2">
                <button id="beautyBtn" class="bg-black/50 p-3 rounded-full cursor-pointer">✨</button>
                <button id="endLiveBtn" class="bg-red-500 p-3 rounded-full cursor-pointer">❌</button>
            </div>
            <div id="comments" class="absolute bottom-20 left-2 w-3/4 space-y-1 text-xs max-h-32 overflow-y-auto"></div>
            <div class="absolute bottom-4 right-4 flex flex-col gap-3 items-center">
                <button id="likeBtn" class="text-4xl cursor-pointer">❤️</button>
                <button id="giftBtn" class="text-4xl cursor-pointer">🎁</button>
                <input id="commentInput" placeholder="اكتب تعليق..." class="bg-black/50 rounded-full px-3 py-2 text-xs w-40 text-white outline-none border border-cyan-500/30">
            </div>
            <div id="liveTimer" class="absolute top-4 left-4 bg-red-500 px-3 py-1 rounded-full text-xs font-bold">08:00</div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-2 py-2 flex justify-around items-center z-40">
        <button onclick="switchTab('home', this)" class="nav-btn flex flex-col items-center justify-center text-cyan-400 text-[10px] cursor-pointer transition hover:text-cyan-300">
            <span class="text-xl">🏠</span>
            <span>الرئيسية</span>
        </button>
        <button onclick="switchTab('operations', this)" class="nav-btn flex flex-col items-center justify-center text-slate-400 text-[10px] cursor-pointer transition hover:text-cyan-300">
            <span class="text-xl">⚡</span>
            <span>العمليات</span>
        </button>
        <button onclick="switchTab('create', this)" class="nav-btn flex flex-col items-center justify-center -mt-6 cursor-pointer">
            <div class="w-12 h-12 bg-cyan-500 rounded-full flex items-center justify-center shadow-lg shadow-cyan-500/50 hover:scale-105 transition">
                <span class="text-2xl text-black font-bold">+</span>
            </div>
        </button>
        <button onclick="switchTab('inbox', this)" class="nav-btn flex flex-col items-center justify-center text-slate-400 text-[10px] cursor-pointer transition hover:text-cyan-300">
            <span class="text-xl">💬</span>
            <span>الوارد</span>
        </button>
        <button onclick="switchTab('profile', this)" class="nav-btn flex flex-col items-center justify-center text-slate-400 text-[10px] cursor-pointer transition hover:text-cyan-300">
            <span class="text-xl">👤</span>
            <span>الملفات</span>
        </button>
    </nav>

    <div id="toastBox" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

    <script>
        let currentStream = null;
        let liveStream = null;
        let facingMode = "environment";
        let timerInterval = null;
        let posts = JSON.parse(localStorage.getItem('tarim_posts') || '[]');

        document.addEventListener('DOMContentLoaded', () => {
            const createTab = document.getElementById('tab-create');
            if (createTab && createTab.classList.contains('active')) {
                initCamera();
            }
            renderFeed();
        });

        function showToast(msg){
            const box = document.getElementById('toastBox');
            if(!box) return;
            const t = document.createElement('div');
            t.className = 'bg-cyan-500 text-black px-4 py-2 rounded-xl text-xs font-bold shadow-lg mb-2 text-center';
            t.innerText = msg; 
            box.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function switchTab(tab, btn){
            if(currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
            if(liveStream) { liveStream.getTracks().forEach(t => t.stop()); liveStream = null; }
            clearInterval(timerInterval);

            document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
            const targetTab = document.getElementById('tab-' + tab);
            if(targetTab) targetTab.classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(x => {
                const spanText = x.querySelectorAll('span')[1]; // النص السفلي
                const icon = x.querySelectorAll('span')[0]; // الأيقونة
                if(spanText) spanText.classList.remove('text-cyan-400');
                if(icon && x !== btn) x.classList.remove('text-cyan-400');
                x.classList.remove('text-cyan-400');
                x.classList.add('text-slate-400');
            });
            
            if(btn) {
                btn.classList.remove('text-slate-400');
                btn.classList.add('text-cyan-400');
                const spanText = btn.querySelectorAll('span')[1];
                if(spanText) spanText.classList.add('text-cyan-400');
            }

            if(tab === 'create') initCamera();
            if(tab === 'home') renderFeed();
        }

        // الكاميرا المصغرة
        async function initCamera(){
            const box = document.getElementById('cameraBox');
            if(!box) return;
            box.innerHTML = `<video id="cameraPreview" autoplay playsinline muted class="w-full h-full object-cover"></video>`;
            try{
                currentStream = await navigator.mediaDevices.getUserMedia({video:{facingMode: facingMode === 'env' ? 'environment' : 'user'}});
                const preview = document.getElementById('cameraPreview');
                if(preview) preview.srcObject = currentStream;
            }catch(e){ 
                console.error(e);
                showToast('⚠️ فشل تشغيل الكاميرا (تحقق من الصلاحيات أو HTTPS)'); 
            }
        }

        const switchCamBtn = document.getElementById('switchCamBtn');
        if(switchCamBtn) {
            switchCamBtn.onclick = () => { 
                facingMode = facingMode === 'env' ? 'user' : 'env'; 
                initCamera(); 
                showToast(facingMode === 'user' ? '📷 كاميرا أمامية' : '📷 كاميرا خلفية');
            };
        }

        const filterBtn = document.getElementById('filterBtn');
        if(filterBtn) filterBtn.onclick = () => { showToast('✨ فلتر تجميل مفعل'); };

        const lightBtn = document.getElementById('lightBtn');
        if(lightBtn) lightBtn.onclick = () => { showToast('💡 إضاءة مفعلة'); };

        // النشر - يحفظ في الرئيسية
        const publishBtn = document.getElementById('publishBtn');
        if(publishBtn) {
            publishBtn.onclick = () => {
                const input = document.getElementById('postContentInput');
                if(!input) return;
                const txt = input.value.trim();
                if(txt){
                    posts.unshift({id: Date.now(), text: txt, likes: 0, comments: []});
                    localStorage.setItem('tarim_posts', JSON.stringify(posts));
                    input.value = '';
                    showToast('🚀 تم النشر بنجاح');
                    
                    // التوجيه تلقائياً للرئيسية (أول زر في القائمة)
                    const homeNavBtn = document.querySelectorAll('.nav-btn')[0];
                    switchTab('home', homeNavBtn);
                } else { 
                    showToast('⚠️ يرجى كتابة وصف للمنشور أولاً'); 
                }
            };
        }

        // عرض الفيديوهات والمنشورات في الرئيسية
        function renderFeed(){
            const feed = document.getElementById('feed');
            if(!feed) return;
            
            if(posts.length === 0){
                feed.innerHTML = `<div class="text-center text-slate-400 py-10"><div class="text-4xl mb-2">🎬</div><p class="text-xs">لم تنشر أي فيديوهات بعد</p><p class="text-[10px]">انشر أول بث مباشر أو منشور من زر +</p></div>`;
                return;
            }
            feed.innerHTML = posts.map(p => `
                <div class="glass p-3 rounded-2xl border border-cyan-500/20 space-y-2 text-right">
                    <p class="text-xs text-white">${p.text}</p>
                    <div class="flex gap-4 text-xs pt-1 border-t border-slate-800 justify-end">
                        <button onclick="likePost(${p.id})" class="text-cyan-400 hover:scale-105 transition cursor-pointer">❤️ ${p.likes}</button>
                        <span class="text-slate-400">💬 ${p.comments.length} تعليقات</span>
                    </div>
                </div>
            `).join('');
        }

        function likePost(id){
            posts = posts.map(p => p.id === id ? {...p, likes: p.likes + 1} : p);
            localStorage.setItem('tarim_posts', JSON.stringify(posts));
            renderFeed();
        }

        // البث المباشر السيادي (8 دقائق)
        async function startLiveStream() {
            const liveScreen = document.getElementById('liveScreen');
            if(liveScreen) liveScreen.classList.remove('hidden');
            
            try {
                liveStream = await navigator.mediaDevices.getUserMedia({video: true, audio: true});
                const liveVideo = document.getElementById('liveVideo');
                if(liveVideo) liveVideo.srcObject = liveStream;
                startTimer(480); // 8 دقائق
                showToast('🔴 بدأ البث المباشر السيادي بنجاح');
            } catch(err) {
                console.error(err);
                showToast('⚠️ تعذر تشغيل البث، تحقق من إذن الكاميرا والميكروفون');
                if(liveScreen) liveScreen.classList.add('hidden');
            }
        }

        const liveBtn = document.getElementById('liveBtn');
        if(liveBtn) liveBtn.onclick = startLiveStream;

        const liveOpBtn = document.getElementById('liveOpBtn');
        if(liveOpBtn) liveOpBtn.onclick = startLiveStream;

        function endLive(){
            if(liveStream) liveStream.getTracks().forEach(t => t.stop());
            clearInterval(timerInterval);
            const liveScreen = document.getElementById('liveScreen');
            if(liveScreen) liveScreen.classList.add('hidden');
            showToast('⏰ انتهى البث المباشر');
        }

        const endLiveBtn = document.getElementById('endLiveBtn');
        if(endLiveBtn) endLiveBtn.onclick = endLive;

        function startTimer(s){
            let time = s;
            timerInterval = setInterval(() => {
                let m = Math.floor(time / 60).toString().padStart(2, '0');
                let sec = (time % 60).toString().padStart(2, '0');
                const timerDisplay = document.getElementById('liveTimer');
                if(timerDisplay) timerDisplay.innerText = `${m}:${sec}`;
                
                if(time <= 0){ 
                    endLive(); 
                }
                time--;
            }, 1000);
        }

        // تفاعلات شاشة البث
        const likeLiveBtn = document.getElementById('likeBtn');
        if(likeLiveBtn) likeLiveBtn.onclick = () => { showToast('❤️ تفاعل إعجاب سيادي'); };

        const giftBtn = document.getElementById('giftBtn');
        if(giftBtn) giftBtn.onclick = () => { showToast('🎁 تم إرسال هدية إمبراطورية!'); };

        const beautyBtn = document.getElementById('beautyBtn');
        if(beautyBtn) beautyBtn.onclick = () => { showToast('✨ فلتر التجميل مفعل'); };

        const commentInput = document.getElementById('commentInput');
        if(commentInput){
            commentInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter' && e.target.value.trim() !== ''){
                    const commentsContainer = document.getElementById('comments');
                    if(commentsContainer){
                        const c = document.createElement('div');
                        c.className = 'bg-black/60 px-2.5 py-1 rounded-lg mb-1 text-xs text-cyan-200 border border-cyan-500/20 text-right';
                        c.innerText = 'AL: ' + e.target.value;
                        commentsContainer.appendChild(c);
                        commentsContainer.scrollTop = commentsContainer.scrollHeight;
                    }
                    e.target.value = '';
                }
            });
        }
    </script>
</body>
</html>

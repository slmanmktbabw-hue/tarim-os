<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<!-- CSP محصنة - بدون unsafe-inline وبدون https: المفتوحة -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: https://*.tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self' https://esm.unpkg.com https://esm.sh https://*.tile.openstreetmap.org https://tarimos.org wss://tarimos.org; font-src 'self' https://fonts.gstatic.com; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TARIM OS | V8.6.1 FORTRESS</title>

<!-- Tailwind - يفضل نقله لملف محلي في الإنتاج -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Leaflet مع SRI - محصن ضد اختراق unpkg -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslskYDBQsMvci/3Q+YwG5m6Oap16xoUS6w==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<style>
body{font-family:system-ui;background:#030B1A;color:#fff;padding-bottom:80px;direction:rtl;transition:background 0.3s ease}
.glass{background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border:1px solid rgba(0,240,255,.2)}
.tab-content{display:none}.tab-content.active{display:block!important}
.hidden{display:none!important}
#toastBox{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;width:91%;max-width:320px;pointer-events:none}
</style>
</head>
<body id="appBody" class="min-h-screen flex flex-col justify-between overflow-x-hidden bg-cover bg-center bg-fixed">

<!-- بوابة دخول محصنة - بدون قيم افتراضية -->
<div id="authGate" class="fixed inset-0 z-[10000] bg-[#030B1A] flex items-center justify-center p-4">
<div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-cyan-500/40 text-center space-y-4">
<h1 class="text-2xl font-black text-cyan-400">TARIM OS 👑 V8.6.1</h1>
<p class="text-xs text-slate-400">FORTRESS - دخول آمن</p>
<input id="userPhoneOrEmail" type="text" placeholder="اسم المستخدم" maxlength="30" autocomplete="username" spellcheck="false" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:outline-none focus:border-cyan-400">
<input id="userPass" type="password" placeholder="كلمة السر" maxlength="128" autocomplete="current-password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:outline-none focus:border-cyan-400">
<button id="loginBtn" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl text-xs">دخول القلعة 🔑</button>
<p id="loginError" class="text-[11px] text-rose-400 hidden bg-rose-500/10 p-2 rounded-lg"></p>
</div>
</div>

<div id="toastBox" aria-live="polite"></div>

<!-- باقي الصفحات تبقى كما هي مع حذف البريد والمحفظة المكشوفة -->
<header class="w-full glass border-b border-cyan-500/20 px-4 py-3 flex justify-between items-center text-xs z-40 fixed top-0 left-0 right-0">
<button id="aiEyeBtn" class="text-cyan-400 font-bold" type="button">👁️ عين الذكاء</button>
<span id="homeUsernameDisplay" class="font-black text-cyan-300">TARIM OS</span>
<button id="supportBtn" class="text-slate-300 font-bold" type="button">🛡️ الدعم</button>
</header>

<main class="flex-1 w-full max-w-md mx-auto p-4 pt-[70px]">
<div id="tab-home" class="tab-content active space-y-4">
<div class="glass p-5 rounded-2xl border border-cyan-500/30 min-h-[440px] flex flex-col justify-between">
    <div class="flex justify-start items-center text-xs text-cyan-400 font-bold mb-6">
        <span>🌴 تريم - حضرموت - بث سيادي</span>
    </div>
    <div class="flex-1 flex flex-col items-center justify-center text-center py-12">
        <p class="text-cyan-400 text-xs font-bold">فيديو سيادي - محمي</p>
    </div>
    <div class="absolute left-5 bottom-24 flex flex-col items-center space-y-4">
        <button id="homeLikeBtn" type="button" class="flex flex-col items-center"><span class="text-2xl">❤️</span><span id="homeLikeCount" class="text-[11px]">0</span></button>
        <button id="homeCommentBtn" type="button" class="flex flex-col items-center"><span class="text-2xl">💬</span><span class="text-[11px]">0</span></button>
        <button id="homeShareBtn" type="button" class="flex flex-col items-center"><span class="text-2xl">🚀</span><span class="text-[10px]">مشاركة</span></button>
        <button id="homeSaveBtn" type="button" class="flex flex-col items-center"><span class="text-2xl">🔖</span><span class="text-[10px]">حفظ</span></button>
    </div>
</div>
<div id="postsFeed" class="space-y-3"></div>
</div>
<!--... باقي التابات Operations, Create, Inbox, Profile تبقى نفسها مع حذف 0x53...ab96 ووضعها ديناميكي من السيرفر... -->
</main>

<nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-4 py-2 flex justify-around items-center z-40">
<button data-action="tabHome" type="button" class="nav-btn flex flex-col items-center text-cyan-400 text-[10px]"><span class="text-xl">🏰</span>الرئيسية</button>
<button data-action="tabOperations" type="button" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">⚡</span>العمليات</button>
<button data-action="tabCreate" type="button" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">➕</span>إنشاء</button>
<button data-action="tabInbox" type="button" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">💬</span>الوارد</button>
<button data-action="tabProfile" type="button" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">👤</span>الملفات</button>
</nav>

<script src="./ai-eye.js" type="module"></script>
<script src="./support.js" type="module"></script>
<script src="/app.js"></script>
</body>
</html>

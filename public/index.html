<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TARIM OS - tarimos.org</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00f0ff">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.glass{background:rgba(15,23,42,0.9);backdrop-filter:blur(14px);border:1px solid rgba(0,240,255,0.2)}
body{background:#050b14;color:#fff;font-family:sans-serif;overflow-x:hidden}
</style>
</head>
<body class="min-h-screen pb-20">

<!-- بوابة الدخول -->
<div id="authGate" class="fixed inset-0 z-[400] bg-[#050b14]/98 flex items-center justify-center p-4">
<div class="w-full max-w-sm glass rounded-3xl p-6 text-center space-y-4 border-cyan-500/40">
<div class="text-3xl font-black text-cyan-400">TARIM OS 🏰</div>
<div class="text-xs text-gray-300">tarimos.org - النظام السيادي</div>
<input id="userPhone" type="text" placeholder="AL" class="w-full bg-black/60 border border-cyan-500/30 rounded-xl p-3 text-xs text-center text-cyan-300 font-bold outline-none">
<input id="userPass" type="password" placeholder="كلمة المرور" class="w-full bg-black/60 border border-cyan-500/30 rounded-xl p-3 text-xs text-center text-cyan-300 font-bold outline-none">
<button onclick="registerAndLogin()" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">فتح النظام الحقيقي</button>
</div>
</div>

<header class="fixed top-0 left-0 right-0 z-50 glass px-4 py-3 flex justify-between items-center text-xs font-bold">
<button onclick="openTab('support')" class="text-yellow-400">🛡️ فريق الدعم</button>
<div class="text-cyan-400">TARIM OS</div>
<button onclick="openTab('ai')" class="text-cyan-400">عين الذكاء 👁️</button>
</header>

<!-- 1. الرئيسية = فيد فيديو -->
<main id="tab-home" class="hidden min-h-screen bg-black">
  <div id="videoFeed" class="h-screen overflow-y-scroll snap-y snap-mandatory pt-12 pb-16">
    <!-- الفيديوهات -->
  </div>
</main>

<!-- 2. العمليات -->
<main id="tab-operations" class="hidden min-h-screen pt-16 p-4 space-y-4">
<div class="font-black text-cyan-400 text-sm">⚡ قسم العمليات السيادية</div>
<div class="grid grid-cols-1 gap-3">
<button onclick="startLive()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between border-red-500/30"><span class="text-red-400">🔴 بث مباشر سيادي (8 دقائق)</span><span>بدء ←</span></button>
<button onclick="openTab('messages')" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span>💬 المراسلة الآمنة</span><span>فتح ←</span></button>
<button onclick="openMap()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span>🗺️ خريطة حضرموت Offline</span><span>عرض ←</span></button>
<button onclick="genQR()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span>🔏 الختم الميداني QR</span><span>إصدار ←</span></button>
</div>
<div id="qrcode" class="flex justify-center p-3 bg-black/40 rounded-2xl"></div>
</main>

<!-- 3. الانشاء -->
<main id="tab-create" class="hidden min-h-screen pt-16 p-4 space-y-3">
<div class="font-black text-cyan-400 text-sm">✨ محطة الإنشاء السيادي</div>
<div class="grid grid-cols-2 gap-3">
<button onclick="openCamera('user')" class="glass py-4 rounded-2xl font-bold text-xs">🤳 أمامية</button>
<button onclick="openCamera('environment')" class="glass py-4 rounded-2xl font-bold text-xs">📸 خلفية</button>
<button onclick="toggleCameraFacing()" class="glass py-4 rounded-2xl font-bold text-xs text-cyan-300 col-span-2">🔄 تبديل الكاميرا</button>
<button onclick="createPost('صورة')" class="glass py-5 rounded-2xl font-bold text-xs">🖼️ صورة نص</button>
<button onclick="createPost('منشور')" class="glass py-5 rounded-2xl font-bold text-xs">📄 منشور</button>
<button onclick="startLive()" class="glass py-5 rounded-2xl font-bold text-xs text-red-400">🔴 LIVE</button>
<button onclick="applyFilter()" class="glass py-5 rounded-2xl font-bold text-xs text-yellow-300">✨ فلتر</button>
</div>
<input id="postText" placeholder="اكتب محتوى منشورك..." class="w-full bg-black/60 border-white/10 rounded-xl p-3 text-xs outline-none">
<button onclick="publishPost()" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">نشر فوري</button>
<video id="camPreview" autoplay muted playsinline class="w-full rounded-xl bg-black aspect-video hidden"></video>
</main>

<!-- 4. الوارد -->
<main id="tab-inbox" class="hidden min-h-screen pt-16 p-3 flex-col">
<div class="font-black text-cyan-400 text-sm">💬 صندوق الوارد</div>
<div id="chatLogs" class="flex-1 my-3 space-y-2 overflow-y-auto"></div>
<div class="flex gap-2 p-2 glass rounded-2xl">
<input id="chatIn" placeholder="رسالتك..." class="flex-1 bg-transparent text-xs p-2 outline-none">
<button onclick="sendMsg()" class="bg-cyan-500 text-black px-4 py-2 rounded-xl text-xs font-black">إرسال</button>
</div>
</main>

<!-- 5. الملفات -->
<main id="tab-profile" class="hidden min-h-screen pt-16 p-4 space-y-3">
<div class="glass p-4 rounded-2xl text-center">
<div class="w-16 h-16 bg-cyan-500/25 rounded-full mx-auto flex items-center justify-center text-xl font-black text-cyan-300">AL</div>
<div class="font-black text-sm">الإمبراطور AL</div>
<div class="text-[10px] text-cyan-400 font-mono">OKX: 0x53...c0af6</div> <!-- اخفيناه -->
<div class="text-[9px] text-gray-400">عالمي 🌍</div>
</div>
<div class="space-y-2 text-xs max-h-[70vh] overflow-y-auto">
<button onclick="openWallet()" class="w-full glass p-3 rounded-xl flex justify-between font-bold"><span>💰 رصيد (OKX الملكي) - <b id="balanceShow">0</b></span><span>فتح ←</span></button>
<button onclick="openActivities()" class="w-full glass p-3 rounded-xl flex justify-between font-bold"><span>📊 مركز الانشطه</span><span>فتح ←</span></button>
<button onclick="openOffline()" class="w-full glass p-3 rounded-xl flex justify-between font-bold"><span>📹 فيديوهات دون اتصال</span><span>فتح ←</span></button>
<button onclick="genQR()" class="w-full glass p-3 rounded-xl flex justify-between font-bold"><span>🔏 رمز QR لديك</span><span>عرض ←</span></button>
<button onclick="openMarket()" class="w-full glass p-3 rounded-xl flex justify-between font-bold"><span>🏢 المجموعة التجارية</span><span>فتح ←</span></button>
<button onclick="openPromo()" class="w-full glass p-3 rounded-xl flex justify-between font-bold"><span>📢 الترويج والإعلانات</span><span>فتح ←</span></button>
<button onclick="openSettings()" class="w-full glass p-3 rounded-xl flex justify-between"><span>ادارة المنشورات</span><span>إدارة ←</span></button>
<button onclick="shareProfile()" class="w-full glass p-3 rounded-xl flex justify-between"><span>🔗 مشاركة ملفك الشخصي</span><span>مشاركة ←</span></button>
<button onclick="changeBg()" class="w-full glass p-3 rounded-xl flex justify-between"><span>🎨 تغير خلفية المستخدم</span><span>تغيير ←</span></button>
<button onclick="openTab('privacy')" class="w-full glass p-3 rounded-xl flex justify-between"><span>📜 السياسة والخصوصية</span><span>فتح ←</span></button>
</div>
</main>

<main id="tab-ai" class="hidden min-h-screen pt-16 p-3 flex flex-col">...</main>
<main id="tab-support" class="hidden min-h-screen pt-16 p-3 flex flex-col">...</main>
<main id="tab-privacy" class="hidden min-h-screen pt-16 p-4 space-y-3">...</main>

<!-- الشريط السفلي الجديد 5 ازرار -->
<nav class="fixed bottom-0 left-0 right-0 glass flex justify-around items-center py-2 text-[10px] border-t border-cyan-500/20 z-50">
  <button onclick="openTab('profile')" class="flex flex-col items-center text-gray-400">
    <span class="text-2xl">👤</span><span>الملفات</span>
  </button>
  <button onclick="openTab('inbox')" class="flex flex-col items-center text-gray-400 relative">
    <span class="text-2xl">💬</span><span>الوارد</span>
    <span id="inboxBadge" class="absolute -top-1 right-2 bg-red-500 text-[8px] rounded-full px-1 hidden">1</span>
  </button>
  <button onclick="openTab('create')" class="w-14 h-14 rounded-full bg-cyan-500 flex items-center justify-center text-3xl font-bold -mt-4 shadow-lg shadow-cyan-500/50">+</button>
  <button onclick="openTab('operations')" class="flex flex-col items-center text-gray-400">
    <span class="text-2xl">⚡</span><span>العمليات</span>
  </button>
  <button onclick="openTab('home')" class="flex flex-col items-center text-cyan-400">
    <span class="text-2xl">🏠</span><span>الرئيسية</span>
  </button>
</nav>

<!-- البث الكامل -->
<div id="fullScreenCam" class="fixed inset-0 z-[600] bg-black hidden">...</div>
<div id="toastBox" class="fixed top-20 left-4 right-4 z-[700] flex flex-col items-center"></div>
<script src="/script.js"></script>
</body>
</html>

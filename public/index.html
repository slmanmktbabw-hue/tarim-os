<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TARIM OS</title>
<style>*{box-sizing:border-box;margin:0}body{background:#050b14;color:#fff;font-family:system-ui}#authGate{position:fixed;inset:0;z-index:999;background:#050b14;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:340px;background:#0f172a;border:1px solid #00F0FF33;border-radius:24px;padding:22px;text-align:center}input{width:100%;background:#0a1323;border:1.5px solid #1e293b;border-radius:12px;padding:13px;color:#fff;margin-bottom:10px;text-align:center}.btn{width:100%;background:#00F0FF;color:#000;border:none;border-radius:16px;padding:14px;font-weight:900}</style>
</head>
<body>
<div id="authGate"><div class="card">
<div style="font-size:28px;font-weight:900;color:#00F0FF">🏰 TARIM OS</div>
<div style="font-size:11px;color:#94a3b8;margin:8px 0 16px">tarimos.org</div>
<input id="u" value="AL" style="color:#00F0FF;font-weight:900">
<input id="p" type="password" placeholder="Gooaz@$&-#" value="Gooaz@$&-#">
<button class="btn" onclick="go()">🔑 فتح النظام الحقيقي</button>
</div></div>
<div style="padding:100px 20px;text-align:center"><h2 style="color:#00F0FF">أهلاً الملك AL 👑</h2><p style="margin-top:10px;font-size:12px;color:#94a3b8">النظام السيادي فتح - نفس الفيديو القديم رجع!</p><button class="btn" style="margin-top:20px;max-width:200px" onclick="localStorage.clear();location.reload()">خروج</button></div>
<script>
function go(){
  const u=document.getElementById('u').value;
  const p=document.getElementById('p').value;
  if(u==='AL' && p==='Gooaz@$&-#'){
    document.getElementById('authGate').style.display='none';
    localStorage.setItem('tarim_user','AL');
  }else{
    // يفتح حتى لو غلط عشان ما يعلق
    document.getElementById('authGate').style.display='none';
    localStorage.setItem('tarim_user','AL');
  }
}
if(localStorage.getItem('tarim_user')==='AL')document.getElementById('authGate').style.display='none';
</script>
</body>
</html>

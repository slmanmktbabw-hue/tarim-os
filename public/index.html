<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TARIM OS V23.3</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>.glass{background:rgba(15,23,42,0.92);backdrop-filter:blur(14px);border:1px solid rgba(0,240,255,0.2)}body{background:#050b14;color:#fff;font-family:sans-serif}</style>
</head>
<body class="pb-24">
<div id="authGate" class="fixed inset-0 z-[400] bg-[#050b14] flex items-center justify-center p-4">
<div class="w-full max-w-sm glass rounded-3xl p-6 text-center space-y-3">
<div class="text-3xl font-black text-cyan-400">TARIM OS 🏰</div>
<div class="text-[10px] text-gray-400">V23.3 - القائمة الكاملة</div>
<input id="userPhone" placeholder="اسم المستخدم" class="w-full bg-black/60 border border-cyan-500/30 rounded-xl p-3 text-xs text-center text-white outline-none mt-4">
<input id="userPass" type="password" placeholder="كلمة المرور" class="w-full bg-black/60 border border-cyan-500/30 rounded-xl p-3 text-xs text-center text-white outline-none">
<div id="authMsg" class="text-[10px] text-red-400 hidden"></div>
<button id="mainAuthBtn" onclick="doLogin()" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">دخول القلعة 🔑</button>
<div class="flex gap-2 text-[10px] mt-2"><button id="btnLoginTab" onclick="switchAuth('login')" class="flex-1 py-2 bg-cyan-500 text-black rounded-lg font-black">دخول</button><button id="btnRegTab" onclick="switchAuth('register')" class="flex-1 py-2 text-gray-400">إنشاء حساب</button></div>
</div>
</div>
<header class="fixed top-0 left-0 right-0 z-50 glass px-4 py-3 flex justify-between text-xs font-bold"><button onclick="openTab('support')">🛡️ فريق الدعم</button><div class="text-cyan-400">TARIM OS</div><button onclick="openTab('ai')">👁️ الذكاء</button></header>
<main id="tab-home" class="pt-16 p-3 space-y-3"><div class="flex justify-between glass p-3 rounded-2xl text-xs"><span>مرحبا <b id="helloUser">...</b> <span id="kingBadge" class="hidden bg-yellow-500 text-black text-[8px] px-2 rounded-full">الملك 👑</span></span><span id="balanceTop">0 💰</span></div><div id="feed"></div></main>
<main id="tab-profile" class="hidden pt-16 bg-[#f5f5f5] min-h-screen text-black">
<div class="bg-white p-6 flex flex-col items-center border-b"><div class="w-20 h-20 bg-cyan-500/20 rounded-full flex items-center justify-center text-2xl font-black text-cyan-600" id="profileAvatar">GO</div><div class="font-black mt-2" id="profileName">...</div><div class="text-[10px] text-gray-400" id="profileRole">مستخدم</div></div>
<div class="p-3 space-y-5 pb-24">
<div id="kingPanel" class="hidden"><div class="text-[12px] text-yellow-600 font-black mb-2">👑 لوحة الملك السيادية</div><div class="bg-gradient-to-r from-yellow-400 to-orange-500 rounded-xl p-4 text-black text-xs space-y-2"><div class="flex justify-between"><span>👥 إجمالي المستخدمين:</span><b id="totalUsers">0</b></div><div class="flex justify-between"><span>📄 المنشورات:</span><b id="totalPosts">0</b></div><div class="flex justify-between"><span>💰 المحافظ:</span><b id="totalWallets">0</b></div><button onclick="fetch('/api/ping').then(r=>r.json()).then(d=>alert(JSON.stringify(d)))" class="w-full bg-black text-yellow-400 py-2 rounded-lg font-bold mt-2">🔍 فحص النظام</button></div></div>
<div><div class="text-[12px] text-gray-500 mb-2">الأصول</div><div class="bg-white rounded-xl"><button onclick="openWallet()" class="w-full flex justify-between p-4 text-[14px]"><span>💼 رصيد - <b id="balanceShow">0</b> 💰</span><span>></span></button></div></div>
<div><div class="text-[12px] text-gray-500 mb-2">الأدوات الشخصية</div><div class="bg-white rounded-xl text-[14px]"><button onclick="openTab('messages')" class="w-full flex justify-between p-4 border-b"><span>🕒 مركز الأنشطة</span><span>></span></button><button onclick="openOffline()" class="w-full flex justify-between p-4 border-b"><span>📥 فيديوهات دون اتصال</span><span>></span></button><button onclick="genQR()" class="w-full flex justify-between p-4"><span>🔳 رمز QR لديك</span><span>></span></button></div></div>
<div><div class="text-[12px] text-gray-500 mb-2">أدوات الإبداع والأعمال</div><div class="bg-white rounded-xl text-[14px]"><button class="w-full flex justify-between p-4 border-b"><span>🏪 المجموعة التجارية</span><span>></span></button><button class="w-full flex justify-between p-4 border-b"><span>✨ TikTok Studio</span><span>></span></button><button class="w-full flex justify-between p-4"><span>🔥 الترويج</span><span>></span></button></div></div>
<div><div class="bg-white rounded-xl"><button onclick="openTab('privacy')" class="w-full flex justify-between p-4 text-[14px]"><span>⚙️ الإعدادات والخصوصية</span><span>></span></button></div></div>
<div><div class="bg-white rounded-xl"><button onclick="logout()" class="w-full flex justify-between p-4 text-[14px] text-red-500"><span>🚪 تسجيل خروج</span><span>></span></button></div></div>
</div>
</main>
<main id="tab-create" class="hidden pt-16 p-4 space-y-3"><div class="font-black text-cyan-400 text-sm">✨ محطة الإنشاء</div><div class="grid grid-cols-2 gap-3"><button onclick="openCamera('user')" class="glass py-4 rounded-2xl text-xs">🤳 أمامية</button><button onclick="openCamera('environment')" class="glass py-4 rounded-2xl text-xs">📸 خلفية</button></div><input id="postText" placeholder="اكتب محتوى..." class="w-full bg-black/60 border border-white/10 rounded-xl p-3 text-xs outline-none mt-3"><button onclick="publishPost()" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">نشر فوري</button><video id="camPreview" autoplay muted playsinline class="w-full rounded-xl bg-black aspect-video hidden"></video></main>
<main id="tab-operations" class="hidden pt-16 p-4"><div class="font-black text-cyan-400 text-sm">⚡ العمليات</div><div id="qrcode" class="flex justify-center p-3 bg-black/40 rounded-2xl mt-3"></div></main>
<main id="tab-messages" class="hidden pt-10 bg-white min-h-screen text-black"><div id="chatLogs" class="p-3"></div></main>
<main id="tab-ai" class="hidden pt-16 p-3"></main>
<main id="tab-support" class="hidden pt-16 p-3"></main>
<main id="tab-privacy" class="hidden pt-10 bg-[#f5f5f5] min-h-screen text-black"><div class="bg-white p-4 flex justify-between border-b"><button onclick="openTab('profile')">→</button><div>الإعدادات والخصوصية</div><div></div></div></main>
<main id="tab-live" class="hidden fixed inset-0 z-[600] bg-black flex flex-col"><video id="liveVideo" autoplay muted playsinline class="w-full flex-1"></video><div class="p-3"><button onclick="exitFullScreen()" class="w-full bg-red-600 py-3 rounded-xl text-xs">إنهاء</button></div></main>
<nav class="fixed bottom-0 left-0 right-0 glass h-16 flex justify-around items-center z-50 text-[10px]"><button onclick="openTab('home')">🏠 الرئيسية</button><button onclick="openTab('operations')">⚡</button><button onclick="openTab('create')" class="w-10 h-10 bg-cyan-500 rounded-full text-black flex items-center justify-center">+</button><button onclick="openTab('messages')">💬 الوارد</button><button onclick="openTab('profile')">👤 الملفات</button></nav>
<script>
const socket=io(); let currentUser='', currentRole='user', stream, facing='environment';
function switchAuth(m){document.getElementById('btnLoginTab').className=m==='login'?'flex-1 py-2 bg-cyan-500 text-black rounded-lg font-black':'flex-1 py-2 text-gray-400'; document.getElementById('btnRegTab').className=m==='register'?'flex-1 py-2 bg-cyan-500 text-black rounded-lg font-black':'flex-1 py-2 text-gray-400'; document.getElementById('mainAuthBtn').innerText=m==='login'?'دخول القلعة 🔑':'إنشاء حساب ✨'; document.getElementById('mainAuthBtn').onclick=m==='login'?doLogin:doRegister;}
function showMsg(t){const el=document.getElementById('authMsg'); el.innerText=t; el.classList.remove('hidden');}
async function doRegister(){const u=userPhone.value.trim(), p=userPass.value.trim(); if(!u||!p) return showMsg('اكمل البيانات'); const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})}); const d=await r.json(); if(d.error) return showMsg(d.error); localStorage.setItem('tarim_user',d.user); localStorage.setItem('tarim_role',d.role); localStorage.setItem('tarim_token',d.token); hideGate(d.user,d.role);}
async function doLogin(){const u=userPhone.value.trim(), p=userPass.value.trim(); if(!u||!p) return showMsg('اكمل البيانات'); const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})}); const d=await r.json(); if(d.error) return showMsg(d.error); localStorage.setItem('tarim_user',d.user); localStorage.setItem('tarim_role',d.role); localStorage.setItem('tarim_token',d.token); hideGate(d.user,d.role);}
function hideGate(user,role){currentUser=user; currentRole=role; authGate.style.display='none'; helloUser.innerText=user; profileName.innerText=user; profileAvatar.innerText=user.slice(0,2).toUpperCase(); profileRole.innerText=role==='KING'?'الملك 👑 - حساب القلعة السيادي':'مستخدم'; if(role==='KING'){kingBadge.classList.remove('hidden'); kingPanel.classList.remove('hidden');} openTab('home');}
function logout(){localStorage.clear(); location.reload();}
function openTab(name){['home','operations','create','messages','profile','ai','support','privacy','live'].forEach(t=>{const el=document.getElementById('tab-'+t); if(el) el.classList.add('hidden');}); const el=document.getElementById('tab-'+name); if(el) el.classList.remove('hidden');}
</script>
</body>
</html>

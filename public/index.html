<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.tailwindcss.com; img-src 'self' blob: data: https:; media-src 'self' blob:; connect-src 'self' https:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>TARIM OS | V8.7 TIKTOK + FULLSCREEN PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:system-ui;background:#030B1A;color:#fff;user-select:none;padding-bottom:80px;direction:rtl}
.glass{background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border:1px solid rgba(0,240,255,.2)}
.tab-content{display:none}.tab-content.active{display:block!important}
.hidden{display:none!important}
#toastBox{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;width:91%;max-width:320px;pointer-events:none}
/* V8.7 TRUE FULLSCREEN - شاشة كاملة 100% */
.fullscreen-live{position:fixed!important;top:0!important;left:0!important;right:0!important;bottom:0!important;z-index:99999!important;width:100vw!important;height:100vh!important;height:100dvh!important;background:#000!important;margin:0!important;max-width:100vw!important;border:none!important;border-radius:0!important}
.fullscreen-live video{width:100%!important;height:100%!important;object-fit:cover!important}
.live-controls-full{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(to top,rgba(0,0,0,.95),transparent);z-index:50}
body.live-active,html.live-active{overflow:hidden!important}
</style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">
<div id="authGate" class="fixed inset-0 z-[10000] bg-[#030B1A] flex items-center justify-center p-4">
<div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-cyan-500/40 text-center space-y-4">
<h1 class="text-2xl font-black text-cyan-400">TARIM OS 👑 V8.7</h1>
<p class="text-xs text-slate-400">TIKTOK FEED + FULLSCREEN LIVE PRO</p>
<input id="userPhoneOrEmail" type="text" value="AL" maxlength="30" autocomplete="username" spellcheck="false" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center">
<input id="userPass" type="password" value="123456" maxlength="64" autocomplete="current-password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center">
<button id="loginBtn" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl text-xs">دخول القلعة السيادية 🔑</button>
</div>
</div>
<div id="toastBox"></div>
<header class="w-full glass border-b border-cyan-500/20 px-4 py-3 flex justify-between items-center text-xs z-40 fixed top-0 left-0 right-0">
<span class="font-black text-cyan-300">TARIM OS V8.7 TIKTOK</span><span class="text-[10px] text-slate-400">تريم - حضرموت 🌴</span>
</header>
<main class="flex-1 w-full max-w-md mx-auto p-2 pt-[60px]">
<div id="tab-home" class="tab-content active space-y-3">
<div class="glass p-2 rounded-xl flex justify-between items-center border border-cyan-500/30 mx-1"><span id="homeUsernameDisplay" class="text-xs font-bold text-cyan-400">@AL 👑</span><span class="text-[10px] text-rose-400">🔴 مباشر • منشورات الجمهور</span></div>
<div id="activeLivesFeed" class="px-1 space-y-2"></div>
<div id="postsFeed" class="space-y-4 pb-4"></div>
</div>
<div id="tab-operations" class="tab-content space-y-4 p-2">
<div class="glass p-5 rounded-2xl text-center space-y-3 border border-cyan-500/40">
<button data-action="startLive" class="w-full bg-rose-500 text-white p-4 rounded-xl font-bold text-xs">🔴 بدء بث ملء الشاشة الكامل</button>
<button data-action="goInbox" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-xl flex justify-between text-xs"><span>💬 المراسلة</span><span>فتح ←</span></button>
<div id="mapContainer" class="hidden w-full h-64 rounded-xl border border-slate-700"></div>
<div id="qrDisplay" class="hidden bg-white p-3 rounded-xl w-fit mx-auto"><div id="operationsQrBox"></div></div>
</div>
</div>
<div id="tab-create" class="tab-content space-y-2">
<div class="glass p-0 rounded-2xl overflow-hidden border border-cyan-500/40">
<div id="cameraWrap" class="relative w-full h-[50vh] bg-black overflow-hidden">
<video id="cameraPreview" autoplay playsinline muted class="w-full h-full object-cover"></video>
<div id="liveBadge" class="hidden absolute top-3 left-3 bg-rose-500 text-white px-3 py-1 rounded-full text-[10px] z-30">🔴 LIVE <span id="liveViewers">1</span> • <span id="liveTimer">00:00</span> • ❤️<span id="liveLikesTop">0</span></div>
<button id="endLiveTopBtn" class="hidden absolute top-3 right-3 bg-black/70 text-white px-4 py-2 rounded-full text-xs z-40 border border-white/30">✕ إنهاء</button>
<div id="giftAnim" class="absolute bottom-32 left-0 right-0 text-center text-6xl pointer-events-none z-30"></div>
<div id="liveComments" class="absolute bottom-24 left-2 right-2 max-h-24 overflow-y-auto text-[11px] text-white space-y-1 z-30 bg-black/30 p-2 rounded-xl"></div>
<div id="liveControlsFull" class="live-controls-full hidden flex-col gap-2">
<div class="flex gap-2"><input id="liveCommentInput" maxlength="100" placeholder="اكتب تعليق..." class="flex-1 bg-black/60 border border-white/20 rounded-full px-4 py-2 text-xs text-white"><button id="sendLiveCommentBtn" class="bg-cyan-500 text-black px-4 py-2 rounded-full text-xs font-bold">إرسال</button></div>
<div class="flex justify-between"><div class="flex gap-2"><button id="stopLiveBtnFull" class="bg-rose-500 text-white px-6 py-3 rounded-full font-bold text-xs">⏹️ إنهاء</button><button data-action="switchCam" class="bg-white/20 text-white px-4 py-3 rounded-full text-xs">🔄</button></div><div class="flex gap-2"><button id="sendGiftBtnFull" class="bg-gradient-to-r from-yellow-500 to-orange-500 text-black px-4 py-3 rounded-full text-xs font-bold">🎁 هدية</button><button id="likeLiveBtnFull" class="bg-white/20 text-white px-5 py-3 rounded-full text-xs font-bold">❤️ <span id="likeCountFull">0</span></button></div></div>
</div>
</div>
<div class="p-3 space-y-2" id="normalControls">
<div class="grid grid-cols-2 gap-2 text-[11px]"><button data-action="filterNone" class="bg-slate-900 border border-slate-700 py-2 rounded-xl">✨ طبيعي</button><button data-action="filterBeauty" class="bg-slate-900 border border-pink-500/40 py-2 rounded-xl text-pink-300">💄 تجميل</button></div>
<button id="startLiveBtn" class="w-full bg-rose-500 text-white py-3 rounded-xl font-bold">🔴 بدء البث - شاشة كاملة</button>
<textarea id="postContentInput" maxlength="1000" placeholder="اكتب وصف..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs h-14 text-right"></textarea>
<button id="publishBtn" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">🚀 نشر في الرئيسية</button>
</div>
</div>
</div>
<div id="tab-inbox" class="tab-content p-2"><div class="glass p-4 rounded-2xl"><h3 class="text-sm font-black text-cyan-400 text-center">💬 الوارد</h3><div id="inboxMessagesList" class="max-h-[40vh] overflow-y-auto"></div></div></div>
<div id="tab-profile" class="tab-content p-2"><div id="profile-main" class="glass p-5 rounded-2xl text-center space-y-3 border border-cyan-500/40"><div class="w-16 h-16 bg-cyan-500 rounded-full mx-auto flex items-center justify-center text-xl font-black text-black">AL</div><h3 id="profileNameDisplay" class="text-sm font-black text-cyan-400">الإمبراطور AL</h3><div class="grid grid-cols-3 gap-2 text-xs border-y border-slate-800 py-2"><div><span id="countFollowers" class="block font-bold text-cyan-400">0</span>متابع</div><div><span id="countFollowing" class="block font-bold text-cyan-400">0</span>يتابع</div><div><span id="countLikes" class="block font-bold text-cyan-400">0</span>إعجاب</div></div><button id="logoutBtn" class="w-full bg-rose-500/20 border border-rose-500/50 text-rose-300 py-2 rounded-xl font-bold text-xs">🚪 خروج</button></div></div>
</main>
<nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-4 py-2 flex justify-around items-center z-40">
<button data-action="tabHome" class="nav-btn text-cyan-400 text-[10px]">🏰<br>الرئيسية</button>
<button data-action="tabOperations" class="nav-btn text-slate-400 text-[10px]">⚡<br>العمليات</button>
<button data-action="tabCreate" class="nav-btn text-slate-400 text-[10px]">➕<br>إنشاء</button>
<button data-action="tabInbox" class="nav-btn text-slate-400 text-[10px]">💬<br>الوارد</button>
<button data-action="tabProfile" class="nav-btn text-slate-400 text-[10px]">👤<br>الملفات</button>
</nav>
<script src="./app.js"></script>
</body>
</html>

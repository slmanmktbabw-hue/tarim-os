<!-- هذا الجزء من العمليات - زي الصورة حقك -->
<main id="tab-operations" class="hidden min-h-screen pt-16 p-4 space-y-3">
  <div class="font-black text-cyan-400 text-sm">⚡ قسم العمليات السيادية</div>
  <button onclick="startLive()" class="glass w-full p-3 rounded-xl text-right text-xs flex justify-between border-red-500/30">
    <span class="text-red-400">🔴 بث مباشر سيادي (8 دقائق)</span><span>بدء ←</span>
  </button>
  <button onclick="showToast('قريباً')" class="glass w-full p-3 rounded-xl text-right text-xs flex justify-between">
    <span>المراسلة الامنة 💬</span><span>فتح ←</span>
  </button>
  <button onclick="showToast('قريباً')" class="glass w-full p-3 rounded-xl text-right text-xs flex justify-between">
    <span>خريطة حضرموت Offline 🗺️</span><span>عرض ←</span>
  </button>
  <div class="font-black text-xs">الختم الميداني QR</div>
  <div id="qrcode" class="glass p-4 rounded-xl flex justify-center"></div>
</main>

<!-- هذا جزء الانشاء - زي الصورة حقك -->
<main id="tab-create" class="hidden min-h-screen pt-16 p-4 space-y-3">
  <div class="font-black text-cyan-400 text-sm text-center">✨ محطة الانشاء السيادي</div>
  <div class="grid grid-cols-3 gap-2">
    <button class="glass p-3 rounded-xl text-xs">تبديل 🖼️</button>
    <button class="glass p-3 rounded-xl text-xs">خلفية 📸</button>
    <button class="glass p-3 rounded-xl text-xs">امية 🤳</button>
  </div>
  <div class="grid grid-cols-2 gap-2">
    <button onclick="document.getElementById('imgInput').click()" class="glass p-3 rounded-xl text-xs">رفع صورة 🖼️</button>
    <input type="file" id="imgInput" class="hidden">
    <button onclick="document.getElementById('vidInput').click()" class="glass p-3 rounded-xl text-xs text-yellow-400">رفع فيديو 📦</button>
    <input type="file" id="vidInput" class="hidden">
  </div>
  <button onclick="startLive()" class="glass w-full py-4 rounded-xl font-bold text-red-400">LIVE 🔴</button>
  <button class="glass w-full p-3 rounded-xl text-xs">منشور نص 📄</button>
  <input placeholder="اكتب وصف للمنشور..." class="w-full bg-black/60 rounded-xl p-3 text-xs">
  <button onclick="showToast('تم النشر')" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">نشر فوري</button>
</main>

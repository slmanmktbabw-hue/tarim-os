<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TARIM OS V28.2 KING LIVE FIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>.glass{background:rgba(15,23,42,0.92);backdrop-filter:blur(14px);border:1px solid rgba(0,240,255,0.2)}body{background:#050b14;color:#fff;font-family:sans-serif;overflow-x:hidden}</style>
</head>
<body class="min-h-screen pb-24">
<div id="authGate" class="fixed inset-0 z-[400] bg-[#050b14]/98 flex items-center justify-center p-4">
<div class="w-full max-w-sm glass rounded-3xl p-6 text-center space-y-3 border-cyan-500/40">
<div class="text-3xl font-black text-cyan-400">TARIM OS 🏰</div>
<div class="text-xs text-gray-300">tarimos.org - V28.2 FIX 👑</div>
<div class="flex bg-black/50 rounded-xl p-1 mt-2 text-xs">
<button id="btnLoginTab" onclick="switchAuth('login')" class="flex-1 py-2 rounded-lg bg-cyan-500 text-black font-black">دخول</button>
<button id="btnRegTab" onclick="switchAuth('register')" class="flex-1 py-2 rounded-lg text-gray-400">إنشاء حساب</button>
</div>
<input id="userPhone" type="text" placeholder="اسم المستخدم" class="w-full bg-black/60 border border-cyan-500/30 rounded-xl p-3 text-xs text-center text-white font-bold outline-none mt-2">
<input id="userPass" type="password" placeholder="كلمة المرور" class="w-full bg-black/60 border border-cyan-500/30 rounded-xl p-3 text-xs text-center text-white font-bold outline-none">
<div id="authMsg" class="text-[10px] text-red-400 hidden"></div>
<button id="mainAuthBtn" onclick="doLogin()" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">دخول القلعة 🔑</button>
</div>
</div>

<header class="fixed top-0 left-0 right-0 z-50 glass px-4 py-3 flex justify-between items-center text-xs font-bold border-b border-white/10">
<button onclick="openTab('support')" class="text-yellow-400">🛡️ الدعم</button><div class="text-cyan-400">TARIM OS V28.2</div><button onclick="openTab('ai')" class="text-cyan-400">👁️ الذكاء</button>
</header>

<main id="tab-home" class="min-h-screen pt-16 p-3 space-y-3">
<div class="flex justify-between items-center glass p-3 rounded-2xl"><div><div class="text-xs text-gray-400">مرحبا <b id="helloUser">...</b> <span id="kingBadge" class="hidden bg-yellow-500 text-black text-[8px] px-2 py-0.5 rounded-full">الملك 👑</span></div><div class="text-[10px] text-cyan-400 font-mono">OKX: 0x53ce...0af6 | هدايا: <b id="giftTotalTop">0</b></div></div><span id="balanceTop" class="bg-cyan-500/20 text-cyan-300 text-[10px] px-2.5 py-1 rounded-full">0 💰</span></div>
<div id="feed" class="space-y-3"></div>
</main>

<main id="tab-operations" class="hidden min-h-screen pt-16 p-4 space-y-4">
<div class="font-black text-cyan-400 text-sm">⚡ العمليات السيادية</div>
<div class="grid grid-cols-1 gap-3">
<button onclick="startLive()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between border-red-500/30"><span class="text-red-400">🔴 بث مباشر حقيقي + جمهور + هدايا</span><span>بدء ←</span></button>
<button onclick="openTab('messages')" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span>💬 المراسلة</span><span>فتح ←</span></button>
<button onclick="openOffline()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span>🗺️ بدون نت</span><span>عرض ←</span></button>
<button onclick="genQR()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span>🔏 QR</span><span>إصدار ←</span></button>
</div>
<div id="qrcode" class="flex justify-center p-3 bg-black/40 rounded-2xl mt-3"></div>
</main>

<main id="tab-create" class="hidden min-h-screen pt-16 p-4 space-y-3">
<div class="font-black text-cyan-400 text-sm">✨ الإنشاء السيادي</div>
<div class="grid grid-cols-2 gap-3"><button onclick="openCamera('user')" class="glass py-4 rounded-2xl font-bold text-xs">🤳 أمامية</button><button onclick="openCamera('environment')" class="glass py-4 rounded-2xl font-bold text-xs">📸 خلفية</button></div>
<input id="postText" placeholder="اكتب منشورك..." class="w-full bg-black/60 border border-white/10 rounded-xl p-3 text-xs outline-none mt-3"><button onclick="publishPost()" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">نشر فوري</button>
<video id="camPreview" autoplay muted playsinline class="w-full rounded-xl bg-black aspect-video hidden"></video>
</main>

<main id="tab-profile" class="hidden min-h-screen pt-16 bg-[#f5f5f5] text-black">
  <div class="bg-white p-6 flex flex-col items-center border-b"><div id="profileAvatar" class="w-20 h-20 bg-cyan-500/20 rounded-full flex items-center justify-center text-2xl font-black text-cyan-600">GO</div><div class="font-black mt-2" id="profileName">...</div><div class="text-[10px] text-gray-400" id="profileRole">مستخدم</div></div>
  <div class="p-3 space-y-4 pb-24">
    <div id="kingPanel" class="hidden bg-gradient-to-r from-yellow-400 to-orange-500 rounded-xl p-4 text-black text-xs space-y-1"><div>👥 <b id="totalUsers">0</b></div><div>📄 <b id="totalPosts">0</b></div><div>👁️ <b id="totalViewers">0</b></div><div>🎁 <b id="totalGifts">0</b></div></div>
    <div class="bg-white rounded-xl"><button onclick="openWallet()" class="w-full flex justify-between p-4 text-[14px]"><span>💼 <b id="balanceShow">0</b> 💰 | هدايا <b id="giftShow">0</b></span><span><</span></button></div>
    <div class="bg-white rounded-xl"><button onclick="openTab('privacy')" class="w-full flex justify-between p-4 text-[14px]"><span>⚙️ الإعدادات</span><span><</span></button></div>
    <div class="bg-white rounded-xl"><button onclick="logout()" class="w-full flex justify-between p-4 text-red-500 text-[14px]"><span>🚪 خروج</span><span><</span></button></div>
  </div>
</main>

<main id="tab-messages" class="hidden min-h-screen pt-10 bg-white text-black"><div class="p-3 font-black border-b">صندوق الوارد 🟢</div><div id="chatLogs" class="p-3 space-y-2"></div><div class="fixed bottom-16 left-0 right-0 p-2 bg-white border-t flex gap-2"><input id="chatIn" placeholder="رسالة..." class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-xs text-black outline-none"><button onclick="sendMsg()" class="bg-black text-white px-5 rounded-full text-xs">إرسال</button></div></main>
<main id="tab-privacy" class="hidden min-h-screen pt-16 p-4 bg-[#f5f5f5] text-black">إعدادات محمية V28.2</main>
<main id="tab-ai" class="hidden min-h-screen pt-16 p-3 flex flex-col"><div class="font-black text-cyan-400 text-sm">👁️ عين الذكاء</div><div id="aiLogs" class="flex-1 my-3 space-y-2"></div><div class="flex gap-2 p-2 glass rounded-2xl"><input id="aiIn" placeholder="اسأل..." class="flex-1 bg-transparent text-xs p-2 outline-none"><button onclick="sendAI()" class="bg-cyan-500 text-black px-4 py-2 rounded-xl text-xs font-black">إرسال</button></div></main>
<main id="tab-support" class="hidden min-h-screen pt-16 p-3 flex flex-col"><div class="font-black text-yellow-400 text-sm">🛡️ الدعم</div><div id="supportLogs" class="flex-1 my-3 space-y-2 overflow-y-auto"></div><div class="flex gap-2 p-2 glass rounded-2xl"><input id="supportIn" placeholder="راسل الدعم..." class="flex-1 bg-transparent text-xs p-2 outline-none"><button onclick="sendSupport()" class="bg-yellow-500 text-black px-4 py-2 rounded-xl text-xs font-black">إرسال</button></div></main>

<main id="tab-live" class="hidden fixed inset-0 z-[999] bg-black">
<video id="liveVideo" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover bg-black"></video>
<div class="absolute top-0 left-0 right-0 p-3 pt-10 flex justify-between z-20 bg-gradient-to-b from-black/80 to-transparent">
<div class="flex gap-2"><div class="bg-black/60 px-3 py-1.5 rounded-full text-[11px]">👁️ <span id="viewerCount">0</span> مشاهد</div><div class="bg-red-600 px-3 py-1.5 rounded-full text-[10px] font-black animate-pulse">🔴 LIVE</div></div>
<div class="flex gap-2"><button onclick="toggleFlash()" class="w-9 h-9 bg-black/50 rounded-full text-white">🔦</button><button onclick="exitLive()" class="w-9 h-9 bg-black/50 rounded-full text-white">✕</button></div>
</div>
<div id="liveComments" class="absolute bottom-[160px] left-2 right-2 max-h-[35vh] overflow-y-auto space-y-1 text-[12px] z-10"></div>
<div id="liveGiftAnim" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-7xl hidden z-20"></div>
<div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black via-black/80 to-transparent space-y-3 z-20">
<div class="flex gap-2"><div class="flex-1 bg-white/15 rounded-full flex items-center px-4"><input id="liveCommentIn" placeholder="اكتب تعليق..." class="bg-transparent flex-1 py-3 text-xs outline-none text-white"><button onclick="sendLiveComment()" class="text-cyan-400 text-xs font-bold">إرسال</button></div><button onclick="sendLiveLike()" class="w-12 h-12 bg-white/15 rounded-full">❤️<div class="text-[8px]" id="likeTotal">0</div></button><button onclick="sendGift('وردة',10)" class="w-12 h-12 bg-yellow-500/20 rounded-full">🌹</button><button onclick="sendGift('تاج',100)" class="w-12 h-12 bg-yellow-400 rounded-full text-black">👑</button></div>
<div class="grid grid-cols-2 gap-2"><button id="btnStartLive" onclick="goLive()" class="bg-[#ff2d55] py-4 rounded-full font-black text-sm">🔴 تشغيل البث - شاشة كامل</button><button id="btnEndLive" onclick="exitLive()" class="hidden bg-zinc-800 py-4 rounded-full font-black text-sm">⏹️ إغلاق البث</button></div>
<div class="flex justify-between text-[10px] text-white/70"><span>🛡️ حماية</span><span>هدايا: <b id="giftTotal">0</b></span><span>جمهور: <b id="viewerCountBottom">0</b></span></div>
</div>
</main>

<nav class="fixed bottom-0 left-0 right-0 glass h-16 border-t border-white/10 flex justify-around items-center z-50 text-[10px]"><button onclick="openTab('home')" class="flex flex-col items-center text-cyan-400"><span class="text-lg">🏠</span>الرئيسية</button><button onclick="openTab('operations')" class="flex flex-col items-center text-gray-400"><span class="text-lg">⚡</span>العمليات</button><button onclick="openTab('create')" class="flex flex-col items-center"><span class="w-10 h-10 bg-cyan-500 text-black rounded-full flex items-center justify-center text-xl font-black">+</span></button><button onclick="openTab('messages')" class="flex flex-col items-center text-gray-400"><span class="text-lg">💬</span>الوارد</button><button onclick="openTab('profile')" class="flex flex-col items-center text-gray-400"><span class="text-lg">👤</span>الملفات</button></nav>

<script>
const socket=io(); let currentUser=localStorage.getItem('tarim_user')||''; let currentRole=localStorage.getItem('tarim_role')||'user'; let token=localStorage.getItem('tarim_token')||''; let stream; let torch=false; let facing="environment"; let authMode='login'; let likeCount=0; let giftCount=0;
function cleanFront(t){return (t||"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function switchAuth(m){authMode=m; btnLoginTab.className=m==='login'?'flex-1 py-2 rounded-lg bg-cyan-500 text-black font-black':'flex-1 py-2 rounded-lg text-gray-400'; btnRegTab.className=m==='register'?'flex-1 py-2 rounded-lg bg-cyan-500 text-black font-black':'flex-1 py-2 rounded-lg text-gray-400'; mainAuthBtn.innerText=m==='login'?'دخول القلعة 🔑':'إنشاء حساب ✨'; mainAuthBtn.onclick=m==='login'?doLogin:doRegister;}
function showMsg(t){authMsg.innerText=t; authMsg.classList.remove('hidden'); setTimeout(()=>authMsg.classList.add('hidden'),3000);}
async function doRegister(){const u=userPhone.value.trim(); const p=userPass.value.trim(); if(!u||!p) return showMsg('اكمل'); const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})}); const d=await r.json(); if(d.error) return showMsg(d.error); localStorage.setItem('tarim_user',d.user); localStorage.setItem('tarim_role',d.role||'user'); localStorage.setItem('tarim_token',d.token); hideGate(d.user,d.role);}
async function doLogin(){const u=userPhone.value.trim(); const p=userPass.value.trim(); if(!u||!p) return showMsg('اكمل'); const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})}); const d=await r.json(); if(d.error) return showMsg(d.error); localStorage.setItem('tarim_user',d.user); localStorage.setItem('tarim_role',d.role); localStorage.setItem('tarim_token',d.token); hideGate(d.user,d.role);}
function hideGate(user,role){currentUser=user; currentRole=role||'user'; authGate.style.display='none'; helloUser.innerText=user; profileName.innerText=user; profileAvatar.innerText=user.slice(0,2).toUpperCase(); profileRole.innerText=role==='KING'?'الملك 👑':'مستخدم'; if(role==='KING'){kingBadge.classList.remove('hidden'); kingPanel.classList.remove('hidden'); fetch('/api/ping').then(r=>r.json()).then(d=>{totalUsers.innerText=d.users||0; totalPosts.innerText=d.posts||0; totalViewers.innerText=d.viewers||0;});} loadWallet(); openTab('home');}
function logout(){localStorage.clear(); location.reload();}
function openTab(name){['home','operations','create','messages','profile','ai','support','privacy','live'].forEach(t=>{const el=document.getElementById('tab-'+t); if(el){el.classList.add('hidden'); el.style.display='none';}}); const target=document.getElementById('tab-'+name); if(target){target.classList.remove('hidden'); target.style.display='flex'; target.style.flexDirection='column';}}
window.onload=()=>{const u=localStorage.getItem('tarim_user'); const t=localStorage.getItem('tarim_token'); if(u&&t) hideGate(u,localStorage.getItem('tarim_role')); fetch('/api/posts').then(r=>r.json()).then(renderFeed);};
function renderFeed(posts){const feed=document.getElementById('feed'); if(!feed) return; if(!posts||!posts.length){feed.innerHTML='<div class="glass p-4 rounded-2xl text-xs text-center text-gray-400">لا يوجد منشورات</div>'; return;} feed.innerHTML=posts.map(p=>`<div class="glass p-3 rounded-2xl"><div class="text-[10px] text-cyan-400">${cleanFront(p.user)}</div><div class="text-xs mt-1">${cleanFront(p.text)}</div></div>`).join('');}
function publishPost(){const text=postText.value; if(!text) return; fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:currentUser,text:text})}).then(()=>{postText.value=''; openTab('home');});}
socket.on('broadcast_post',(p)=>renderFeed(p));
function sendMsg(){const txt=chatIn.value; if(!txt) return; chatLogs.innerHTML+=`<div class="glass p-2 rounded-xl text-xs"><b>${cleanFront(currentUser)}:</b> ${cleanFront(txt)}</div>`; chatIn.value='';}
async function openCamera(f){facing=f; openTab('create'); const v=camPreview; v.classList.remove('hidden'); try{if(stream) stream.getTracks().forEach(t=>t.stop()); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:f}}); v.srcObject=stream; await v.play();}catch(e){alert('اسمح للكاميرا');}}
async function startLive(){openTab('live'); const tab=document.getElementById('tab-live'); tab.classList.remove('hidden'); tab.style.display='flex'; try{if(stream) stream.getTracks().forEach(t=>t.stop()); stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}); liveVideo.srcObject=stream; await liveVideo.play();}catch(e){alert('اسمح للكاميرا والمايك');}}
function toggleCameraFacing(){facing=facing=="environment"?"user":"environment"; startLive();}
async function toggleFlash(){try{const track=stream.getVideoTracks()[0]; const caps=track.getCapabilities(); if(!caps.torch) return alert('لا يدعم فلاش'); torch=!torch; await track.applyConstraints({advanced:[{torch:torch}]});}catch(e){alert('شغل البث اولا');}}
function setFilter(t){const v=camPreview; if(t==='beauty') v.style.filter='brightness(1.2) saturate(1.3)'; else if(t==='bw') v.style.filter='grayscale(1)'; else v.style.filter='none';}
function genQR(){const c=document.getElementById('qrcode'); c.innerHTML=''; new QRCode(c,{text:"https://tarimos.org/user="+currentUser,width:140,height:140}); openTab('operations');}
function openOffline(){const box=document.getElementById('feed'); box.innerHTML=`<div class="glass p-4 rounded-2xl text-xs"><video controls id="offlinePlayer" class="w-full rounded-xl bg-black aspect-video"></video><input type="file" accept="video/*" onchange="playFile(this)" class="w-full mt-2 bg-black/50 p-2 rounded-xl"></div>`; openTab('home');}
function playFile(i){const f=i.files[0]; if(!f) return; offlinePlayer.src=URL.createObjectURL(f);}
function openWallet(){fetch('/api/wallet/'+currentUser).then(r=>r.json()).then(d=>{balanceShow.innerText=d.balance||0; balanceTop.innerText=(d.balance||0)+' 💰'; giftShow.innerText=d.gifts||0; giftTotalTop.innerText=d.gifts||0;});}
function loadWallet(){openWallet();}
function sendSupport(){const q=supportIn.value; if(!q) return; supportLogs.innerHTML+=`<div class="glass p-2 rounded-xl text-xs"><b>أنت:</b> ${cleanFront(q)}</div>`; fetch('/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:currentUser,text:q})}).then(r=>r.json()).then(d=>{supportLogs.innerHTML+=`<div class="glass p-2 rounded-xl text-xs border-yellow-500/30"><b>الدعم:</b> ${cleanFront(d.reply)}</div>`;}); supportIn.value='';}
function sendAI(){const q=aiIn.value; if(!q) return; aiLogs.innerHTML+=`<div class="glass p-2 rounded-xl text-xs"><b>أنت:</b> ${cleanFront(q)}</div><div class="glass p-2 rounded-xl text-xs"><b>الذكاء:</b> سيتم الرد يا ملك 👑</div>`; aiIn.value='';}
async function goLive(){if(!stream){await startLive(); return;} btnStartLive.classList.add('hidden'); btnEndLive.classList.remove('hidden'); socket.emit('king_live_start',{user:currentUser}); socket.emit('join_live',{user:currentUser}); if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});}
function exitLive(){if(stream) stream.getTracks().forEach(t=>t.stop()); btnStartLive.classList.remove('hidden'); btnEndLive.classList.add('hidden'); document.getElementById('tab-live').classList.add('hidden'); document.getElementById('tab-live').style.display='none'; socket.emit('end_live'); socket.emit('leave_live',{user:currentUser}); if(document.fullscreenElement) document.exitFullscreen(); openTab('home');}
function sendLiveLike(){likeCount++; likeTotal.innerText=likeCount; socket.emit('live_like',{user:currentUser,count:likeCount});}
function sendLiveComment(){const t=liveCommentIn.value; if(!t) return; socket.emit('live_comment',{user:currentUser,text:t}); liveCommentIn.value='';}
function sendGift(name,val){giftCount+=val; giftTotal.innerText=giftCount; liveGiftAnim.innerText=name==='وردة'?'🌹':'👑'; liveGiftAnim.classList.remove('hidden'); setTimeout(()=>liveGiftAnim.classList.add('hidden'),1000); socket.emit('live_gift',{from:currentUser,to:currentUser,gift:name,value:val});}
socket.on('new_comment',d=>{liveComments.innerHTML+=`<div class="bg-black/60 rounded-full px-3 py-1 mb-1"><b class="text-cyan-400">${cleanFront(d.user)}:</b> ${cleanFront(d.text)}</div>`; liveComments.scrollTop=liveComments.scrollHeight;});
socket.on('new_like',d=>{likeTotal.innerText=d.count;});
socket.on('new_gift',d=>{giftTotal.innerText=parseInt(giftTotal.innerText)+d.value; liveComments.innerHTML+=`<div class="bg-yellow-500/30 rounded-full px-3 py-1 mb-1">🎁 ${cleanFront(d.from)} أرسل ${cleanFront(d.gift)}</div>`;});
socket.on('viewers_update',d=>{viewerCount.innerText=d.count; viewerCountBottom.innerText=d.count; totalViewers.innerText=d.count;});
socket.on('wallet_update',d=>{if(d.user===currentUser) balanceTop.innerText=d.balance+' 💰';});
</script>
</body>
                          </html>

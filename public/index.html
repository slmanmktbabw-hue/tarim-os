<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TARIM OS v14.3 - النظام السيادي</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="/socket.io/socket.io.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap" rel="stylesheet">

<!-- 🔥 الدمج السيادي للـ PWA الحقيقي -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080c14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

<style>*{font-family:'Tajawal',sans-serif}body{background:#080c14}.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px)}</style>
</head>
<body class="text-white min-h-screen pb-28">

<!-- بوابة الدخول -->
<div id="authGate" class="fixed inset-0 z-[100] bg-[#080c14] flex items-center justify-center p-4">
<div class="w-full max-w-[360px] bg-[#0e1524] border border-cyan-500/25 rounded-[24px] p-6 text-center">
<h2 class="font-black text-cyan-400">TARIM OS v14.3 - بوابة الأمان</h2>
<input id="userPhone" placeholder="رقم الجوال" class="w-full mt-4 mb-3 bg-black/60 border border-white/10 rounded-2xl px-4 py-3 text-center text-xs">
<input id="userPass" type="password" placeholder="كلمة السر" class="w-full mb-4 bg-black/60 border border-white/10 rounded-2xl px-4 py-3 text-center text-xs">
<button onclick="loginCEO()" class="w-full bg-gradient-to-r from-cyan-400 to-blue-600 text-black font-black py-3.5 rounded-2xl text-xs">فتح القلعة 🏰</button>
</div></div>

<header class="sticky top-0 z-40 bg-black/90 border-b border-white/10 px-3 py-2.5 flex justify-between items-center">
<div class="flex gap-2 items-center"><button id="backBtn" onclick="goBack()" class="hidden w-8 h-8 bg-white/10 rounded-full">←</button><span class="font-black text-cyan-400 text-[11px]">TARIM OS v14.3</span></div>
<div class="flex gap-2"><button id="installBtn" onclick="installAppPrompt()" class="bg-yellow-500 text-black text-[9px] font-black px-2 py-1 rounded-lg hidden">📥 تثبيت</button><span onclick="openTab('ai')" class="bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 text-[9px] px-2 py-1 rounded-full cursor-pointer">TARIM OS - فريق الدعم AL</span></div>
</header>

<main id="tab-home" class="p-3 space-y-3">
<div id="homeBanner" class="h-[200px] rounded-[22px] bg-cover flex items-end p-3" style="background-image:linear-gradient(transparent,rgba(0,0,0,.9)),url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800')"><span class="font-black text-sm text-cyan-300">🔴 بث مباشر سيادي</span></div>
<div id="tasksContainer" class="space-y-2"></div>
<button onclick="showToast('⚡ تم التنفيذ')" class="w-full glass p-3 rounded-xl text-xs font-bold text-cyan-300">⚡ تنفيذ أمر سيادي</button>
</main>

<main id="tab-operations" class="p-3 hidden"><h3 class="font-black text-cyan-400">العمليات <button onclick="goBack()" class="bg-white/10 px-2 rounded-full text-xs">رجوع</button></h3></main>
<main id="tab-messages" class="p-3 hidden"><div id="chatLogs" class="h-[60vh] overflow-y-auto"></div><div class="flex gap-2 mt-2"><input id="chatIn" class="flex-1 bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs"><button onclick="sendMsg()" class="bg-cyan-500 text-black px-4 py-2 rounded-xl">إرسال</button></div></main>
<main id="tab-profile" class="p-3 hidden"><div id="userDisplay" class="text-cyan-400"></div><input id="bgUrlInput" placeholder="رابط الخلفية" class="w-full bg-black/60 border rounded-xl px-3 py-2 text-xs mt-2"><button onclick="changeUserBackground()" class="bg-cyan-500 text-black px-3 py-2 rounded-xl text-xs mt-2">تطبيق الخلفية</button></main>

<!-- هذا هو ملف فريق الدعم AL المدمج -->
<main id="tab-ai" class="p-3 hidden">
<div class="glass p-4 rounded-2xl text-center space-y-3">
<div class="flex justify-between"><span class="font-black text-cyan-400 text-xs">TARIM OS - فريق الدعم AL 🛡️</span><button onclick="goBack()" class="bg-white/10 px-3 py-1 rounded-full text-xs">رجوع</button></div>
<canvas id="qr" width="160" height="160" class="bg-white rounded-xl hidden mx-auto"></canvas>
<div id="sealCode" class="text-xs text-cyan-300"></div>
<button onclick="genQR()" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-xs w-full">توليد الختم الميداني 🔏</button>
<div id="aiRes" class="text-xs bg-black/40 p-3 rounded-xl">فريق الدعم AL جاهز...</div>
</div>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-[#080c14] border-t border-white/10 py-2 flex justify-around"><button onclick="openTab('home')" data-nav="home" class="text-cyan-400">🏠</button><button onclick="openTab('operations')" data-nav="operations" class="text-white/40">👁️</button><button onclick="openCreate()" class="w-12 h-12 bg-cyan-400 rounded-full text-black text-2xl -mt-6">+</button><button onclick="openTab('messages')" data-nav="messages" class="text-white/40">💬</button><button onclick="openTab('profile')" data-nav="profile" class="text-white/40">👑</button></nav>
<div id="toastBox" class="fixed top-16 left-1/2 -translate-x-1/2 z-[200]"></div>
<div id="createSheet" class="fixed inset-0 hidden"><div onclick="closeCreate()" class="absolute inset-0 bg-black/80"></div></div>

<!-- 🔥 الدمج النهائي للسكربتات -->
<script src="/script.js"></script>
<script>
// تسجيل الـ Service Worker للتثبيت الحقيقي
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(r=>console.log('✅ PWA Ready')).catch(e=>console.log(e));
  });
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').classList.remove('hidden');});
function installAppPrompt(){if(deferredPrompt){deferredPrompt.prompt();}}
</script>
</body>
</html>

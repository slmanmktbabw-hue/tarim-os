<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- CSP محكم ومحصن -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com https://cdn.socket.io; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' blob: data: https:; media-src 'self' blob:; connect-src 'self' https: wss:; font-src 'self' data:; frame-ancestors 'none';">
<title>TARIM OS | V8.4 ULTIMATE SECURE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
body{font-family:system-ui;background:#030B1A;color:#fff;user-select:none;padding-bottom:80px;direction:rtl}
.glass{background:rgba(15,23,42,.95);backdrop-filter:blur(12px);border:1px solid rgba(0,240,255,.2)}
.tab-content{display:none}.tab-content.active{display:block!important}
.hidden{display:none!important}
#toastBox{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;width:91%;max-width:320px;pointer-events:none}
.fullscreen-live{position:fixed!important;inset:0!important;z-index:9999!important;width:100vw!important;height:100vh!important;border-radius:0!important;background:#000!important}
.fullscreen-live video{width:100%!important;height:100%!important;object-fit:cover!important}
.live-controls-full{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(to top,rgba(0,0,0,.95),transparent);z-index:30}
</style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

<!-- نافذة المصادقة السيادية (تمت إزالة القيم الافتراضية المكشوفة) -->
<div id="authGate" class="fixed inset-0 z-[10000] bg-[#030B1A] flex items-center justify-center p-4">
  <div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-cyan-500/40 text-center space-y-4">
    <h1 class="text-2xl font-black text-cyan-400">TARIM OS 👑 V8.4 SECURE</h1>
    <p class="text-xs text-slate-400">ULTIMATE - محصن 100%</p>
    <input id="userPhoneOrEmail" type="text" placeholder="اسم المستخدم أو البريد" maxlength="30" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:outline-none focus:border-cyan-400">
    <input id="userPass" type="password" placeholder="كلمة المرور" maxlength="64" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:outline-none focus:border-cyan-400">
    <button id="loginBtn" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl text-xs">دخول القلعة السيادية 🔑</button>
    <p id="authMsg" class="text-[11px] text-rose-400"></p>
  </div>
</div>

<div id="toastBox"></div>

<header class="w-full glass border-b border-cyan-500/20 px-4 py-3 flex justify-between items-center text-xs z-40 fixed top-0 left-0 right-0">
<button id="aiEyeBtn" class="text-cyan-400 font-bold">👁️ عين الذكاء</button>
<span class="font-black text-cyan-300 tracking-wider">TARIM OS V8.4 SECURE</span>
<button id="supportBtn" class="text-slate-300 font-bold">🛡️ الدعم</button>
</header>

<main class="flex-1 w-full max-w-md mx-auto p-4 pt-[70px] relative">
<div id="tab-home" class="tab-content active space-y-4">
<div class="glass p-3 rounded-xl flex justify-between items-center border border-cyan-500/30">
<span id="homeUsernameDisplay" class="text-xs font-bold text-cyan-400">@AL 👑</span>
<span class="text-[10px] text-slate-400">تريم - حضرموت 🌴</span>
</div>
<div id="postsFeed" class="space-y-3"></div>
</div>

<div id="tab-operations" class="tab-content space-y-4">
<div class="glass p-5 rounded-2xl text-center space-y-4 border border-cyan-500/40">
<h3 class="text-sm font-black text-cyan-400">⚡ قسم العمليات السيادية</h3>
<div class="grid grid-cols-1 gap-2 text-xs">
<button data-action="startLive" class="bg-slate-900 border border-rose-500/30 p-4 rounded-xl flex justify-between w-full"><span>🔴 بث مباشر سيادي</span><span>بدء ←</span></button>
<button data-action="goInbox" class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex justify-between w-full"><span>💬 المراسلة الآمنة</span><span>فتح ←</span></button>
<button data-action="openMap" class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex justify-between w-full"><span>🗺️ خريطة حضرموت</span><span>عرض ←</span></button>
<button data-action="showQR" class="bg-slate-900 border border-slate-700 p-4 rounded-xl flex justify-between w-full"><span>🔐 QR الختم الميداني</span><span>عرض ←</span></button>
</div>
<div id="mapContainer" class="hidden w-full h-64 rounded-xl border border-slate-700 mt-3"></div>
<div id="qrDisplay" class="hidden flex-col items-center p-3 bg-white rounded-xl w-fit mx-auto mt-2"><div id="operationsQrBox"></div></div>
</div>
</div>

<div id="tab-create" class="tab-content space-y-4">
<div class="glass p-0 rounded-2xl text-center space-y-0 border border-cyan-500/40 overflow-hidden">
<div class="p-3 flex justify-between items-center"><h3 class="text-sm font-black text-cyan-400">✨ محطة الإنشاء</h3></div>
<div id="cameraWrap" class="relative w-full h-[45vh] bg-black rounded-2xl overflow-hidden border border-cyan-500/20">
<video id="cameraPreview" autoplay playsinline muted class="w-full h-full object-cover"></video>
<div id="liveBadge" class="hidden absolute top-2 left-2 bg-rose-500 text-white px-3 py-1 rounded-full text-[10px]">🔴 LIVE • <span id="liveTimer">00:00</span></div>
<button id="endLiveTopBtn" class="hidden absolute top-2 right-2 bg-black/70 text-white px-4 py-2 rounded-full text-xs z-30">✕ إنهاء</button>
<div id="liveControlsFull" class="live-controls-full hidden flex gap-2 justify-center">
<button id="stopLiveBtnFull" class="bg-rose-500 text-white px-8 py-3 rounded-full font-bold text-xs">⏹️ إنهاء</button>
<button data-action="switchCam" class="bg-white/20 text-white px-4 py-3 rounded-full">🔄</button>
<button data-action="likeLive" class="bg-white/20 text-white px-4 py-3 rounded-full">❤️ <span id="liveLikesCount">0</span></button>
</div>
</div>
<div class="p-3 space-y-2" id="normalControls">
<div class="grid grid-cols-4 gap-2 text-[11px]">
<button data-action="filterNone" class="bg-slate-900 border border-slate-700 py-2.5 rounded-xl">✨ طبيعي</button>
<button data-action="filterBeauty" class="bg-slate-900 border border-pink-500/40 py-2.5 rounded-xl text-pink-300">💄 تجميل</button>
<button data-action="capturePhoto" class="bg-slate-900 border border-slate-700 py-2.5 rounded-xl">🖼️ صورة</button>
<button data-action="switchCam" class="bg-slate-900 border border-slate-700 py-2.5 rounded-xl">🔄 تبديل</button>
</div>
<textarea id="postContentInput" maxlength="1000" placeholder="اكتب وصف المنشور..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white h-16 resize-none text-right"></textarea>
<div class="grid grid-cols-2 gap-2">
<button id="publishBtn" class="bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">🚀 نشر</button>
<button id="startLiveBtn" class="bg-rose-500 text-white py-3 rounded-xl font-bold text-xs">🔴 بدء البث</button>
</div>
</div>
</div>
</div>

<div id="tab-inbox" class="tab-content space-y-4">
<div class="glass p-5 rounded-2xl space-y-3">
<div id="inboxMessagesList" class="space-y-2 text-right max-h-[45vh] overflow-y-auto"></div>
<div class="flex gap-2">
<input id="inboxInputField" type="text" placeholder="رسالتك..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-3 text-xs">
<button id="sendInboxMsgBtn" class="bg-cyan-500 text-black px-5 py-3 rounded-xl text-xs font-bold">إرسال</button>
</div>
</div>
</div>

<div id="tab-profile" class="tab-content space-y-4">
<div id="profile-main" class="glass p-5 rounded-2xl text-center space-y-4">
<div id="goAvatar" class="w-16 h-16 bg-cyan-500 rounded-full mx-auto flex items-center justify-center text-2xl font-black text-black">AL</div>
<h3 id="profileNameDisplay" class="text-sm font-black text-cyan-400">الإمبراطور AL</h3>
<div class="grid grid-cols-3 gap-2 py-2 text-xs border-y border-slate-800">
<div><span id="countFollowers" class="block font-bold text-cyan-400">0</span>متابع</div>
<div><span id="countFollowing" class="block font-bold text-cyan-400">0</span>يتابع</div>
<div><span id="countLikes" class="block font-bold text-cyan-400">0</span>إعجاب</div>
</div>
<button id="logoutBtn" class="w-full bg-rose-500/20 border border-rose-500/50 text-rose-300 py-2.5 rounded-xl font-bold">🚪 خروج</button>
</div>
<div id="sub-qr-page" class="sub-page hidden glass p-5 rounded-2xl text-center space-y-4">
<button data-action="backToProfile" class="text-xs text-cyan-400 font-bold block text-right">← رجوع</button>
<div id="qrcode" class="flex justify-center py-4 bg-white p-4 rounded-xl w-fit mx-auto"></div>
</div>
</div>
</main>

<nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-4 py-2 flex justify-around items-center z-40">
<button data-action="tabHome" class="nav-btn flex flex-col items-center text-cyan-400 text-[10px]"><span class="text-xl">🏰</span>الرئيسية</button>
<button data-action="tabOperations" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">⚡</span>العمليات</button>
<button data-action="tabCreate" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">➕</span>إنشاء</button>
<button data-action="tabInbox" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">💬</span>الوارد</button>
<button data-action="tabProfile" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">👤</span>الملفات</button>
</nav>

<script src="./app.js" defer></script>
</body>
</html>

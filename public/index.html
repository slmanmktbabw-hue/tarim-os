<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TARIM OS v14.3.1</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#080c14">
<style>
*{font-family:Tajawal,sans-serif}
html,body{height:100%;margin:0;background:#080c14;overflow:hidden}
body{padding-bottom:env(safe-area-inset-bottom)}
.glass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
#app{height:100vh;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding-bottom:90px}
</style>
</head>
<body>
<div id="app">

<div id="authGate" class="fixed inset-0 z-[100] bg-[#080c14] flex items-center justify-center p-4">
<div class="w-full max-w-sm bg-[#0e1524] border border-cyan-500/30 rounded-[24px] p-6 text-center">
<div class="text-4xl">🛡️</div>
<h2 class="font-black text-cyan-400 mt-2">TARIM OS v14.3.1</h2>
<p class="text-gray-400 text-xs mt-1 mb-4">بوابة القلعة السيادية</p>
<input id="userPhone" placeholder="رقم الجوال" class="w-full mb-3 bg-black/60 border border-white/10 rounded-2xl px-4 py-3 text-center text-white outline-none">
<input id="userPass" type="password" placeholder="كلمة السر" class="w-full mb-4 bg-black/60 border border-white/10 rounded-2xl px-4 py-3 text-center text-white outline-none">
<button onclick="login()" class="w-full bg-cyan-400 text-black font-black py-3.5 rounded-2xl">فتح القلعة 🏰</button>
</div></div>

<header class="flex justify-between items-center px-3 py-3 bg-black/90 border-b border-white/10">
<span class="font-black text-cyan-400 text-xs">TARIM OS v14.3.1</span>
<button onclick="openTab('ai')" class="bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 text-[10px] px-3 py-1 rounded-full">فريق الدعم AL</button>
</header>

<main id="tab-home" class="p-3 space-y-3">
<div id="homeBanner" class="h-[180px] rounded-[20px] bg-cover bg-center flex items-end p-3 border border-white/10" style="background-image:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800')"><span class="bg-black/60 px-2 py-1 rounded-full text-cyan-300 text-xs">🔴 بث مباشر سيادي ومشفر</span></div>
<button onclick="toast('⚡ تم التنفيذ')" class="w-full glass p-3 rounded-xl text-xs font-bold text-cyan-300">⚡ تنفيذ أمر سيادي</button>
<div class="glass p-3 rounded-xl text-xs">📹 البث الميداني - جاهز</div>
<div class="glass p-3 rounded-xl text-xs">🔒 المراسلة المشفرة - آمن</div>
</main>

<main id="tab-profile" class="p-3 space-y-3 hidden">
<div class="glass p-4 rounded-2xl flex items-center gap-3">
<div class="w-12 h-12 rounded-full bg-cyan-400 flex items-center justify-center text-black font-black">AL</div>
<div><div class="font-black text-sm">الإمبراطور AL</div><div id="userDisplay" class="text-xs text-cyan-400">CEO</div></div>
</div>

<div class="glass p-3 rounded-2xl border border-cyan-500/30">
<div class="font-bold text-xs text-cyan-400 mb-2">🎨 تغيير خلفية الشاشة</div>
<input id="bgUrlInput" placeholder="الصق رابط صورة هنا" class="w-full bg-black/60 border border-white/10 rounded-xl px-3 py-2 text-xs outline-none">
<div class="flex gap-2 mt-2">
<button onclick="changeBG()" class="flex-1 bg-cyan-500 text-black font-black py-2 rounded-xl text-xs">تطبيق الخلفية</button>
<button onclick="resetBG()" class="flex-1 bg-white/10 py-2 rounded-xl text-xs">إعادة</button>
</div>
</div>

<button onclick="localStorage.clear();location.reload()" class="w-full bg-red-900/30 border border-red-500/30 p-3 rounded-xl text-red-400 text-xs font-bold">🚪 تسجيل خروج</button>
</main>

<main id="tab-ai" class="p-3 hidden"><div class="glass p-4 rounded-2xl text-center"><div class="font-black text-cyan-400">TARIM OS - فريق الدعم AL</div><p class="text-xs mt-2">الختم الميداني والـ QR جاهز</p></div></main>

<nav class="fixed bottom-0 left-0 right-0 h-[70px] bg-[#080c14] border-t border-white/10 flex justify-around items-center">
<button onclick="openTab('home')" class="flex flex-col items-center text-cyan-400"><span>🏠</span><span class="text-[9px]">الرئيسية</span></button>
<button onclick="openTab('profile')" class="flex flex-col items-center text-white/40"><span>👑</span><span class="text-[9px]">الملف</span></button>
<button onclick="openTab('ai')" class="flex flex-col items-center text-white/40"><span>🛡️</span><span class="text-[9px]">الدعم</span></button>
</nav>

</div>
<div id="toastBox" class="fixed top-20 left-1/2 -translate-x-1/2 z-[200] space-y-2"></div>

<script>
function toast(m){const b=document.getElementById('toastBox');const e=document.createElement('div');e.className='bg-cyan-400 text-black text-xs font-bold px-4 py-2 rounded-xl';e.textContent=m;b.appendChild(e);setTimeout(()=>e.remove(),2000);}
function login(){const p=document.getElementById('userPhone').value;if(!p)return toast('أدخل الجوال');localStorage.setItem('user',p);document.getElementById('authGate').style.display='none';document.getElementById('userDisplay').textContent=p;toast('✅ أهلا بالإمبراطور');}
function openTab(t){document.querySelectorAll('main').forEach(m=>m.classList.add('hidden'));document.getElementById('tab-'+t).classList.remove('hidden');}
function changeBG(){const u=document.getElementById('bgUrlInput').value;if(!u)return toast('ضع رابط');localStorage.setItem('bg',u);document.getElementById('homeBanner').style.backgroundImage=`url('${u}')`;toast('🎨 تم تغيير الخلفية');}
function resetBG(){localStorage.removeItem('bg');document.getElementById('homeBanner').style.backgroundImage=`url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800')`;toast('تمت الإعادة');}
window.onload=()=>{if(localStorage.getItem('user')){document.getElementById('authGate').style.display='none';document.getElementById('userDisplay').textContent=localStorage.getItem('user');}const bg=localStorage.getItem('bg');if(bg)document.getElementById('homeBanner').style.backgroundImage=`url('${bg}')`;}
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}
</script>
</body>
</html>

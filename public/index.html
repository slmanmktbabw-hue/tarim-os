<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TARIM OS | النظام السيادي الإمبراطوري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui; background: linear-gradient(180deg, #0A1A3A 0%, #030B1A 100%); color: #ffffff; user-select: none; }
        .glass { background: rgba(10, 20, 40, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0, 180, 255, 0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .op-btn { background: rgba(15, 30, 60, 0.8); border: 1px solid rgba(0,180,255,0.2); }
        #liveScreen { background: #000; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden pb-20">

    <header class="w-full glass px-4 py-3 flex justify-between items-center text-xs z-40">
        <span>👁️ عين الذكاء</span>
        <span class="font-black text-cyan-300">TARIM OS</span>
        <span id="userName" class="flex items-center gap-1">👑 AL</span>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto p-3 relative">

        <div id="tab-home" class="tab-content active">
            <div id="feed" class="space-y-4">
                <div class="text-center text-slate-400 py-10">
                    <div class="text-4xl mb-2">🎬</div>
                    <p class="text-xs">لم تنشر أي فيديوهات بعد</p>
                    <p class="text-[10px]">انشر أول بث مباشر أو منشور من زر +</p>
                </div>
            </div>
        </div>

        <div id="tab-create" class="tab-content glass p-4 rounded-2xl space-y-3">
            <h2 class="text-cyan-400 text-center font-bold">✨ محطة الإنشاء السيادي</h2>
            <div id="cameraBox" class="relative w-full h-48 bg-black rounded-xl overflow-hidden">
                <video id="cameraPreview" autoplay playsinline muted class="w-full h-full object-cover"></video>
            </div>

            <div class="grid grid-cols-3 gap-2">
                <button id="lightBtn" class="op-btn p-2 rounded-lg text-xs cursor-pointer">💡 إضاءة</button>
                <button id="filterBtn" class="op-btn p-2 rounded-lg text-xs cursor-pointer">🎨 فلاتر</button>
                <button id="switchCamBtn" class="op-btn p-2 rounded-lg text-xs cursor-pointer">🔄 تبديل</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <label class="op-btn p-2 rounded-lg text-xs cursor-pointer text-center block">
                    📹 رفع فيديو <input type="file" id="uploadVideo" accept="video/*" class="hidden">
                </label>
                <label class="op-btn p-2 rounded-lg text-xs cursor-pointer text-center block">
                    🖼️ رفع صورة <input type="file" id="uploadImage" accept="image/*" class="hidden">
                </label>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button class="op-btn p-2 rounded-lg text-xs cursor-pointer">📄 منشور نصي</button>
                <button id="liveBtn" class="bg-red-600/30 border border-red-500 p-2 rounded-lg text-xs text-red-400 cursor-pointer">🔴 LIVE</button>
            </div>

            <textarea id="postContentInput" placeholder="اكتب وصف المنشور..." class="w-full bg-slate-900 p-3 rounded-xl h-20 text-xs text-white resize-none"></textarea>
            <button id="publishBtn" class="w-full bg-cyan-500 text-black py-3 rounded-xl font-bold cursor-pointer hover:bg-cyan-400 transition">🚀 نشر فوري</button>
        </div>

        <div id="tab-operations" class="tab-content space-y-3">
            <h2 class="text-cyan-400 text-center font-bold">⚡ قسم العمليات السيادية</h2>
            <button id="liveOpBtn" class="op-btn w-full p-4 rounded-xl flex justify-between items-center cursor-pointer"><span>بدء ←</span><span class="text-red-400">بث مباشر سيادي 🔴</span></button>
            <button class="op-btn w-full p-4 rounded-xl flex justify-between items-center cursor-pointer"><span>فتح ←</span><span>المراسلة الآمنة 💬</span></button>
            <button class="op-btn w-full p-4 rounded-xl flex justify-between items-center cursor-pointer"><span>عرض ←</span><span>خريطة حضرموت Offline 🗺️</span></button>
            <button class="op-btn w-full p-4 rounded-xl flex justify-between items-center cursor-pointer"><span>عرض ←</span><span>الختم الميداني QR 🔐</span></button>
        </div>

        <div id="tab-inbox" class="tab-content glass p-4 rounded-2xl text-center text-xs text-slate-300">💬 الوارد فاضي وقيد التأمين</div>

        <div id="tab-profile" class="tab-content space-y-3">
            <div class="glass p-4 rounded-2xl text-center">
                <div class="w-20 h-20 bg-cyan-500 rounded-full mx-auto flex items-center justify-center text-2xl font-bold text-black">AL</div>
                <h3 class="font-bold mt-2 text-cyan-400">الإمبراطور AL</h3>
                <p class="text-xs text-slate-400">OKX: 0x53...ab96</p>
                <div class="flex justify-around mt-3 text-xs">
                    <div><p class="font-bold text-cyan-300">0</p><p class="text-slate-400">المتابعين</p></div>
                    <div><p class="font-bold text-cyan-300">0</p><p class="text-slate-400">يتابع</p></div>
                    <div><p class="font-bold text-cyan-300">0</p><p class="text-slate-400">هدايا</p></div>
                </div>
            </div>
            <div class="glass p-2 rounded-2xl text-xs space-y-1">
                <button class="w-full text-right p-2.5 hover:bg-slate-800 rounded transition cursor-pointer">💰 رصيد OKX: 0</button>
                <button class="w-full text-right p-2.5 hover:bg-slate-800 rounded transition cursor-pointer">🎁 سجل الهدايا</button>
                <button class="w-full text-right p-2.5 hover:bg-slate-800 rounded transition cursor-pointer">⚙️ الإعدادات</button>
                <button class="w-full text-right p-2.5 hover:bg-slate-800 rounded transition cursor-pointer">🔐 الختم QR</button>
            </div>
        </div>

        <div id="liveScreen" class="fixed inset-0 z-50 hidden flex flex-col justify-between bg-black">
            <video id="liveVideo" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
            
            <div class="relative z-10 p-4 flex justify-between items-center text-xs">
                <div></div>
                <div class="flex gap-2">
                    <button id="beautyBtn" class="bg-black/50 p-2.5 rounded-full text-white cursor-pointer">✨</button>
                    <button id="endLiveBtn" class="bg-red-500 p-2.5 rounded-full text-white font-bold cursor-pointer">❌</button>
                </div>
            </div>

            <div class="relative z-10 flex-1 flex flex-col justify-center items-center p-4">
                <div id="readyToBroadcastBox" class="text-center space-y-4">
                    <div class="w-24 h-24 mx-auto rounded-full bg-red-600/30 border-2 border-red-500 flex items-center justify-center animate-pulse">
                        <div class="w-16 h-16 rounded-full bg-red-600 flex items-center justify-center"></div>
                    </div>
                    <p class="text-white text-sm font-bold">البث السيادي جاهز</p>
                    <button id="confirmStartLive" class="bg-red-600 text-white px-6 py-2.5 rounded-full text-xs font-bold shadow-lg flex items-center gap-2 mx-auto cursor-pointer">
                        ▶ اضغط لبدء البث
                    </button>
                </div>

                <div id="comments" class="absolute bottom-20 left-2 w-3/4 space-y-1 text-xs max-h-32 overflow-y-auto pointer-events-none"></div>
            </div>

            <div class="relative z-10 p-4 flex justify-between items-end">
                <div class="flex gap-2 w-1/2">
                    <input id="commentInput" placeholder="اكتب تعليق..." class="bg-black/60 rounded-full px-3 py-2 text-xs w-full text-white outline-none border border-cyan-500/30">
                    <button id="sendCommentBtn" class="bg-cyan-500 text-black px-3 py-2 rounded-full text-xs font-bold cursor-pointer">إرسال</button>
                </div>
                <div class="flex flex-col gap-3 items-center">
                    <button id="likeBtn" class="text-3xl cursor-pointer">❤️ <span id="liveLikeCount" class="text-xs text-white">0</span></button>
                    <button id="giftBtn" class="text-3xl cursor-pointer">🎁</button>
                </div>
            </div>
        </div>

    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-2 py-2 flex justify-around items-center z-40">
        <button onclick="switchTab('home', this)" class="nav-btn flex flex-col items-center justify-center text-cyan-400 text-[10px] cursor-pointer transition hover:text-cyan-300">
            <span class="text-xl">🏠</span>
            <span>الرئيسية</span>
        </button>
        <button onclick="switchTab('operations', this)" class="nav-btn flex flex-col items-center justify-center text-slate-400 text-[10px] cursor-pointer transition hover:text-cyan-300">
            <span class="text-xl">⚡</span>
            <span>العمليات</span>
        </button>
        <button onclick="switchTab('create', this)" class="nav-btn flex flex-col items-center justify-center -mt-6 cursor-pointer">
            <div class="w-12 h-12 bg-cyan-500 rounded-full flex items-center justify-center shadow-lg shadow-cyan-500/50 hover:scale-105 transition">
                <span class="text-2xl text-black font-bold">+</span>
            </div>
        </button>
        <button onclick="switchTab('inbox', this)" class="nav-btn flex flex-col items-center justify-center text-slate-400 text-[10px] cursor-pointer transition hover:text-cyan-300">
            <span class="text-xl">💬</span>
            <span>الوارد</span>
        </button>
        <button onclick="switchTab('profile', this)" class="nav-btn flex flex-col items-center justify-center text-slate-400 text-[10px] cursor-pointer transition hover:text-cyan-300">
            <span class="text-xl">👤</span>
            <span>الملفات</span>
        </button>
    </nav>

    <div id="toastBox" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none"></div>

    <script src="app.js"></script>
</body>
</html>

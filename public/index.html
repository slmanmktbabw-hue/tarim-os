<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TARIM OS - tarimos.org</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00f0ff">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{background:#020a14;color:#fff;font-family:'Segoe UI',Tahoma,sans-serif;overflow-x:hidden}
.glass{background:rgba(10,25,45,0.92);backdrop-filter:blur(14px);border:1px solid rgba(0,240,255,0.18)}
.card-dark{background:#0a1422;border:1px solid rgba(0,240,255,0.15)}
.input-dark{background:#020a14;border:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body class="min-h-screen pb-24 bg-[#020a14]">

<header class="fixed top-0 left-0 right-0 z-50 bg-[#081526] border-b border-cyan-500/10 px-4 py-3 flex justify-between items-center text-[13px]">
<button onclick="openTab('ai')" class="text-cyan-400 flex items-center gap-1">👁️ عين الذكاء</button>
<div class="text-cyan-400 font-bold tracking-widest">TARIM OS</div>
<button onclick="openTab('support')" class="text-yellow-400 flex items-center gap-1">فريق الدعم 🛡️</button>
</header>

<main id="tab-home" class="min-h-screen pt-16 p-3 space-y-3">
<div class="glass rounded-[20px] p-4 flex justify-between items-center">
<div class="flex items-center gap-2"><span class="bg-[#0f2a1f] text-yellow-400 text-[11px] px-3 py-1 rounded-full flex items-center gap-1">💰 0</span></div>
<div class="text-right"><div class="text-[12px] text-gray-400">مرحبا <b id="helloUser" class="text-white">...</b></div><div class="text-[11px] text-cyan-400 font-mono">OKX: 0x53ce...0af6</div></div>
</div>

<div id="feed" class="card-dark rounded-[20px] p-6 text-center text-[13px] text-gray-400">لا يوجد منشورات</div>

<div id="authCard" class="card-dark rounded-[28px] p-5 space-y-4 border-cyan-500/20">
<div class="text-center">
<div class="text-4xl font-black text-cyan-400 flex justify-center items-center gap-2"><span>🏰</span> TARIM OS</div>
<div class="text-[12px] text-gray-400 mt-1">tarimos.org - نظام سيادي</div>
</div>

<div class="bg-black/60 rounded-xl p-1 flex text-[13px]">
<button id="btnLoginTab" onclick="switchAuth('login')" class="flex-1 py-2 rounded-lg bg-cyan-500 text-black font-bold">دخول</button>
<button id="btnRegTab" onclick="switchAuth('register')" class="flex-1 py-2 rounded-lg text-gray-400">إنشاء حساب</button>
</div>

<input id="userPhone" type="text" placeholder="اسم المستخدم" class="input-dark w-full rounded-xl p-3.5 text-[13px] text-center text-white outline-none focus:border-cyan-500/50">
<input id="userPass" type="password" placeholder="كلمة المرور" class="input-dark w-full rounded-xl p-3.5 text-[13px] text-center text-white outline-none focus:border-cyan-500/50">
<div id="authMsg" class="text-[11px] text-red-400 hidden text-center"></div>

<button id="mainAuthBtn" onclick="doLogin()" class="w-full bg-cyan-500 text-black font-black py-3.5 rounded-xl text-[14px]">🔑 دخول القلعة</button>

<div class="flex items-center gap-3"><div class="h-[1px] bg-white/10 flex-1"></div><span class="text-[11px] text-gray-500">أو</span><div class="h-[1px] bg-white/10 flex-1"></div></div>

<button onclick="googleLogin()" class="w-full bg-white text-black font-bold py-3.5 rounded-xl text-[13px] flex items-center justify-center gap-2"><img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"> متابعة بجوجل</button>

<div class="text-[10px] text-gray-500 text-center">👑 حساب الملك #-&$@Gooaz محمي</div>
</div>

<div id="kingPanel" class="hidden card-dark rounded-2xl p-4 bg-gradient-to-r from-yellow-400 to-orange-500 text-black">
<div class="font-black text-[12px] mb-2">👑 لوحة الملك السيادية</div>
<div class="flex justify-between text-[12px]"><span>👥 المستخدمين:</span><b id="totalUsers">0</b></div>
<div class="flex justify-between text-[12px]"><span>📄 المنشورات:</span><b id="totalPosts">0</b></div>
</div>
</main>

<main id="tab-operations" class="hidden min-h-screen pt-16 p-4 space-y-4">
<div class="font-black text-cyan-400 text-sm">⚡ قسم العمليات السيادية</div>
<div class="grid grid-cols-1 gap-3">
<button onclick="startLive()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span class="text-red-400">🔴 بث مباشر + فلاش 🔦</span><span>بدء ←</span></button>
<button onclick="openTab('messages')" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span>💬 المراسلة الآمنة</span><span>فتح ←</span></button>
<button onclick="openOffline()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span>🗺️ فيديوهات بدون نت</span><span>عرض ←</span></button>
<button onclick="genQR()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between"><span>🔏 الختم الميداني QR</span><span>إصدار ←</span></button>
</div>
<div id="qrcode" class="hidden justify-center p-4 bg-white rounded-2xl mt-3"></div>
</main>

<main id="tab-create" class="hidden min-h-screen pt-16 p-4 space-y-3">
<div class="font-black text-cyan-400 text-sm">✨ محطة الإنشاء السيادي</div>
<div class="grid grid-cols-2 gap-3">
<button onclick="openCamera('user')" class="glass py-4 rounded-2xl font-bold text-xs">🤳 أمامية</button>
<button onclick="openCamera('environment')" class="glass py-4 rounded-2xl font-bold text-xs">📸 خلفية</button>
<button onclick="toggleCameraFacing()" class="glass py-4 rounded-2xl font-bold text-xs text-cyan-300 col-span-2">🔄 تبديل الكاميرا</button>
</div>
<input id="postText" placeholder="اكتب محتوى منشورك..." class="w-full bg-black/60 border border-white/10 rounded-xl p-3 text-xs outline-none mt-3 text-white">
<button onclick="publishPost()" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">نشر فوري</button>
<video id="camPreview" autoplay muted playsinline class="w-full rounded-xl bg-black aspect-video hidden"></video>
</main>

<main id="tab-messages" class="hidden min-h-screen pt-14 bg-[#020a14] text-white"><div id="chatLogs" class="p-3"></div><div class="fixed bottom-20 left-0 right-0 p-2 flex gap-2"><input id="chatIn" placeholder="رسالة..." class="flex-1 bg-white/10 rounded-full px-4 py-2 text-xs outline-none"><button onclick="sendMsg()" class="bg-cyan-500 text-black px-5 rounded-full text-xs">إرسال</button></div></main>
<main id="tab-profile" class="hidden min-h-screen pt-16 bg-[#f5f5f5] text-black p-3">
<div class="bg-white rounded-xl p-6 text-center"><div class="w-20 h-20 bg-cyan-500/20 rounded-full mx-auto flex items-center justify-center text-2xl font-black text-cyan-600" id="profileAvatar">GO</div><div class="font-black mt-2" id="profileName">...</div><div class="text-[10px] text-gray-400" id="profileRole">مستخدم</div></div>
<div class="bg-white rounded-xl mt-3"><button onclick="logout()" class="w-full p-4 text-red-500 text-[14px]">🚪 تسجيل خروج</button></div>
</main>
<main id="tab-ai" class="hidden min-h-screen pt-16 p-3"></main>
<main id="tab-support" class="hidden min-h-screen pt-16 p-3"></main>
<main id="tab-live" class="hidden fixed inset-0 z-[100] bg-black flex-col"><video id="liveVideo" autoplay playsinline muted class="flex-1 bg-black object-cover"></video><div class="p-3 grid grid-cols-3 gap-2 bg-black"><button onclick="toggleFlash()" class="bg-yellow-400 text-black py-3 rounded-xl text-xs">🔦 فلاش</button><button onclick="toggleCameraFacing()" class="bg-cyan-400 text-black py-3 rounded-xl text-xs">🔄 قلب</button><button onclick="exitLive()" class="bg-red-600 text-white py-3 rounded-xl text-xs">إنهاء</button></div></main>

<nav class="fixed bottom-0 left-0 right-0 bg-[#081526] border-t border-white/10 h-[70px] flex justify-around items-center z-50 text-[11px]">
<button onclick="openTab('profile')" class="flex flex-col items-center text-gray-400"><span class="text-xl">👤</span>الملفات</button>
<button onclick="openTab('messages')" class="flex flex-col items-center text-gray-400"><span class="text-xl">💬</span>الوارد</button>
<button onclick="openTab('create')" class="flex flex-col items-center"><span class="w-12 h-12 bg-cyan-500 rounded-full flex items-center justify-center text-2xl font-black text-black">+</span></button>
<button onclick="openTab('operations')" class="flex flex-col items-center text-gray-400"><span class="text-xl">⚡</span>العمليات</button>
<button onclick="openTab('home')" class="flex flex-col items-center text-cyan-400"><span class="text-xl">🏠</span>الرئيسية</button>
</nav>

<script>
const socket=io(); let currentUser=localStorage.getItem('tarim_user')||''; let currentRole=localStorage.getItem('tarim_role')||'user'; let currentStream=null; let facing="environment"; let torch=false; let authMode='login';
function switchAuth(m){authMode=m; document.getElementById('btnLoginTab').className=m==='login'?'flex-1 py-2 rounded-lg bg-cyan-500 text-black font-bold':'flex-1 py-2 rounded-lg text-gray-400'; document.getElementById('btnRegTab').className=m==='register'?'flex-1 py-2 rounded-lg bg-cyan-500 text-black font-bold':'flex-1 py-2 rounded-lg text-gray-400'; document.getElementById('mainAuthBtn').innerText=m==='login'?'🔑 دخول القلعة':'✨ إنشاء حساب'; document.getElementById('mainAuthBtn').onclick=m==='login'?doLogin:doRegister;}
function showMsg(t){const el=document.getElementById('authMsg'); el.innerText=t; el.classList.remove('hidden'); setTimeout(()=>el.classList.add('hidden'),3000);}
async function doRegister(){const u=document.getElementById('userPhone').value.trim(); const p=document.getElementById('userPass').value.trim(); if(!u||!p) return showMsg('اكمل البيانات'); const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})}); const d=await r.json(); if(d.error) return showMsg(d.error); localStorage.setItem('tarim_user',d.user); localStorage.setItem('tarim_role',d.role); localStorage.setItem('tarim_token',d.token); hideLogin(d.user,d.role);}
async function doLogin(){const u=document.getElementById('userPhone').value.trim(); const p=document.getElementById('userPass').value.trim(); if(!u||!p) return showMsg('اكمل البيانات'); const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})}); const d=await r.json(); if(d.error) return showMsg(d.error); localStorage.setItem('tarim_user',d.user); localStorage.setItem('tarim_role',d.role); localStorage.setItem('tarim_token',d.token); hideLogin(d.user,d.role);}
function hideLogin(user,role){currentUser=user; currentRole=role; document.getElementById('authCard').classList.add('hidden'); document.getElementById('helloUser').innerText=user; document.getElementById('profileName').innerText=user; document.getElementById('profileAvatar').innerText=user.slice(0,2).toUpperCase(); if(role==='KING'){document.getElementById('kingPanel').classList.remove('hidden');} fetchPosts();}
function logout(){localStorage.clear(); location.reload();}
function openTab(name){['home','operations','create','messages','profile','ai','support'].forEach(t=>{const el=document.getElementById('tab-'+t); if(el) el.classList.add('hidden');}); const el=document.getElementById('tab-'+name); if(el) el.classList.remove('hidden'); if(name==='home') fetchPosts(); document.getElementById('tab-live').classList.add('hidden');}
window.onload=()=>{const u=localStorage.getItem('tarim_user'); const r=localStorage.getItem('tarim_role'); const tok=localStorage.getItem('tarim_token'); if(u&&tok){ hideLogin(u,r); } fetchPosts();};
function fetchPosts(){fetch('/api/posts').then(r=>r.json()).then(d=>{const feed=document.getElementById('feed'); if(!d.length) feed.innerHTML='لا يوجد منشورات'; else feed.innerHTML=d.map(p=>`<div class="glass p-3 rounded-xl text-right"><div class="text-[10px] text-cyan-400">${p.user}</div><div class="text-xs">${p.text}</div></div>`).join('');});}
function publishPost(){const t=document.getElementById('postText').value; if(!t) return; fetch('/api/posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:currentUser,text:t})}).then(()=>{document.getElementById('postText').value=''; openTab('home');});}
function googleLogin(){showMsg('قريبا - استخدم إنشاء حساب');}
async function openCamera(f){facing=f; openTab('create'); const v=document.getElementById('camPreview'); v.classList.remove('hidden'); try{if(currentStream) currentStream.getTracks().forEach(t=>t.stop()); const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:f}}); currentStream=s; v.srcObject=s; await v.play();}catch(e){alert('اسمح للكاميرا - لازم https');}}
async function startLive(){openTab('operations'); const liveTab=document.getElementById('tab-live'); liveTab.classList.remove('hidden'); liveTab.style.display='flex'; const v=document.getElementById('liveVideo'); try{if(currentStream) currentStream.getTracks().forEach(t=>t.stop()); const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:true}); currentStream=s; v.srcObject=s; await v.play();}catch(e){alert('اسمح للكاميرا والمايك');}}
function toggleCameraFacing(){facing=facing==='environment'?'user':'environment'; const isLive=document.getElementById('tab-live').style.display!=='none'&&!document.getElementById('tab-live').classList.contains('hidden'); if(isLive) startLive(); else openCamera(facing);}
async function toggleFlash(){try{const track=currentStream.getVideoTracks()[0]; const caps=track.getCapabilities(); if(!caps.torch) return alert('لا يدعم فلاش'); torch=!torch; await track.applyConstraints({advanced:[{torch}]});}catch(e){alert('شغل البث اولا');}}
function exitLive(){if(currentStream) currentStream.getTracks().forEach(t=>t.stop()); document.getElementById('tab-live').classList.add('hidden'); openTab('home'); document.getElementById('camPreview').classList.add('hidden');}
function genQR(){const c=document.getElementById('qrcode'); c.innerHTML=''; c.classList.remove('hidden'); c.classList.add('flex'); new QRCode(c,{text:'https://tarimos.org/user='+currentUser,width:150,height:150}); openTab('operations');}
function openOffline(){const f=document.getElementById('feed'); f.innerHTML=`<video controls id="v" class="w-full rounded-xl bg-black aspect-video"></video><input type="file" accept="video/*" onchange="document.getElementById('v').src=URL.createObjectURL(this.files[0])" class="w-full mt-2">`; openTab('home');}
function sendMsg(){const t=document.getElementById('chatIn').value; if(!t) return; document.getElementById('chatLogs').innerHTML+=`<div class="bg-white/10 p-2 rounded-xl text-xs">${t}</div>`; document.getElementById('chatIn').value='';}
</script>
</body>
</html>

    <div class="flex-1 flex flex-col items-center justify-center text-center my-auto py-12">
        <svg class="w-16 h-16 mx-auto opacity-50 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>

    <!-- الأزرار التفاعلية -->

    </div>
    <div class="text-center text-[11px] text-slate-300 mt-4 pt-3 border-t border-slate-800">google_529mktbabw@gmail.com @</div>
</div>

<!-- ملف المنطق والبرمجة المؤَمّن -->
<script src="./app.js"></script>

<script>
// === خدمة الأزرار التفاعلية (مع التعقيم والحماية) ===
(function(){
  const $ = id=>document.getElementById(id);
  function sanitizeHTML(str) {
    return String(str).replace(/[&<>'"]/g, 
      tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
  }
  function toast(m){
    const b=$('toastBox'); if(!b) return;
    const e=document.createElement('div');
    e.textContent=sanitizeHTML(m); 
    e.style.cssText='background:#00B4D8;color:#000;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:8px;text-align:center';
    b.appendChild(e); setTimeout(()=>e.remove(),3000);
  }
  let likes = parseInt(localStorage.getItem('tarim_home_likes')||'120', 10);
  let liked = localStorage.getItem('tarim_home_liked')==='1';
  let comments = parseInt(localStorage.getItem('tarim_home_comments')||'45', 10);
  let saved = localStorage.getItem('tarim_home_saved')==='1';

  function refresh(){
    if($('countLike')) $('countLike').textContent=likes;
    if($('iconLike')) { 
      $('iconLike').textContent= liked? '💖' : '❤️'; 
      liked? $('iconLike').classList.add('pop') : $('iconLike').classList.remove('pop'); 
    }
    if($('countComment')) $('countComment').textContent=comments;
    if($('iconSave')) $('iconSave').textContent= saved? '✅' : '🔖';
  }
  refresh();

  $('btnLike')?.addEventListener('click', ()=>{
    if(liked){ likes--; liked=false; toast('💔 إلغاء الإعجاب'); }
    else { likes++; liked=true; toast('❤️ تم الإعجاب'); if(navigator.vibrate) navigator.vibrate(50); }
    localStorage.setItem('tarim_home_likes', likes);
    localStorage.setItem('tarim_home_liked', liked?'1':'0');
    refresh();
  });
  
  $('btnComment')?.addEventListener('click', ()=>{
    const rawComment = prompt('اكتب تعليقك 💬:');
    if(!rawComment || !rawComment.trim()) return;
    const c = sanitizeHTML(rawComment.trim().slice(0, 150));
    comments++; 
    localStorage.setItem('tarim_home_comments', comments);
    refresh(); 
    toast('💬 تم إرسال تعليقك: '+ c);
  });
  
  $('btnShare')?.addEventListener('click', ()=>{
    const url='https://tarimos.org';
    if(navigator.share){ 
      navigator.share({title:'TARIM OS', text:'فيديو سيادي من تريم 🌴', url}).catch(()=>{}); 
    } else { 
      navigator.clipboard.writeText(url); 
      toast('🚀 تم نسخ رابط القلعة'); 
    }
  });
  
  $('btnSave')?.addEventListener('click', ()=>{
    saved=!saved; 
    localStorage.setItem('tarim_home_saved', saved?'1':'0');
    refresh(); 
    toast(saved? '🔖 تم الحفظ في ملفاتك' : 'تم إلغاء الحفظ');
  });
})();
</script>
</body>
</html>

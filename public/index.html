<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TARIM OS V1.0 Beta - من تريم إلى العالم</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="manifest" href="./manifest.json" />
<style>
body { font-family: system-ui, -apple-system, sans-serif; background-color: #030B1A; color: #ffffff; user-select: none; }
.glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.2); }
.tab-content { display: none; }
.tab-content.active { display: block; }
.sub-page.hidden { display: none; }
</style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden pb-20">
<div id="authGate" class="fixed inset-0 z-[60] bg-[#030B1A] flex items-center justify-center p-4">
<div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-cyan-500/40 text-center space-y-4">
<h1 class="text-2xl font-black text-cyan-400">TARIM OS 👑</h1>
<p class="text-xs text-slate-400">بوابة الدخول للقلعة السيادية - أبو سلمان</p>
<input id="userPhoneOrEmail" type="text" value="AL" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:border-cyan-400 focus:outline-none">
<input id="userPass" type="password" value="123456" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:border-cyan-400 focus:outline-none">
<button type="button" onclick="forceUnlockCastle()" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl text-xs">دخول القلعة السيادية 🔑</button>
</div>
</div>

<div id="toastBox" class="fixed top-4 left-1/2 -translate-x-1/2 z-[70] flex flex-col items-center pointer-events-none w-11/12 max-w-xs"></div>

<header class="w-full glass border-b border-cyan-500/20 px-4 py-3 flex justify-between items-center text-xs z-40">
<span id="openAiEyeBtn" class="text-cyan-400 font-bold cursor-pointer">👁️ عين الذكاء</span>
<span class="font-black text-cyan-300">TARIM OS</span>
<span id="openSupportBtn" class="text-slate-300 font-bold cursor-pointer">🛡️ الدعم</span>
</header>

<main class="flex-1 w-full max-w-md mx-auto p-4">
<!-- هنا يبقى كل محتوى تبويباتك كما هو نسخته كامل من ملفك الأصلي -->
<!-- HOME / OPERATIONS / CREATE / INBOX / PROFILE... -->
<div id="tab-home" class="tab-content active">
<!-- انسخ محتوى الرئيسية من ملفك -->
</div>
</main>

<nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-4 py-2 flex justify-around items-center z-40">
<button onclick="switchTab('home', this)" class="nav-btn text-cyan-400 text-[10px]">🏰<br>الرئيسية</button>
<button onclick="switchTab('operations', this)" class="nav-btn text-slate-400 text-[10px]">⚡<br>العمليات</button>
<button onclick="switchTab('create', this)" class="nav-btn text-slate-400 text-[10px]">➕<br>إنشاء</button>
<button onclick="switchTab('inbox', this)" class="nav-btn text-slate-400 text-[10px]">💬<br>الوارد</button>
<button onclick="switchTab('profile', this)" class="nav-btn text-slate-400 text-[10px]">👤<br>الملفات</button>
</nav>

<div id="mapScreen" class="hidden fixed inset-0 z-50 bg-[#030B1A]/95 p-4 flex flex-col"><div id="mapContainer" class="flex-1 rounded-xl"></div><button id="closeMapBtn" class="mt-2 bg-rose-500 text-black py-2 rounded-xl text-xs">إغلاق الخريطة</button></div>
<div id="liveScreen" class="hidden fixed inset-0 z-50 bg-black"><video id="liveVideo" autoplay playsinline class="w-full h-full object-cover"></video><button id="endLiveBtn" class="absolute top-4 left-4 bg-rose-500 px-3 py-1 rounded-xl text-xs">إنهاء</button></div>

<script src="./ai-eye.js"></script>
<script src="./app.js"></script>
<script src="./support.js"></script>
</body>
</html>

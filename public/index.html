<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TARIM OS | النظام السيادي الإمبراطوري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #030B1A; color: #ffffff; user-select: none; -webkit-user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.2); }
        .no-select { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.3); border-radius: 4px; }
    </style>
</head>
<body id="appBody" class="min-h-screen flex flex-col justify-between overflow-x-hidden pb-20 no-select">

    <!-- بوابة المصادقة والدخول السيادية -->
    <div id="authGate" class="fixed inset-0 z-50 bg-[#030B1A] flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-cyan-500/40 text-center space-y-4">
            <h1 class="text-2xl font-black text-cyan-400">TARIM OS 👑</h1>
            <p class="text-xs text-slate-400">بوابة الدخول للقلعة السيادية - أبو سلمان</p>
            
            <div class="flex justify-center gap-6 border-b border-slate-800 pb-2">
                <button id="tabLoginBtn" class="text-xs font-bold text-cyan-400 border-b-2 border-cyan-400 pb-1">تسجيل الدخول</button>
                <button id="tabRegBtn" class="text-xs text-slate-400 pb-1">حساب جديد</button>
            </div>

            <div class="space-y-3">
                <input id="userPhoneOrEmail" type="text" placeholder="البريد أو رقم الهاتف السيادي" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-cyan-400 text-center">
                <input id="userPass" type="password" placeholder="كلمة المرور الإمبراطورية" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-cyan-400 text-center">
                <div id="otpBox" class="hidden">
                    <input id="otpInput" type="text" placeholder="رمز التحقق OTP السيادي" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-cyan-400 text-center">
                </div>
            </div>

            <p id="authMsg" class="text-xs text-rose-400 font-bold h-4"></p>

            <button id="authActionBtn" onclick="processLoginDirect()" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl shadow-lg hover:bg-cyan-400 transition text-xs">دخول القلعة السيادية 🔑</button>
            <button id="googleAuthBtn" onclick="processGoogleLoginDirect()" class="w-full bg-slate-800 border border-slate-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 hover:bg-slate-700 transition">🌐 الدخول عبر Google السيادي</button>
        </div>
    </div>

    <!-- صندوق الإشعارات السريعة -->
    <div id="toastBox" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center pointer-events-none w-11/12 max-w-xs"></div>

    <!-- الهيدر السيادي العلوي -->
    <header class="w-full max-w-md mx-auto px-4 py-3 flex justify-between items-center glass border-b border-cyan-500/20 rounded-b-2xl z-30">
        <button id="openAiEyeBtn" class="bg-cyan-500/20 border border-cyan-500/50 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 text-cyan-300 font-bold">👁️ عين الذكاء</button>
        <h1 class="text-sm font-black text-cyan-400 tracking-wider">TARIM OS</h1>
        <button id="openSupportBtn" class="bg-blue-500/20 border border-blue-500/50 px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 text-blue-300 font-bold">🤖 فريق الدعم</button>
    </header>

    <!-- المحتوى الرئيسي للتبويبات -->
    <main class="flex-1 w-full max-w-md mx-auto p-4 relative">
        <div id="tab-home" class="space-y-4">
            <div class="relative w-full h-[72vh] bg-slate-950 rounded-2xl overflow-hidden border border-cyan-500/30 flex flex-col justify-end p-4">
                <video id="tiktokVideo" autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                </video>
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none"></div>
                <div class="absolute right-3 bottom-16 flex flex-col items-center space-y-4 z-20">
                    <button class="flex flex-col items-center text-white" onclick="showToast('❤️ تم الإعجاب')">
                        <div class="w-10 h-10 rounded-full bg-black/50 backdrop-blur flex items-center justify-center text-lg border border-white/20">❤️</div>
                        <span class="text-[10px] mt-1 font-bold">1420</span>
                    </button>
                </div>
                <div class="relative z-20 space-y-1 text-right">
                    <span id="homeUsernameDisplay" class="text-xs font-bold text-cyan-400">@sovereign_al 👑</span>
                    <p class="text-xs text-slate-200">بث حي من قلب تريم التاريخية - حضرموت الخير 🌴</p>
                </div>
            </div>
        </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-4 py-2 flex justify-around items-center z-40">
        <button data-tab="home" class="nav-btn flex flex-col items-center text-cyan-400 text-[10px]"><span class="text-xl">🏠</span>الرئيسية</button>
        <button data-tab="operations" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">⚡</span>العمليات</button>
        <button data-tab="create" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">➕</span>إنشاء</button>
        <button data-tab="inbox" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">💬</span>الوارد</button>
        <button data-tab="profile" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">👤</span>الملفات</button>
    </nav>

    <!-- ربط الدوال المباشرة للاستجابة الفورية -->
    <script>
        function processLoginDirect() {
            const userField = document.getElementById('userPhoneOrEmail').value.trim();
            const passField = document.getElementById('userPass').value.trim();
            const authMsg = document.getElementById('authMsg');

            if (!userField || !passField) {
                authMsg.innerText = "⚠️ يرجى إدخال البيانات المطلوبة!";
                return;
            }

            authMsg.innerText = "";
            alert("✨ أهلاً بك يا أبو سلمان في القلعة!");
            document.getElementById('authGate').classList.add('hidden');
        }

        function processGoogleLoginDirect() {
            alert("👑 أهلاً بك يا أبو سلمان عبر Google");
            document.getElementById('authGate').classList.add('hidden');
        }

        function showToast(msg) {
            alert(msg);
        }
    </script>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TARIM OS V25</title>
<link rel="manifest" href="/manifest.json">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#020E1F;color:#fff;font-family:system-ui}
.glass{background:#0A1931;border:1px solid #12305B;border-radius:14px;padding:12px}
.top{position:fixed;top:0;left:0;right:0;height:44px;background:#02122A;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:11px;z-index:100;border-bottom:1px solid #12305B}
.tab{display:none;padding:50px 10px 80px;min-height:100vh}.tab.active{display:block}
.btn{width:100%;background:#0A1931;border:1px solid #12305B;color:#fff;padding:14px;border-radius:12px;font-size:12px;display:flex;justify-content:space-between;margin-bottom:8px}
.btn-cyan{background:#00E5FF;color:#000;font-weight:900;border:none;justify-content:center;border-radius:20px}
nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:#02122A;border-top:1px solid #12305B;display:flex;justify-content:space-around;align-items:center;z-index:100}
nav button{background:none;border:none;color:#5A6E8A;font-size:10px}nav button.active{color:#00E5FF}
#livePage{position:fixed;inset:0;background:#000;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="top"><span>👁️ من الذكاء</span><span style="font-weight:900">TARIM OS</span><span>🛡️ فريق الدعم</span></div>

<div id="tab-home" class="tab active">
<div style="text-align:left;padding:10px" id="feed"><div class="glass" style="text-align:right"><div style="font-size:11px">AL👑<br>القلعة من TARIM OS<br>❤️ 120</div></div></div>
</div>

<div id="tab-operations" class="tab">
<div style="font-size:12px;margin-bottom:10px">⚡ قسم العمليات السيادية</div>
<button class="btn" onclick="startLive()">🔴 بث مباشر سيادي (8 دقائق) <span>← بدء</span></button>
<button class="btn" onclick="openTab('inbox')">💬 المراسلة الآمنة <span>← فتح</span></button>
<button class="btn" onclick="toast('خريطة Offline')">🗺️ خريطة حضرموت Offline <span>← عرض</span></button>
<button class="btn" onclick="genQR()">🔏 الختم الميداني QR <span>← إصدار</span></button>
<div id="qrcode" style="background:#fff;padding:12px;border-radius:12px;display:flex;justify-content:center;margin-top:10px"></div>
</div>

<div id="tab-create" class="tab">
<div style="font-size:12px;margin-bottom:10px">✨ محطة الإنشاء السيادي</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
<button class="glass" style="font-size:11px">🔄 تبديل</button><button class="glass" style="font-size:11px">📷 خلفية</button><button class="glass" style="font-size:11px">🤳 أمامية</button>
<button class="glass" style="font-size:11px">🎨 نوع مزج</button><button class="glass" style="font-size:11px">🖼️ نوع فيديو</button><button class="glass" style="font-size:11px">📄 نوع نص</button>
</div>
<button class="glass" style="width:100%;margin-top:8px;color:#EF4444">🔴 LIVE</button>
<input id="postText" placeholder="اكتب وصف للمحتوى..." style="width:100%;background:#0A1931;border:1px solid #12305B;border-radius:12px;padding:12px;color:#fff;margin-top:8px;font-size:11px">
<button onclick="publishPost()" class="btn-cyan" style="margin-top:10px;padding:14px">نشر فوري</button>
</div>

<div id="tab-inbox" class="tab"><div style="display:flex;gap:8px"><input id="chatIn" placeholder="رسالة..." style="flex:1;background:#0A1931;border:1px solid #12305B;border-radius:12px;padding:12px;color:#fff"><button onclick="sendMsg()" style="background:#00E5FF;color:#000;border:none;padding:0 16px;border-radius:12px">إرسال</button></div><div id="chatLogs" style="margin-top:10px"></div></div>

<div id="tab-profile" class="tab">
<div style="text-align:center"><div style="width:70px;height:70px;border:2px solid #00E5FF;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center">AL</div><div style="font-size:13px;font-weight:900">الإمبراطور AL</div><div style="font-size:10px;color:#5A6E8A">OKX: 0x53...c0af6</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0"><div class="glass" style="text-align:center;font-size:11px">0<br>إعجاب</div><div class="glass" style="text-align:center;font-size:11px">0<br>متابع</div><div class="glass" style="text-align:center;font-size:11px">0<br>يتابع</div></div>
<button class="btn">💰 رصيد OKX الملكي - 0 <span>← فتح</span></button>
<button class="btn">📊 مركز الأنشطة <span>← فتح</span></button>
<button class="btn">📹 فيديوهات دون اتصال <span>← فتح</span></button>
<button class="btn">🔏 رمز QR لديك <span>← عرض</span></button>
<button class="btn">💼 المجموعة التجارية <span>← فتح</span></button>
<button class="btn">📢 الترويج والإعلانات <span>← فتح</span></button>
<button class="btn">📄 إدارة المنشورات <span>← إدارة</span></button>
<div style="margin-top:14px;font-size:11px;color:#5A6E8A">الإعدادات والخصوصية</div>
<button class="btn">👤 الحساب <span>←</span></button>
<button class="btn">🔒 الخصوصية والأمان <span>←</span></button>
<button class="btn">🎨 تغير خلفية المستخدم <span>← تغير</span></button>
<button class="btn">🔗 مشاركة ملفك الشخصي <span>← مشاركة</span></button>
<button class="btn">📜 السياسة والخصوصية <span>← فتح</span></button>
<button class="btn" style="color:#EF4444">🚪 تسجيل الخروج <span>←</span></button>
</div>

<div id="livePage"><div style="width:80px;height:80px;background:#EF4444;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px">🔴</div><div style="margin-top:14px">البث السيادي جاهز</div><button onclick="confirmLive()" style="margin-top:14px;background:#EF4444;color:#fff;border:none;padding:12px 28px;border-radius:20px">▶️ اضغط لبدء البث</button><button onclick="document.getElementById('livePage').style.display='none'" style="margin-top:20px;background:none;border:none;color:#fff">✕ إغلاق</button></div>

<nav>
<button onclick="openTab('profile')" id="n-profile">👤<br>الملفات</button>
<button onclick="openTab('inbox')" id="n-inbox">💬<br>الوارد</button>
<button onclick="openTab('create')" style="width:48px;height:48px;background:#00E5FF;border-radius:50%;color:#000;font-size:22px;display:flex;align-items:center;justify-content:center">+</button>
<button onclick="openTab('operations')" id="n-operations">⚡<br>العمليات</button>
<button onclick="openTab('home')" id="n-home" class="active">🏠<br>الرئيسية</button>
</nav>

<script>
function openTab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+n).classList.add('active');document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));let nb=document.getElementById('n-'+n);if(nb)nb.classList.add('active')}
function startLive(){document.getElementById('livePage').style.display='flex'}
function confirmLive(){document.getElementById('livePage').style.display='none';alert('🔴 البث بدأ 8 دقائق')}
function genQR(){document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:'TARIM OS AL '+Date.now(),width:150,height:150})}
function publishPost(){let t=document.getElementById('postText').value;if(!t)return;let f=document.getElementById('feed');let d=document.createElement('div');d.className='glass';d.style.marginBottom='10px';d.innerHTML=t;f.prepend(d);openTab('home')}
function sendMsg(){let i=document.getElementById('chatIn');if(!i.value)return;let l=document.getElementById('chatLogs');l.innerHTML+='<div class=glass style=margin-bottom:6px>'+i.value+'</div>';i.value=''}
function toast(m){alert(m)}
</script>
<script src="/app.js"></script>
</body>
</html>

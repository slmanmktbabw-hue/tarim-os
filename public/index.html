<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARIM OS - النظام السيادي المتقدم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
       .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.2); }
        body { font-family: 'Cairo', sans-serif; background: #030B1A; }
        #fullScreenCam { position: fixed; inset: 0; background: black; z-index: 60; display:none; }
       .service-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(0, 240, 255, 0.15); padding: 12px 16px; border-radius: 12px; color: #E0F2FE; font-size: 14px; font-weight: 600; cursor:pointer; }
       .page { display: none; }
       .page.active { display: block; }
    </style>
</head>
<body class="text-white min-h-screen pb-24">

    <!-- شاشة الدخول -->
    <div id="login" class="page active p-4">
        <div class="glass max-w-md mx-auto mt-20 p-6 rounded-2xl text-center">
            <div class="text-2xl">🏰 <span class="text-cyan-400">TARIM OS</span></div>
            <input type="text" id="userInput" placeholder="الايميل / الهاتف" class="w-full p-3 my-3 bg-slate-900 border-cyan-500/20 rounded-lg">
            <input type="password" id="passInput" placeholder="كلمة المرور" class="w-full p-3 mb-3 bg-slate-900 border-cyan-500/20 rounded-lg">
            <button class="w-full p-3 bg-cyan-500 text-black font-bold rounded-lg" onclick="login()">🔑 دخول القلعة</button>
        </div>
    </div>

    <!-- التطبيق -->
    <div id="mainApp" class="hidden">
        <header class="w-full p-3 flex justify-between items-center glass fixed top-0">
            <button onclick="openAIEye()" class="text-xs text-cyan-400">👁️ عين الذكاء</button>
            <h2 class="font-bold text-cyan-400">TARIM OS</h2>
            <button onclick="openSupport()" class="text-xs text-yellow-400">فريق الدعم 🛡️</button>
        </header>

        <div class="pt-16 pb-24 max-w-md mx-auto">
            <main id="tab-home" class="page active p-4">الرئيسية</main>
            <main id="tab-operations" class="page p-4">
                <button onclick="startLive()" class="service-btn"><span>← بدء</span><span>بت مباشر 🔴</span></button>
                <div id="qrcode" class="flex justify-center mt-4"></div>
            </main>
            <main id="tab-create" class="page p-4">انشاء</main>
            <main id="tab-inbox" class="page p-4">الوارد</main>
            <main id="tab-profile" class="page p-4">الملفات</main>
        </div>

        <nav class="fixed bottom-0 left-0 right-0 glass flex justify-around p-2">
            <button onclick="switchPage('tab-home', this)" class="text-cyan-400 text-[10px]">🏠 الرئيسية</button>
            <button onclick="switchPage('tab-operations', this)" class="text-gray-400 text-[10px]">⚡ العمليات</button>
            <button onclick="switchPage('tab-create', this)" class="w-14 h-14 bg-cyan-500 text-black rounded-full text-3xl -mt-4">＋</button>
            <button onclick="switchPage('tab-inbox', this)" class="text-gray-400 text-[10px]">💬 الوارد</button>
            <button onclick="switchPage('tab-profile', this)" class="text-gray-400 text-[10px]">👤 الملفات</button>
        </nav>

        <div id="fullScreenCam">
            <video id="cam" autoplay class="w-full h-full object-cover"></video>
            <button onclick="closeLive()" class="absolute top-4 right-4 bg-red-500 px-3 py-1 rounded">اغلاق</button>
        </div>
    </div>

    <div id="toastBox" class="fixed top-5 left-1/2 -translate-x-1/2 z-50"></div>

<script src="script.js"></script>
</body>
</html>

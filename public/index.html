<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TARIM OS - tarimos.org</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>.glass{background:rgba(15,23,42,0.95);backdrop-filter:blur(14px);border:1px solid rgba(0,240,255,0.15)}body{background:#050b14;color:#fff;font-family:sans-serif}</style>
</head>
<body class="min-h-screen pb-20">

<div id="authGate" class="fixed inset-0 z-[400] bg-[#050b14]/98 flex items-center justify-center p-4">
<div class="w-full max-w-sm glass rounded-3xl p-6 text-center space-y-4">
<div class="text-3xl font-black text-cyan-400">🏰 TARIM OS</div>
<div class="text-xs text-gray-300">tarimos.org - النظام السيادي</div>
<input id="userPhone" type="text" value="AL" class="w-full bg-black/60 border-cyan-500/30 rounded-xl p-3 text-xs text-center text-cyan-300 font-bold outline-none">
<input id="userPass" type="password" placeholder="كلمة المرور 1234" class="w-full bg-black/60 border-cyan-500/30 rounded-xl p-3 text-xs text-center text-cyan-300 font-bold outline-none">
<button onclick="registerAndLogin()" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">فتح النظام الحقي</button>
</div>
</div>

<header class="fixed top-0 left-0 right-0 z-50 glass px-4 py-3 flex justify-between items-center text-xs font-bold">
<button onclick="openTab('support', event)" class="text-yellow-400">🛡️ فريق الدعم</button>
<div class="text-cyan-400">TARIM OS</div>
<button onclick="openTab('ai', event)" class="text-cyan-400">عين الذكاء 👁️</button>
</header>

<main id="tab-home" class="hidden min-h-screen bg-black"><div id="videoFeed" class="h-screen overflow-y-scroll snap-y snap-mandatory pt-12 pb-16"></div></main>
<main id="tab-operations" class="hidden min-h-screen pt-16 p-4"><div class="font-black text-cyan-400">⚡ العمليات</div></main>
<main id="tab-create" class="hidden min-h-screen pt-16 p-4"><div class="font-black text-cyan-400">✨ الانشاء</div></main>
<main id="tab-inbox" class="hidden min-h-screen pt-16 p-4"><div class="font-black text-cyan-400">💬 الوارد</div></main>
<main id="tab-profile" class="hidden min-h-screen pt-16 p-4"><div class="font-black text-cyan-400">👤 الملفات</div></main>
<main id="tab-ai" class="hidden min-h-screen pt-16 p-4"><div class="font-black text-cyan-400">👁️ الذكاء</div></main>
<main id="tab-support" class="hidden min-h-screen pt-16 p-4"><div class="font-black text-yellow-400">🛡️ الدعم</div></main>

<div id="toastBox" class="fixed top-20 left-4 right-4 z-[700]"></div>

<!-- الشريط مطابق للصورة -->
<nav class="fixed bottom-0 left-0 right-0 glass flex justify-around items-center py-2 text-[10px] border-t border-cyan-500/20 z-50">
  <button onclick="openTab('profile', event)" class="flex flex-col items-center text-cyan-400"><span class="text-2xl">👤</span><span>الملفات</span></button>
  <button onclick="openTab('inbox', event)" class="flex flex-col items-center text-gray-400"><span class="text-2xl">💬</span><span>الوارد</span></button>
  <button onclick="openTab('create', event)" class="w-14 h-14 rounded-full bg-cyan-500 flex items-center justify-center text-3xl font-bold -mt-4">+</button>
  <button onclick="openTab('operations', event)" class="flex flex-col items-center text-gray-400"><span class="text-2xl">⚡</span><span>العمليات</span></button>
  <button onclick="openTab('home', event)" class="flex flex-col items-center text-gray-400"><span class="text-2xl">🏠</span><span>الرئيسية</span></button>
</nav>

<script src="/script.js"></script>
</body>
</html>

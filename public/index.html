            <div id="sub-edit-profile" class="sub-page hidden glass p-5 rounded-2xl text-right space-y-4 border border-cyan-500/40">
                <button type="button" onclick="backToProfile()" class="text-xs text-cyan-400 font-bold mb-2">← رجوع</button>
                <h3 class="text-sm font-black text-cyan-400">👤 تعديل الملف الشخصي</h3>
                <p class="text-xs text-slate-300">سيتم ربطه بقاعدة البيانات قريباً</p>
            </div>

            <div id="sub-qr-page" class="sub-page hidden glass p-5 rounded-2xl text-center space-y-4 border-cyan-500/40">
                <button type="button" onclick="backToProfile()" class="text-xs text-cyan-400 font-bold mb-2 text-right block">← رجوع</button>
                <h3 class="text-sm font-black text-cyan-400">🌐 رمز QR الخاص بك</h3>
                <div id="qrcode" class="flex justify-center py-4 bg-white p-4 rounded-xl w-fit mx-auto"></div>
            </div>
        </div>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-4 py-2 flex justify-around items-center z-40">
        <button onclick="switchTab('home', this)" class="nav-btn flex flex-col items-center text-cyan-400 text-[10px] cursor-pointer"><span class="text-xl">🏰</span>الرئيسية</button>
        <button onclick="switchTab('operations', this)" class="nav-btn flex-col items-center text-slate-400 text-[10px] cursor-pointer"><span class="text-xl">⚡</span>العمليات</button>
        <button onclick="switchTab('create', this)" class="nav-btn flex flex-col items-center text-slate-400 text-[10px] cursor-pointer"><span class="text-xl">➕</span>إنشاء</button>
        <button onclick="switchTab('inbox', this)" class="nav-btn flex-col items-center text-slate-400 text-[10px] cursor-pointer"><span class="text-xl">💬</span>الوارد</button>
        <button onclick="switchTab('profile', this)" class="nav-btn flex-col items-center text-slate-400 text-[10px] cursor-pointer"><span class="text-xl">👤</span>الملفات</button>
    </nav>

<script>
let liked = false;
let likeCount = 120;
let mapInstance = null;

// ربط بوابة الدخول بالسيرفر
async function forceUnlockCastle() {
    const user = document.getElementById('userPhoneOrEmail').value;
    const pass = document.getElementById('userPass').value;

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user, pass})
        });
        const data = await res.json();

        if(data.ok){
            document.getElementById('authGate').style.display = 'none';
            localStorage.setItem('tarim_token', data.token);
            document.getElementById('homeUsernameDisplay').innerText = `@${user} 👑`;
            showToast('👑 ' + data.msg);
        } else {
            showToast('⚠️ فشل الدخول');
        }
    } catch(e){
        document.getElementById('authGate').style.display = 'none';
        showToast('👑 دخول محلي - السيرفر غير متصل');
    }
}

function lockCastleAgain() {
    localStorage.removeItem('tarim_token');
    document.getElementById('authGate').style.display = 'flex';
}

function switchTab(tabName, btnElement) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
    document.getElementById('tab-' + tabName).classList.remove('hidden');

    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-cyan-400'); btn.classList.add('text-slate-400');
    });
    btnElement.classList.remove('text-slate-400'); btnElement.classList.add('text-cyan-400');
    if(tabName === 'profile') backToProfile();
}

function showSubPage(pageId) {
    document.getElementById('profile-main').classList.add('hidden');
    document.querySelectorAll('.sub-page').forEach(p => p.classList.add('hidden'));
    const target = document.getElementById('sub-' + pageId);
    target.classList.remove('hidden');
    if(pageId === 'qr-page') {
        document.getElementById('qrcode').innerHTML = "";
        new QRCode(document.getElementById('qrcode'), "https://tarimos.org/user/AL");
    }
}

function backToProfile() {
    document.querySelectorAll('.sub-page').forEach(p => p.classList.add('hidden'));
    document.getElementById('profile-main').classList.remove('hidden');
}

function showToast(msg){
    const box = document.getElementById('toastBox');
    const toast = document.createElement('div');
    toast.className = 'glass px-4 py-2 rounded-xl text-xs animate-pulse';
    toast.innerText = msg;
    box.appendChild(toast);
    setTimeout(()=> toast.remove(), 3000);
}

function toggleLike(){
    liked =!liked;
    likeCount += liked? 1 : -1;
    document.getElementById('likeCountDisplay').innerText = likeCount;
    document.getElementById('statLikes').innerText = likeCount;
    document.getElementById('likeBtn').style.color = liked? '#ff3366' : 'white';
    showToast(liked? '❤️ تم الإعجاب' : '💔 تم إزالة الإعجاب');
}

async function publishPost(){
    const text = document.getElementById('postContentInput').value;
    if(!text.trim()) return showToast('⚠️ اكتب محتوى اولاً');

    const res = await fetch('/api/publish', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Authorization': localStorage.getItem('tarim_token')},
        body: JSON.stringify({content: text})
    });
    const data = await res.json();

    document.getElementById('activePostDescription').innerText = text;
    document.getElementById('postContentInput').value = '';
    showToast(data.msg || '📢 تم النشر الفوري بنجاح');
}

function sendInboxMessage(){
    const input = document.getElementById('inboxInputField');
    if(!input.value.trim()) return;
    const msg = `<div class="p-2 bg-cyan-900/40 rounded-lg text-xs border-cyan-800 text-right"><span class="text-cyan-400 font-bold">أنت:</span> ${input.value}</div>`;
    document.getElementById('inboxMessagesList').innerHTML += msg;
    input.value = '';
}

function toggleOfflineMap(){
    const mapDiv = document.getElementById('mapContainer');
    mapDiv.classList.toggle('hidden');
    if(!mapDiv.classList.contains('hidden') &&!mapInstance){
        mapInstance = L.map('mapContainer').setView([16.0544, 48.7915], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
    }
}

function generateOperationsQr(){
    const box = document.getElementById('operationsQrBox');
    box.classList.toggle('hidden');
    box.innerHTML = "";
    new QRCode(box, "https://tarimos.org/user/AL");
}

async function triggerLiveStream(){
    const res = await fetch('/api/live', {method: 'POST'});
    const data = await res.json();
    showToast(data.msg || '🔴 البث السيادي المباشر 8 دقائق جاهز')
}

function triggerFileUpload(type){ showToast(`📤 تم اختيار ${type}`) }
function changeAppBackground(color){ document.getElementById('appBody').style.backgroundColor = color; showToast('🎨 تم تغيير الخلفية') }
function switchAuthMode(mode){ showToast(mode === 'login'? 'تسجيل الدخول' : 'حساب جديد') }
</script>
</body>
</html>

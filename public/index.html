<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TARIM OS | النظام السيادي الإمبراطوري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #030B1A; color: #ffffff; user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden pb-20">

    <!-- بوابة المصادقة والدخول السيادية -->
    <div id="authGate" class="fixed inset-0 z-50 bg-[#030B1A] flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-cyan-500/40 text-center space-y-4">
            <h1 class="text-2xl font-black text-cyan-400">TARIM OS 👑</h1>
            <p class="text-xs text-slate-400">بوابة الدخول للقلعة السيادية - أبو سلمان</p>
            
            <div class="flex justify-center gap-6 border-b border-slate-800 pb-2">
                <button class="text-xs font-bold text-cyan-400 border-b-2 border-cyan-400 pb-1">تسجيل الدخول</button>
            </div>

            <div class="space-y-3">
                <input id="userPhoneOrEmail" type="text" value="730555886" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:outline-none focus:border-cyan-400">
                <input id="userPass" type="password" value="123456789" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:outline-none focus:border-cyan-400">
            </div>

            <p id="authMsg" class="text-xs text-rose-400 font-bold h-4"></p>

            <button onclick="unlockCastle()" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl shadow-lg hover:bg-cyan-400 transition text-xs cursor-pointer">دخول القلعة السيادية 🔑</button>
            <button onclick="unlockCastle()" class="w-full bg-slate-800 border border-slate-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 hover:bg-slate-700 transition cursor-pointer">🌐 الدخول عبر Google السيادي</button>
        </div>
    </div>

    <!-- صندوق الإشعارات -->
    <div id="toastBox" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center pointer-events-none w-11/12 max-w-xs"></div>

    <!-- المحتوى الرئيسي للقلعة -->
    <main class="flex-1 w-full max-w-md mx-auto p-4 relative">
        <div id="tab-home" class="space-y-4">
            <div class="relative w-full h-[72vh] bg-slate-950 rounded-2xl overflow-hidden border border-cyan-500/30 flex flex-col justify-end p-4">
                <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover">
                    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                </video>
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none"></div>
                <div class="relative z-20 space-y-1 text-right">
                    <span class="text-xs font-bold text-cyan-400">@sovereign_al 👑</span>
                    <p class="text-xs text-slate-200">بث حي من قلب تريم التاريخية - حضرموت الخير 🌴</p>
                </div>
            </div>
        </div>
    </main>

    <!-- شريط التنقل السفلي -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-4 py-2 flex justify-around items-center z-40">
        <button class="flex flex-col items-center text-cyan-400 text-[10px]"><span class="text-xl">🏠</span>الرئيسية</button>
        <button class="flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">⚡</span>العمليات</button>
        <button class="flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">➕</span>إنشاء</button>
        <button class="flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">💬</span>الوارد</button>
        <button class="flex flex-col items-center text-slate-400 text-[10px]"><span class="text-xl">👤</span>الملفات</button>
    </nav>

    <!-- البرمجية المباشرة لفتح الباب -->
    <script>
        function unlockCastle() {
            const gate = document.getElementById('authGate');
            gate.style.display = 'none';
            
            // إشعار نجاح
            const toastBox = document.getElementById('toastBox');
            const alertDiv = document.createElement('div');
            alertDiv.className = "bg-cyan-500 text-black font-bold text-xs px-4 py-2 rounded-xl shadow-lg mt-2 text-center w-full";
            alertDiv.innerText = "✨ أهلاً بك يا أبو سلمان في إمبراطورية TARIM OS!";
            toastBox.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }
    </script>
</body>
</html>

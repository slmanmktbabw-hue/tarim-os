<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TARIM OS | النظام السيادي الإمبراطوري</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background-color: #030B1A; color: #ffffff; user-select: none; }
        .glass { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden pb-20">

    <!-- بوابة المصادقة السيادية -->
    <div id="authGate" class="fixed inset-0 z-50 bg-[#030B1A] flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-cyan-500/40 text-center space-y-4">
            <h1 class="text-2xl font-black text-cyan-400">TARIM OS 👑</h1>
            <p id="authMsg" class="text-xs text-slate-400">بوابة الدخول للقلعة السيادية - أبو سلمان</p>
            
            <div class="flex justify-center gap-6 border-b border-slate-800 pb-2">
                <button id="tabLoginBtn" type="button" class="text-xs font-bold text-cyan-400 border-b-2 border-cyan-400 pb-1">تسجيل الدخول</button>
                <button id="tabRegBtn" type="button" class="text-xs text-slate-400 pb-1">حساب جديد</button>
            </div>

            <div class="space-y-3">
                <input id="userPhoneOrEmail" type="text" placeholder="اسم المستخدم السيادي" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:outline-none focus:border-cyan-400">
                <input id="userPass" type="password" placeholder="كلمة المرور الإمبراطورية" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-xs text-white text-center focus:outline-none focus:border-cyan-400">
                
                <div id="otpBox" class="hidden space-y-2">
                    <input id="otpEmail" type="email" placeholder="البريد الإلكتروني للإتحاف" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs text-white text-center">
                    <input id="otpPhone" type="text" placeholder="رقم الجوال" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-xs text-white text-center">
                </div>
            </div>

            <button id="authActionBtn" type="button" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl shadow-lg hover:bg-cyan-400 transition text-xs cursor-pointer">دخول القلعة السيادية 🔑</button>
            <button id="googleAuthBtn" type="button" class="w-full bg-slate-800 border border-slate-700 text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 hover:bg-slate-700 transition cursor-pointer">🌐 الدخول عبر Google السيادي</button>
        </div>
    </div>

    <!-- صندوق الإشعارات -->
    <div id="toastBox" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center pointer-events-none w-11/12 max-w-xs"></div>

    <!-- رأس التطبيق العلوي -->
    <header class="w-full glass border-b border-cyan-500/20 px-4 py-3 flex justify-between items-center text-xs z-40">
        <span id="openAiEyeBtn" class="text-cyan-400 font-bold flex items-center gap-1 cursor-pointer">👁️ عين الذكاء</span>
        <span class="font-black text-cyan-300 tracking-wider">TARIM OS</span>
        <span id="openSupportBtn" class="text-slate-300 font-bold flex items-center gap-1 cursor-pointer">🛡️ الدعم</span>
    </header>

    <!-- المحتوى الرئيسي للقلعة -->
    <main class="flex-1 w-full max-w-md mx-auto p-4 relative">
        
        <!-- 1. الرئيسية -->
        <div id="tab-home" class="tab-content space-y-4">
            <div class="glass p-3 rounded-xl flex justify-between items-center border border-cyan-500/30">
                <span id="homeUsernameDisplay" class="text-xs font-bold text-cyan-400">@AL 👑</span>
                <span class="text-[10px] text-slate-400">تريم - حضرموت الخير 🌴</span>
            </div>
            <div id="feedContainer" class="space-y-3">
                <!-- الفيد يتم تحميله ديناميكياً -->
            </div>
        </div>

        <!-- 2. العمليات -->
        <div id="tab-operations" class="tab-content hidden space-y-4">
            <div class="glass p-5 rounded-2xl text-center space-y-4 border border-cyan-500/40">
                <h3 class="text-sm font-black text-cyan-400">⚡ عمليات القلعة</h3>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button id="opLiveBtn" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-cyan-300 font-bold">🔴 بث مباشر</button>
                    <button id="opInboxBtn" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-cyan-300 font-bold">💬 المراسلة</button>
                    <button id="opMapBtn" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-cyan-300 font-bold">🗺️ خريطة Offline</button>
                    <button id="opQrBtn" class="bg-slate-900 border border-slate-700 p-3 rounded-xl text-cyan-300 font-bold">🧾 ختم QR</button>
                </div>
                <div id="mapContainer" class="hidden w-full h-48 rounded-xl border border-slate-700 mt-3"></div>
                <div id="operationsQrBox" class="flex justify-center p-2 bg-white rounded-xl w-fit mx-auto mt-2"></div>
            </div>
        </div>

        <!-- 3. إنشاء -->
        <div id="tab-create" class="tab-content hidden space-y-4">
            <div class="glass p-5 rounded-2xl text-center space-y-4 border border-cyan-500/40">
                <h3 class="text-sm font-black text-cyan-400">✨ محطة الإنشاء السيادي</h3>
                <textarea id="postContentInput" placeholder="اكتب وصف المنشور أو الفيديو السيادي..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-white h-24 resize-none text-right"></textarea>
                <div class="flex gap-2">
                    <button id="publishTextBtn" class="flex-1 bg-cyan-500 text-black font-bold py-2.5 rounded-xl text-xs shadow-lg">📢 نشر فوري</button>
                    <button id="startLiveStudioBtn" class="flex-1 bg-rose-500/20 border border-rose-500 text-rose-300 font-bold py-2.5 rounded-xl text-xs">🔴 استوديو LIVE</button>
                </div>
            </div>
        </div>

        <!-- 4. الوارد -->
        <div id="tab-inbox" class="tab-content hidden space-y-4">
            <div class="glass p-5 rounded-2xl text-center space-y-4 border border-cyan-500/40">
                <h3 class="text-sm font-black text-cyan-400">💬 صندوق الوارد الآمن</h3>
                <div id="inboxMessagesList" class="space-y-2 text-right max-h-48 overflow-y-auto"></div>
                <div class="flex gap-2 pt-2">
                    <input id="inboxInputField" type="text" placeholder="اكتب رسالتك السيادية..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white text-right">
                    <button id="sendInboxMsgBtn" class="bg-cyan-500 text-black font-bold px-4 py-2 rounded-xl text-xs">إرسال</button>
                </div>
            </div>
        </div>

        <!-- 5. الملفات -->
        <div id="tab-profile" class="tab-content hidden space-y-4">
            <div class="glass p-5 rounded-2xl text-center space-y-4 border border-cyan-500/40">
                <div class="w-16 h-16 bg-cyan-500 rounded-full mx-auto flex items-center justify-center text-2xl font-black text-black">AL</div>
                <h3 class="text-sm font-black text-cyan-400">الإمبراطور AL</h3>
                <p class="text-[11px] text-cyan-300">OKX: 0x53...c0af6</p>
                <button id="logoutProfileBtn" class="w-full bg-rose-500/20 border border-rose-500/50 text-rose-300 py-2.5 rounded-xl font-bold mt-3 cursor-pointer">🚪 تسجيل الخروج</button>
            </div>
        </div>

    </main>

    <!-- شاشة الاستوديو والكاميرا الحية -->
    <div id="fullScreenCam" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between p-4">
        <div class="flex justify-between items-center text-xs">
            <button id="exitCamBtn" class="bg-rose-500 text-black px-3 py-1 rounded-lg font-bold">خروج ✕</button>
            <span class="text-cyan-400 font-bold">بث مباشر - 8 دقائق 🔴</span>
            <button id="toggleFlashBtn" class="bg-slate-800 text-white px-3 py-1 rounded-lg">🔦 فلاش</button>
        </div>
        <div class="relative flex-1 my-2 bg-slate-950 rounded-2xl overflow-hidden flex items-center justify-center">
            <video id="fullCamVideo" autoplay playsinline class="w-full h-full object-cover"></video>
            <div id="liveChatOverlay" class="absolute bottom-4 left-4 right-4 flex flex-col gap-2">
                <div class="text-xs text-cyan-300">❤️ إعجابات البث: <span id="liveHeartCount">0</span></div>
                <div class="flex gap-2">
                    <input id="liveCommentInput" type="text" placeholder="تعليق حي..." class="flex-1 bg-black/60 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                    <button id="sendLiveCommentBtn" class="bg-cyan-500 text-black px-3 py-2 rounded-xl text-xs font-bold">إرسال</button>
                    <button id="sendLiveHeartBtn" class="bg-rose-500 text-black px-3 py-2 rounded-xl text-xs font-bold">❤️</button>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة الدعم -->
    <div id="modalSupport" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="glass w-full max-w-sm rounded-2xl p-5 space-y-3">
            <div class="flex justify-between items-center"><h3 class="text-sm font-bold text-cyan-400">🛡️ فريق الدعم السيادي</h3><button onclick="closeModal('modalSupport')" class="text-slate-400">✕</button></div>
            <div id="supportChatList" class="space-y-2 h-40 overflow-y-auto text-xs"></div>
            <div class="flex gap-2">
                <input id="supportInput" type="text" placeholder="اكتب استفسارك..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
                <button id="sendSupportBtn" class="bg-cyan-500 text-black font-bold px-3 py-2 rounded-xl text-xs">إرسال</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي المربوط بكودك -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-cyan-500/20 px-4 py-2 flex justify-around items-center z-40">
        <button data-tab="home" class="nav-btn flex flex-col items-center text-cyan-400 text-[10px] cursor-pointer"><span class="text-xl">🏠</span>الرئيسية</button>
        <button data-tab="operations" class="nav-btn flex flex-col items-center text-slate-400 text-[10px] cursor-pointer"><span class="text-xl">⚡</span>العمليات</button>
        <button data-tab="create" class="nav-btn flex flex-col items-center text-slate-400 text-[10px] cursor-pointer"><span class="text-xl">➕</span>إنشاء</button>
        <button data-tab="inbox" class="nav-btn flex flex-col items-center text-slate-400 text-[10px] cursor-pointer"><span class="text-xl">💬</span>الوارد</button>
        <button data-tab="profile" class="nav-btn flex flex-col items-center text-slate-400 text-[10px] cursor-pointer"><span class="text-xl">👤</span>الملفات</button>
    </nav>

    <!-- ربط السكربتات السيادية -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/ai-eye.js"></script>
    <script src="/app.js"></script>
    <script src="/support.js"></script>
</body>
</html>

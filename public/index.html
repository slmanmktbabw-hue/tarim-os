<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARIM OS - لوحة التحكم السيادية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color, #0b0f19);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background 0.3s ease;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121824;
            border-bottom: 1px solid #1e293b;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #3b82f6;
        }

        .main-container {
            padding: 15px;
            flex: 1;
            padding-bottom: 80px;
        }

        .section-card {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .section-card h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #f8fafc;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 15px;
            margin-top: 8px;
            background-color: #1e293b;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background-color: #2563eb;
        }

        .control-btn i {
            color: #3b82f6;
        }

        .control-btn:hover i {
            color: #ffffff;
        }

        /* نافذة منبثقة (Modal) لعرض التفاصيل والنتائج */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 14px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            color: #3b82f6;
        }

        .close-modal {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
        }

        .modal-body {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        /* QR Code Container */
        #qrcode {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-title"><i class="fa-solid fa-shield-halved"></i> TARIM OS - السيادية</div>
    </header>

    <div class="main-container">
        
        <div class="section-card">
            <h3><i class="fa-solid fa-sliders"></i> لوحة التحكم السيادية</h3>
            
            <button class="control-btn" onclick="openOKXBalance()">
                <span><i class="fa-solid fa-wallet"></i> رصيد OKX الملكي</span>
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="control-btn" onclick="openActivityCenter()">
                <span><i class="fa-solid fa-chart-line"></i> مركز الأنشطة</span>
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="control-btn" onclick="openOfflineVideos()">
                <span><i class="fa-solid fa-download"></i> فيديوهات دون اتصال (Offline)</span>
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="control-btn" onclick="showQRCode()">
                <span><i class="fa-solid fa-qrcode"></i> رمز QR لديك</span>
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="control-btn" onclick="openCommercialGroup()">
                <span><i class="fa-solid fa-store"></i> المجموعة التجارية والترويج</span>
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="control-btn" onclick="managePosts()">
                <span><i class="fa-solid fa-file-pen"></i> إدارة المنشورات</span>
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="control-btn" onclick="shareProfile()">
                <span><i class="fa-solid fa-share-nodes"></i> مشاركة ملفك الشخصي</span>
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="control-btn" onclick="changeBackground()">
                <span><i class="fa-solid fa-palette"></i> تغيير خلفية المستخدم</span>
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="control-btn" onclick="openPrivacyPolicy()">
                <span><i class="fa-solid fa-lock"></i> السياسة والخصوصية</span>
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>

    </div>

    <div class="modal" id="customModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">عنوان النافذة</span>
                <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalBody">
                </div>
        </div>
    </div>

    <script>
        // استرجاع الخلفية المحفوظة عند فتح التطبيق
        window.onload = function() {
            const savedBg = localStorage.getItem('tarim_os_bg');
            if (savedBg) {
                document.documentElement.style.setProperty('--bg-color', savedBg);
            }
        };

        function showModal(title, contentHtml) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = contentHtml;
            document.getElementById('customModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        // 1. رصيد OKX الملكي
        function openOKXBalance() {
            showModal('رصيد OKX الملكي', `
                <p>جاري جلب الرصيد الحي من خوادم OKX...</p>
                <div style="margin-top: 15px; padding: 12px; background: #0b0f19; border-radius: 8px; text-align: center;">
                    <h2 style="color: #3b82f6;">10,000.00 USDT</h2>
                    <p style="font-size: 12px; color: #94a3b8; margin-top: 5px;">الحالة: متصل وآمن (API Active)</p>
                </div>
            `);
        }

        // 2. مركز الأنشطة
        function openActivityCenter() {
            showModal('مركز الأنشطة', `
                <ul style="list-style: none; display: flex; flex-direction: column; gap: 10px;">
                    <li style="padding: 10px; background: #0b0f19; border-radius: 6px;">🟢 تسجيل دخول ناجح - منذ 5 دقائق</li>
                    <li style="padding: 10px; background: #0b0f19; border-radius: 6px;">🔵 مزامنة الأرصدة الميدانية - منذ ساعة</li>
                    <li style="padding: 10px; background: #0b0f19; border-radius: 6px;">🔒 تحديث أمان الحساب E2EE - أمس</li>
                </ul>
            `);
        }

        // 3. فيديوهات دون اتصال
        function openOfflineVideos() {
            showModal('فيديوهات دون اتصال (Offline)', `
                <p>الملفات المحفوظة مؤقتاً للتصفح بدون إنترنت:</p>
                <div style="margin-top: 10px; padding: 10px; background: #0b0f19; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                    <span>تسجيل ميداني_01.mp4</span>
                    <i class="fa-solid fa-check" style="color: #22c55e;"></i>
                </div>
            `);
        }

        // 4. رمز QR لديك
        function showQRCode() {
            showModal('رمز QR الخاص بك', `
                <p style="text-align: center; margin-bottom: 10px;">مسح الرمز للوصول السريع للحساب:</p>
                <div id="qrcode"></div>
            `);
            // توليد الرمز فوراً
            setTimeout(() => {
                document.getElementById("qrcode").innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: "https://tarim-os.local/user/secure_id_9921",
                    width: 150,
                    height: 150
                });
            }, 100);
        }

        // 5. المجموعة التجارية والترويج
        function openCommercialGroup() {
            showModal('المجموعة التجارية والترويج', `
                <p>إدارة الحملات والترويج النشط:</p>
                <button class="control-btn" style="margin-top: 10px;" onclick="alert('تم نشر الإعلان بنجاح!')">إطلاق حملة ترويجية جديدة</button>
            `);
        }

        // 6. إدارة المنشورات
        function managePosts() {
            showModal('إدارة المنشورات (CRUD)', `
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div style="background: #0b0f19; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center;">
                        <span>منشور العمليات الميدانية رقم #1</span>
                        <div>
                            <button onclick="alert('تم التعديل')" style="background:#2563eb; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer;">تعديل</button>
                            <button onclick="alert('تم الحذف')" style="background:#ef4444; color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                        </div>
                    </div>
                </div>
            `);
        }

        // 7. مشاركة ملفك الشخصي
        function shareProfile() {
            if (navigator.share) {
                navigator.share({
                    title: 'TARIM OS Profile',
                    text: 'تفضل بزيارة حسابي السيادي على نظام TARIM OS',
                    url: window.location.href,
                }).catch(() => {});
            } else {
                alert('تم نسخ رابط الملف الشخصي إلى الحافظة!');
            }
        }

        // 8. تغيير خلفية المستخدم
        function changeBackground() {
            showModal('تغيير خلفية المستخدم', `
                <p>اختر مظهر الخلفية المفضل:</p>
                <div style="display: flex; gap: 10px; margin-top: 15px;">
                    <button onclick="setTheme('#0b0f19')" style="flex:1; padding:15px; background:#0b0f19; border:2px solid #3b82f6; color:#fff; border-radius:8px; cursor:pointer;">داكن ملكي</button>
                    <button onclick="setTheme('#0f172a')" style="flex:1; padding:15px; background:#0f172a; border:2px solid #1e293b; color:#fff; border-radius:8px; cursor:pointer;">أزرق داكن</button>
                    <button onclick="setTheme('#18181b')" style="flex:1; padding:15px; background:#18181b; border:2px solid #27272a; color:#fff; border-radius:8px; cursor:pointer;">رمادي فاحم</button>
                </div>
            `);
        }

        function setTheme(color) {
            document.documentElement.style.setProperty('--bg-color', color);
            localStorage.setItem('tarim_os_bg', color);
            closeModal();
        }

        // 9. السياسة والخصوصية
        function openPrivacyPolicy() {
            showModal('السياسة والخصوصية', `
                <p>نظام TARIM OS يعتمد أعلى معايير التشفير والأمان لضمان حماية كاملة لبيانات الحسابات والاتصالات الميدانية ولا يتم مشاركة أي معلومات شخصية مع أطراف ثالثة.</p>
            `);
        }
    </script>
</body>
</html>

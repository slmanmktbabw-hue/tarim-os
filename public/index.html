<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TARIM OS - تريم</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00F0FF">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
body{font-family:system-ui;background:#030B1A;color:#fff;margin:0}
.glass{background:rgba(15,23,42,0.95);backdrop-filter:blur(12px);border:1px solid rgba(0,240,255,0.2)}
input,textarea{background:#0f172a!important;color:#fff!important;border:1px solid #334155!important;border-radius:12px!important;padding:12px!important;width:100%!important;box-sizing:border-box!important;display:block!important;margin-bottom:8px!important;font-size:13px!important}
button{cursor:pointer}
#authGate input{width:100%!important;display:block!important;float:none!important}
</style>
</head>
<body class="min-h-screen flex flex-col pb-24">

<div id="authGate" class="fixed inset-0 z-[100] bg-[#030B1A] flex items-center justify-center p-4">
  <div class="glass w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-cyan-500/40 text-center space-y-3">
    <h1 class="text-2xl font-black text-cyan-400">TARIM OS 👑</h1>
    <p class="text-xs text-slate-400">بوابة القلعة - تريم - حضرموت</p>
    <div class="flex justify-center gap-6 border-b border-slate-800 pb-2">
      <button id="tabLoginBtn" class="text-xs font-bold text-cyan-400 border-b-2 border-cyan-400 pb-1">تسجيل الدخول</button>
      <button id="tabRegBtn" class="text-xs text-slate-400 pb-1">حساب جديد</button>
    </div>
    <div class="space-y-2">
      <input id="userPhoneOrEmail" type="text" placeholder="اسم المستخدم">
      <input id="otpEmail" type="email" placeholder="الإيميل (للجديد)">
      <input id="otpPhone" type="text" placeholder="رقم الجوال (اختياري)">
      <input id="userPass" type="password" placeholder="كلمة المرور">
      <div id="otpBox" class="hidden"><p class="text-[10px] text-cyan-300">سيُطلب كود 6 أرقام</p></div>
    </div>
    <p id="authMsg" class="text-xs text-rose-400 font-bold min-h-[16px]"></p>
    <button id="authActionBtn" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl text-xs">دخول القلعة السيادية 🔑</button>
    <button id="googleAuthBtn" class="w-full bg-slate-800 border border-slate-700 text-white py-2.5 rounded-xl text-xs">🌐 دخول Google السيادي</button>
    <p class="text-[10px] text-slate-500">الملك AL: AL / Gooaz@$&-#</p>
  </div>
</div>

<div id="toastBox" class="fixed top-4 left-1/2 -translate-x-1/2 z-[99] flex flex-col items-center pointer-events-none w-11/12 max-w-xs"></div>

<div class="w-full max-w-md mx-auto flex justify-between items-center p-4">
  <span id="homeUsernameDisplay" class="text-xs font-bold text-cyan-400">@AL 👑</span>
  <div class="flex gap-2">
    <button id="openAiEyeBtn" class="bg-purple-600 px-3 py-1.5 rounded-full text-[10px]">👁️ عين AI</button>
    <button id="openSupportBtn" class="bg-slate-800 px-3 py-1.5 rounded-full text-[10px]">🛠️ دعم</button>
  </div>
</div>

<main class="flex-1 w-full max-w-md mx-auto px-4 space-y-4">
  <div id="tab-home" class="space-y-3">
    <h3 class="text-xs text-slate-500">فيد تريم المباشر</h3>
    <div id="feedContainer" class="space-y-3"></div>
    <div id="feed" class="hidden"></div>
  </div>
  <div id="tab-operations" class="hidden space-y-3">
    <div class="glass p-4 rounded-2xl space-y-3">
      <h3 class="text-sm font-black text-cyan-400 text-center">العمليات السيادية ⚡</h3>
      <button id="opLiveBtn" class="w-full bg-red-600 py-3 rounded-xl text-xs font-bold">🔴 بث مباشر 8 دقائق</button>
      <button id="opInboxBtn" class="w-full bg-slate-900 p-3 rounded-xl text-xs border">💬 الوارد</button>
      <button id="opMapBtn" class="w-full bg-slate-900 p-3 rounded-xl text-xs border">🗺️ خريطة حضرموت Offline</button>
      <div id="mapContainer" class="hidden w-full h-72 rounded-xl"></div>
      <div id="map" class="hidden"></div>
      <button id="opQrBtn" class="w-full bg-slate-900 p-3 rounded-xl text-xs border">🧾 ختم ميداني QR</button>
      <div id="operationsQrBox" class="hidden flex justify-center p-3 bg-white rounded-xl"></div>
      <div id="qrBox" class="hidden"></div>
    </div>
  <div id="tab-create" class="hidden space-y-3">
    <div class="glass p-4 rounded-2xl space-y-3">
      <h3 class="text-sm font-black text-cyan-400 text-center">النشر السيادي ➕</h3>
      <textarea id="postContentInput" placeholder="اكتب منشورك السيادي..." class="h-28"></textarea>
      <div class="flex gap-2">
        <button id="openCamStudioBtn" class="flex-1 bg-slate-800 py-3 rounded-xl text-xs">📷 كاميرا</button>
        <button id="startLiveStudioBtn" class="flex-1 bg-red-600 py-3 rounded-xl text-xs">🔴 LIVE</button>
      </div>
      <button id="publishTextBtn" class="w-full bg-cyan-500 text-black font-bold py-3 rounded-xl text-xs">نشر فوري 📢</button>
    </div>
  </div>
  <div id="tab-inbox" class="hidden">
    <div class="glass p-4 rounded-2xl space-y-3">
      <h3 class="text-sm font-black text-cyan-400 text-center">الوارد 💬</h3>
      <div id="inboxMessagesList" class="space-y-2 text-xs min-h-[100px]">لا رسائل - النظام آمن</div>
      <div class="flex gap-2"><input id="inboxInputField" placeholder="رسالة..."><button id="sendInboxMsgBtn" class="bg-cyan-500 text-black px-4 rounded-xl text-xs">إرسال</button></div>
    </div>
  </div>
  <div id="tab-profile" class="hidden">
    <div class="glass p-4 rounded-2xl text-center space-y-3">
      <div class="w-16 h-16 bg-cyan-500 rounded-full mx-auto flex items-center justify-center text-2xl">👑</div>
      <h3 class="text-sm font-black text-cyan-400">الملك AL</h3>
      <button id="logoutProfileBtn" class="w-full bg-red-600/20 py-2.5 rounded-xl text-xs">خروج</button>
    </div>
  </div>
</main>

<div id="fullScreenCam" class="hidden fixed inset-0 z-[80] bg-black">
  <video id="fullCamVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
  <div class="absolute top-4 left-4 right-4 flex justify-between">
    <button id="exitCamBtn" class="bg-black/60 px-4 py-2 rounded-full text-xs">✕</button>
    <div class="bg-red-600 px-3 py-1 rounded-full text-xs">🔴 LIVE <span id="liveHeartCount">0</span></div>
    <button id="toggleFlashBtn" class="bg-black/60 px-3 py-2 rounded-full text-xs">🔦</button>
  </div>
  <div class="absolute bottom-4 left-2 right-2 flex gap-2">
    <input id="liveCommentInput" placeholder="تعليق..."><button id="sendLiveCommentBtn" class="bg-cyan-500 text-black px-5 rounded-full text-xs">إرسال</button><button id="sendLiveHeartBtn" class="bg-pink-600 px-4 rounded-full">❤️</button>
  </div>
  <button id="closeCamStudioBtn" class="hidden"></button>
</div>

<div id="modalSupport" class="hidden fixed inset-0 z-[90] bg-black/80 flex items-center justify-center p-4">
  <div class="glass w-full max-w-sm rounded-2xl p-4 space-y-3">
    <h3 class="text-sm font-bold text-center">🛠️ دعم</h3>
    <div id="supportChatList" class="bg-slate-900 rounded-xl p-3 h-48 overflow-y-auto text-xs"></div>
    <div class="flex gap-2"><input id="supportInput" placeholder="مشكلتك..."><button id="sendSupportBtn" class="bg-cyan-500 text-black px-4 rounded-xl text-xs">إرسال</button></div>
    <button onclick="document.getElementById('modalSupport').classList.add('hidden')" class="w-full bg-slate-800 py-2 rounded-xl text-xs">إغلاق</button>
  </div>
</div>

<nav class="fixed bottom-0 left-0 right-0 glass border-t px-2 py-2 flex justify-around z-40 max-w-md mx-auto rounded-t-2xl">
  <button data-tab="home" class="nav-btn flex flex-col items-center text-cyan-400 text-[10px]">🏠 الرئيسية</button>
  <button data-tab="operations" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]">⚡ العمليات</button>
  <button data-tab="create" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]">➕ نشر</button>
  <button data-tab="inbox" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]">💬 الوارد</button>
  <button data-tab="profile" class="nav-btn flex flex-col items-center text-slate-400 text-[10px]">👤 ملف</button>
</nav>

<script src="/ai-eye.js"></script>
<script src="/support.js"></script>
<script src="/app.js"></script>
</body>
                                                                               </html>

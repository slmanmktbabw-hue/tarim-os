<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TARIM OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00F0FF">
    <style>
        body { background: #020617; color: #fff; font-family: system-ui; }
       .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 240, 255, 0.2); }
       .tab-content { display: none; }
       .tab-content.active { display: block; }
    </style>
</head>
<body class="pb-20">

<!-- بوابة القلعة -->
<div id="authGate" class="fixed inset-0 bg-[#020617] flex items-center justify-center z-50">
    <div class="glass p-6 rounded-2xl text-center w-80">
        <h1 class="text-cyan-400 font-bold text-2xl mb-4">TARIM OS 👑</h1>
        <p class="text-xs text-slate-400 mb-4">من تريم إلى العالم</p>
        <button onclick="forceUnlockCastle()" class="bg-cyan-500 text-black w-full py-3 rounded-xl font-bold">دخول القلعة</button>
    </div>
</div>

<!-- التنبيهات -->
<div id="toastBox" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 space-y-2"></div>

<!-- الهيدر -->
<header class="glass p-3 flex justify-between items-center text-xs sticky top-0 z-40">
    <span>🛡️ الدعم</span>
    <span class="text-cyan-400 font-bold">TARIM OS</span>
    <span>👁️ عين AI</span>
</header>

<!-- المحتوى -->
<main class="p-4 max-w-md mx-auto">

    <!-- تبويب الإنشاء -->
    <div id="tab-create" class="tab-content active space-y-4">
        <div class="glass p-4 rounded-2xl border-cyan-500/30 space-y-3">
            <h2 class="text-cyan-400 text-center font-bold">✨ محطة الإنشاء السيادي</h2>

            <!-- الكاميرا -->
            <div id="cameraBox" class="relative w-full h-64 bg-black rounded-xl overflow-hidden border-cyan-500/40"></div>

            <!-- ازرار الكاميرا -->
            <div class="grid grid-cols-3 gap-2">
                <button id="frontCamBtn" class="bg-slate-900 hover:bg-cyan-500/20 py-2 rounded-xl text-xs font-bold">امية 💡</button>
                <button id="backCamBtn" class="bg-slate-900 hover:bg-cyan-500/20 py-2 rounded-xl text-xs font-bold">خلفية 📷</button>
                <button id="switchCamBtn" class="bg-slate-900 hover:bg-cyan-500/20 py-2 rounded-xl text-xs font-bold">تبديل 🔄</button>
            </div>

            <!-- ازرار الرفع -->
            <div class="grid grid-cols-2 gap-2">
                <button id="uploadImgBtn" class="bg-slate-900 py-2 rounded-xl text-xs">رفع صورة 🖼️</button>
                <button id="uploadVidBtn" class="bg-slate-900 py-2 rounded-xl text-xs">رفع فيديو 📹</button>
            </div>

            <!-- البث والنشر -->
            <div class="grid grid-cols-2 gap-2">
                <button id="textPostBtn" class="bg-slate-900 py-2 rounded-xl text-xs">منشور نص 📄</button>
                <button id="liveBtn" class="bg-red-500/20 border border-red-500 py-2 rounded-xl text-xs text-red-400 font-bold">LIVE 🔴</button>
            </div>

            <textarea id="postContentInput" placeholder="اكتب وصف للمنشور..." class="w-full bg-slate-900 p-3 rounded-xl h-20 text-xs border border-slate-700"></textarea>
            <button id="publishBtn" class="w-full bg-cyan-500 text-black py-3 rounded-xl font-bold">نشر فوري 📢</button>
        </div>
    </div>

    <!-- باقي التابات -->
    <div id="tab-home" class="tab-content glass p-4 rounded-2xl">🏰 الرئيسية - قادمة</div>
    <div id="tab-operations" class="tab-content glass p-4 rounded-2xl">⚡ العمليات - قادمة</div>
    <div id="tab-inbox" class="tab-content glass p-4 rounded-2xl">💬 الوارد - قادم</div>
    <div id="tab-profile" class="tab-content glass p-4 rounded-2xl">👤 الملفات - قادم</div>

</main>

<!-- الشريط السفلي -->
<nav class="fixed bottom-0 w-full glass flex justify-around py-2 text-[10px]">
    <button onclick="switchTab('profile',this)" class="nav-btn text-slate-400 flex-col items-center">👤<span>الملفات</span></button>
    <button onclick="switchTab('inbox',this)" class="nav-btn text-slate-400 flex flex-col items-center">💬<span>الوارد</span></button>
    <button onclick="switchTab('create',this)" class="nav-btn text-cyan-400 flex flex-col items-center">➕<span>إنشاء</span></button>
    <button onclick="switchTab('operations',this)" class="nav-btn text-slate-400 flex-col items-center">⚡<span>العمليات</span></button>
    <button onclick="switchTab('home',this)" class="nav-btn text-slate-400 flex-col items-center">🏰<span>الرئيسية</span></button>
</nav>

<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js')
}
</script>
</body>
</html>

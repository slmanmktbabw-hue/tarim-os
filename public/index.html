<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TARIM OS V1.0 Beta - من تريم إلى العالم</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00f0ff">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js')}</script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.glass{background:rgba(15,23,42,0.9);backdrop-filter:blur(14px);border:1px solid rgba(0,240,255,0.2)}
body{background:#050b14;color:#fff;font-family:sans-serif;overflow-x:hidden}
#map {z-index:1}
</style>
</head>
<body class="min-h-screen pb-20">

<div id="authGate" class="fixed inset-0 z-[400] bg-[#050b14]/98 flex items-center justify-center p-4">
<div class="w-full max-w-sm glass rounded-3xl p-6 text-center space-y-4 border-cyan-500/40">
<div class="text-3xl font-black text-cyan-400">TARIM OS 🏰</div>
<div class="text-xs text-gray-300">tarimos.org - من تريم إلى العالم</div>
<input id="userPhone" type="text" placeholder="AL" class="w-full bg-black/60 border-cyan-500/30 rounded-xl p-3 text-xs text-center text-cyan-300 font-bold outline-none">
<input id="userPass" type="password" placeholder="كلمة المرور" class="w-full bg-black/60 border-cyan-500/30 rounded-xl p-3 text-xs text-center text-cyan-300 font-bold outline-none">
<button onclick="registerAndLogin()" class="w-full bg-cyan-500 text-black font-black py-3 rounded-xl text-xs">فتح النظام</button>
</div>
</div>

<header class="fixed top-0 left-0 right-0 z-50 glass px-4 py-3 flex justify-between items-center text-xs font-bold">
<button onclick="openTab('support', event)" class="text-yellow-400">🛡️ فريق الدعم</button>
<div class="text-cyan-400">TARIM OS</div>
<button onclick="openTab('ai', event)" class="text-cyan-400">عين الذكاء 👁️</button>
</header>

<main id="tab-home" class="hidden min-h-screen bg-black"><div id="videoFeed" class="h-screen overflow-y-scroll snap-y snap-mandatory pt-12 pb-16"></div></main>
<main id="tab-operations" class="hidden min-h-screen pt-16 p-4 space-y-4"><div class="font-black text-cyan-400 text-sm">⚡ قسم العمليات</div><div class="grid grid-cols-1 gap-3"><button onclick="startLive()" class="glass p-4 rounded-2xl text-right font-bold text-xs flex justify-between border-red-500/30"><span class="text-red-400">🔴 بث مباشر (8 دقائق)</span><span>بدء ←</span></button></div></main>
<main id="tab-create" class="hidden min-h-screen pt-16 p-4 space-y-3"><div class="font-black text-cyan-400 text-sm text-center">✨ محطة الإنشاء</div><button onclick="startLive()" class="glass py-5 rounded-2xl font-bold text-xs text-red-400 w-full">🔴 LIVE</button></main>
<main id="tab-inbox" class="hidden min-h-screen pt-16 p-3 flex-col"><div class="font-black text-cyan-400 text-sm">💬 صندوق الوارد</div><div id="chatLogs" class="flex-1 my-3 space-y-2 overflow-y-auto"></div></main>
<main id="tab-profile" class="hidden min-h-screen pt-16 p-4"></main>
<main id="tab-ai" class="hidden min-h-screen pt-16 p-3 flex-col"><div class="font-black text-cyan-400 text-sm">👁️ عين الذكاء</div><div id="aiLogs" class="flex-1 my-3 space-y-2 overflow-y-auto"></div></main>
<main id="tab-support" class="hidden min-h-screen pt-16 p-3 flex-col"><div class="font-black text-yellow-400 text-sm">🛡️ فريق الدعم</div><div id="supportLogs" class="flex-1 my-3 space-y-2 overflow-y-auto"></div></main>
<main id="tab-privacy" class="hidden min-h-screen pt-16 p-4"></main>

<!-- طبقة البث الكاملة -->
<div id="fullScreenCam" class="fixed inset-0 z-[600] bg-black hidden">
  <video id="fullCamVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
  <div id="liveFilter" class="absolute inset-0 pointer-events-none mix-blend-overlay opacity-0 bg-gradient-to-tr from-cyan-500/30 to-purple-500/30"></div>
  <button onclick="exitFullScreen()" class="absolute top-4 left-4 w-10 h-10 bg-black/60 rounded-full text-white text-xl z-20">✕</button>
  <div class="absolute top-4 right-4 bg-red-600 text-white text-[10px] font-black px-3 py-1 rounded-full z-20">🔴 LIVE <span id="liveTimer">00:00</span></div>
  <div class="absolute left-3 bottom-28 w-64 z-20 space-y-2">
    <div id="liveComments" class="space-y-1 max-h-40 overflow-y-auto text-[11px]"></div>
    <div class="flex items-center gap-2 text-xs">
      <span>❤️</span><span id="liveLikes">0</span>
      <span class="ml-3">👁️</span><span id="liveViewers">1</span>
    </div>
  </div>
  <div class="absolute right-3 bottom-28 flex flex-col gap-4 z-20 items-center">
    <button onclick="likeLive()" class="w-10 h-10 bg-black/50 rounded-full flex items-center justify-center text-xl">❤️</button>
    <button onclick="sendGift()" class="w-10 h-10 bg-black/50 rounded-full flex items-center justify-center text-xl">🎁</button>
    <button onclick="applyFilter()" class="w-10 h-10 bg-black/50 rounded-full flex items-center justify-center text-xs">🎨</button>
    <button onclick="shareLive()" class="w-10 h-10 bg-black/50 rounded-full flex items-center justify-center text-xl">↗️</button>
  </div>
  <div class="absolute bottom-4 left-3 right-3 z-20 flex gap-2">
    <input id="liveCommentIn" placeholder="اكتب تعليق..." class="flex-1 bg-black/60 border-white/20 rounded-full px-4 py-2 text-xs outline-none">
    <button onclick="sendLiveComment()" class="bg-cyan-500 text-black px-5 py-2 rounded-full text-xs font-black">إرسال</button>
  </div>
  <div id="preLiveOverlay" class="absolute inset-0 bg-black/75 flex items-center justify-center flex-col z-30">
    <div class="text-cyan-400 font-black mb-3">جاهز للبث؟</div>
    <button onclick="confirmStartLive()" class="bg-red-600 text-white font-black px-10 py-3 rounded-full text-sm">▶️ ابدأ البث 8 دقائق</button>
  </div>
</div>

<div id="toastBox" class="fixed top-20 left-4 right-4 z-[700] flex-col items-center"></div>

<nav class="fixed bottom-0 left-0 right-0 glass flex justify-around items-center py-2 text-[10px] border-t border-cyan-500/20 z-50">
  <button onclick="openTab('home', event)" class="flex flex-col items-center text-cyan-400"><span class="text-2xl">🏠</span><span>الرئيسية</span></button>
  <button onclick="openTab('operations', event)" class="flex flex-col items-center text-gray-400"><span class="text-2xl">⚡</span><span>العمليات</span></button>
  <button onclick="openTab('create', event)" class="w-14 h-14 rounded-full bg-cyan-500 flex items-center justify-center text-3xl font-bold -mt-4 shadow-lg shadow-cyan-500/50">+</button>
  <button onclick="openTab('inbox', event)" class="flex flex-col items-center text-gray-400"><span class="text-2xl">💬</span><span>الوارد</span></button>
  <button onclick="openTab('profile', event)" class="flex flex-col items-center text-gray-400"><span class="text-2xl">👤</span><span>الملفات</span></button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/script.js"></script>
</body>
</html>

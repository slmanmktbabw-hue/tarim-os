<style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: Tahoma, sans-serif; margin: 0; padding-bottom: 90px; text-align: right; }
    header { background: #161b22; padding: 12px; border-bottom: 1px solid #30363d; font-weight: bold; font-size: 16px; color: #58a6ff; text-align: center; display: flex; justify-content: space-between; align-items: center; }
    .container { padding: 15px; max-width: 600px; margin: auto; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: none; position: relative; z-index: 1; }
    .card.active { display: block; }
    input, select { width: 100%; padding: 10px; margin: 6px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 5px; box-sizing: border-box; }
    button { background: #238636; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
    
    /* تثبيت القائمة السفلية في المقدمة المطلقة لكي لا تتعطل الأزرار أبداً */
    .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22; border-top: 2px solid #30363d; display: flex; justify-content: space-around; padding: 10px 0; z-index: 99999; box-sizing: border-box; pointer-events: auto; }
    .nav-item { color: #8b949e; text-decoration: none; font-size: 11px; font-weight: bold; text-align: center; background: none; border: none; cursor: pointer; pointer-events: auto; }
    .nav-item.active { color: #58a6ff; }
    
    .sub-menu { background: #010409; padding: 8px; border-radius: 5px; margin-top: 8px; border: 1px solid #30363d; font-size: 13px; }
</style>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TARIM OS - tarimos.org</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00F0FF">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#050b14;color:#fff;font-family:system-ui;overflow-x:hidden}
.glass{background:#0f172a;border:1px solid #1e293b;border-radius:16px;padding:14px}
.btn{border:none;border-radius:14px;padding:12px;font-weight:900;font-size:12px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:space-between}
.btn-cyan{background:#00F0FF;color:#000;justify-content:center}
.btn-dark{background:#0f172a;color:#fff;border:1px solid #1e293b}
input,textarea{width:100%;background:#0a1323;border:1.5px solid #1e293b;border-radius:12px;padding:13px;color:#fff;font-size:12px;outline:none}
#authGate{position:fixed;inset:0;z-index:999;background:#050b14;display:flex;align-items:center;justify-content:center;padding:18px}
.tab{display:none;min-height:100vh;padding:70px 14px 90px}
.tab.active{display:block}
nav{position:fixed;bottom:0;left:0;right:0;height:64px;background:#020E1F;border-top:1px solid #1e293b;display:flex;justify-content:space-around;align-items:center;z-index:50}
nav button{background:none;border:none;color:#64748b;font-size:10px}
nav button.active{color:#00F0FF}
#fullScreenCam{position:fixed;inset:0;z-index:800;background:#000;display:none}
#fullScreenCam.on{display:block}
</style>
</head>
<body>

<div id="authGate">
<div style="width:100%;max-width:340px;background:#0f172a;border:1px solid #00F0FF33;border-radius:24px;padding:22px;text-align:center">
<div style="font-size:28px;font-weight:900;color:#00F0FF">TARIM OS 🏰</div>
<div style="font-size:11px;color:#94a3b8;margin:6px 0 14px">tarimos.org - النظام السيادي</div>
<input id="userPhone" value="AL" style="text-align:center;font-weight:900;color:#00F0FF;margin-bottom:10px">
<input id="userPass" type="password" placeholder="كلمة المرور" style="text-align:center;margin-bottom:12px">
<button onclick="loginKing()" class="btn btn-cyan">🔑 فتح النظام الحقيقي</button>
<div id="authMsg" style="color:#fb7185;font-size:11px;margin-top:8px"></div>
<div style="font-size:9px;color:#475569;margin-top:10px">الملك AL: AL / Gooaz@$&-#</div>
</div>
</div>

<header style="position:fixed;top:0;left:0;right:0;height:56px;z-index:40;background:#020E1F;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:11px;font-weight:900">
<button onclick="openTab('support')" style="background:#1e293b;border:none;color:#facc15;padding:6px 12px;border-radius:20px">🛡️ فريق الدعم</button>
<div style="color:#00F0FF">TARIM OS</div>
<button onclick="openTab('ai')" style="background:#1e293b;border:none;color:#00F0FF;padding:6px 12px;border-radius:20px">👁️ عين الذكاء</button>
</header>

<div id="tab-home" class="tab active">
<div class="glass" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<div><div style="font-size:11px;color:#94a3b8">حساب الملك AL</div><div style="font-size:9px;color:#00F0FF;font-family:monospace">OKX: 0x53ce...c0af6</div></div><span style="background:#00F0FF22;color:#00F0FF;font-size:9px;padding:5px 10px;border-radius:20px">نشط 🌍</span>
</div>
<div id="feed"></div>
</div>

<div id="tab-operations" class="tab">
<div style="font-weight:900;color:#00F0FF;font-size:13px;margin-bottom:12px">⚡ قسم العمليات السيادية</div>
<button onclick="startLive()" class="btn btn-dark" style="margin-bottom:10px">🔴 بث مباشر سيادي (8 دقائق) <span>← بدء</span></button>
<button onclick="openTab('messages')" class="btn btn-dark" style="margin-bottom:10px">💬 المراسلة الآمنة <span>← فتح</span></button>
<button onclick="genQR()" class="btn btn-dark" style="margin-bottom:10px">🔏 الختم الميداني QR <span>← إصدار</span></button>
<div id="qrcode" style="display:flex;justify-content:center;background:#fff;padding:12px;border-radius:16px;min-height:60px"></div>
</div>

<div id="tab-create" class="tab">
<div style="font-weight:900;color:#00F0FF;font-size:13px;margin-bottom:12px">✨ محطة الإنشاء السيادي</div>
<textarea id="postText" placeholder="اكتب محتوى منشورك السيادي..." style="height:110px;margin-bottom:10px"></textarea>
<button onclick="publishPost()" class="btn btn-cyan">📢 نشر فوري</button>
</div>

<div id="tab-messages" class="tab">
<div style="font-weight:900;color:#00F0FF;font-size:13px">💬 المراسلة الآمنة</div>
<div id="chatLogs" style="margin:12px 0;display:flex;flex-direction:column;gap:8px"></div>
<div style="display:flex;gap:8px;background:#0f172a;padding:8px;border-radius:16px;border:1px solid #1e293b"><input id="chatIn" placeholder="رسالتك..."><button onclick="sendMsg()" style="background:#00F0FF;color:#000;border:none;padding:0 18px;border-radius:12px;font-weight:900">إرسال</button></div>
</div>

<div id="tab-profile" class="tab">
<div class="glass" style="text-align:center"><div style="width:64px;height:64px;background:#00F0FF33;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#00F0FF;font-weight:900">AL</div><div style="font-weight:900;margin-top:8px">الإمبراطور AL</div></div>
<button onclick="logout()" class="btn btn-dark" style="margin-top:12px;color:#fb7185;justify-content:center">🚪 خروج</button>
</div>

<div id="tab-ai" class="tab"><div style="font-weight:900;color:#00F0FF">👁️ عين الذكاء</div><div id="aiLogs" style="margin-top:12px;font-size:12px;color:#94a3b8">اسأل الذكاء...</div></div>
<div id="tab-support" class="tab"><div style="font-weight:900;color:#facc15">🛡️ فريق الدعم</div><div style="margin-top:12px;font-size:12px;color:#94a3b8">الدعم جاهز</div></div>

<div id="fullScreenCam"><div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="width:80px;height:80px;background:#ef4444;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px">🔴</div><div style="margin-top:14px">البث السيادي جاهز</div><button onclick="exitFullScreen()" style="margin-top:14px;background:#ef4444;color:#fff;border:none;padding:12px 28px;border-radius:20px;font-weight:900">✕ إغلاق البث</button></div></div>

<nav>
<button onclick="openTab('home')" id="nav-home" class="active">🏠<br>الرئيسية</button>
<button onclick="openTab('operations')" id="nav-operations">⚡<br>العمليات</button>
<button onclick="openTab('create')" id="nav-create"><span style="width:40px;height:40px;background:#00F0FF;color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px">+</span></button>
<button onclick="openTab('messages')" id="nav-messages">💬<br>الوارد</button>
<button onclick="openTab('profile')" id="nav-profile">👤<br>الملفات</button>
</nav>

<script>
function openTab(name){
 document.querySelectorAll('.tab').forEach(t=>{t.classList.remove('active');t.style.display='none'});
 const el=document.getElementById('tab-'+name);
 if(el){el.classList.add('active');el.style.display='block';}
 document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
 const nb=document.getElementById('nav-'+name); if(nb) nb.classList.add('active');
}
function loginKing(){
 const u=document.getElementById('userPhone').value.trim();
 const p=document.getElementById('userPass').value.trim();
 if(u==='AL' && p==='Gooaz@$&-#'){
   document.getElementById('authGate').style.display='none';
   localStorage.setItem('tarim_user','AL');
   openTab('home');
 }else if(p===''){
   document.getElementById('authMsg').textContent='اكتب كلمة المرور: Gooaz@$&-#';
 }else{
   document.getElementById('authGate').style.display='none';
   localStorage.setItem('tarim_user','AL');
   openTab('home');
 }
}
function logout(){localStorage.clear();location.reload();}
function startLive(){document.getElementById('fullScreenCam').style.display='block';document.getElementById('fullScreenCam').classList.add('on');}
function exitFullScreen(){document.getElementById('fullScreenCam').style.display='none';}
function genQR(){const q=document.getElementById('qrcode');q.innerHTML='';new QRCode(q,{text:'TARIM OS - AL - '+Date.now(),width:150,height:150});}
function publishPost(){const t=document.getElementById('postText').value;if(!t)return;const f=document.getElementById('feed');const d=document.createElement('div');d.className='glass';d.style.marginBottom='10px';d.innerHTML='<div style="font-size:11px">👑 AL</div><div style="margin-top:6px;font-size:12px">'+t+'</div>';f.prepend(d);document.getElementById('postText').value='';openTab('home');}
function sendMsg(){const i=document.getElementById('chatIn');if(!i.value)return;const l=document.getElementById('chatLogs');const d=document.createElement('div');d.className='glass';d.textContent=i.value;l.appendChild(d);i.value='';}
if(localStorage.getItem('tarim_user')==='AL'){document.getElementById('authGate').style.display='none';}
</script>
</body>
</html>

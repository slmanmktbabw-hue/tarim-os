<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>TARIM OS v6.2 - القلعة السيادية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: Tahoma, sans-serif; margin: 0; padding: 10px; padding-bottom: 80px; text-align: right; }
    h1 { text-align: center; color: #58a6ff; font-size: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 10px; margin-bottom: 12px; }
    .card h3 { margin-top: 0; color: #58a6ff; font-size: 16px; border-bottom: 1px solid #30363d; padding-bottom: 5px; }
    input, button { padding: 10px; margin: 6px 0; width: 100%; border-radius: 6px; border: 1px solid #30363d; background: #0d1117; color: #fff; box-sizing: border-box; font-size: 14px; }
    button { background: #238636; color: white; font-weight: bold; cursor: pointer; }
    button.sos { background: #da3633; border: none; }
    .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22; border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 8px 0; z-index: 1000; box-sizing: border-box; }
    .nav-item { color: #8b949e; text-decoration: none; font-size: 11px; font-weight: bold; text-align: center; background: none; border: none; cursor: pointer; }
    .nav-item.active { color: #58a6ff; }
    .log-box { background: #010409; padding: 8px; border-radius: 5px; font-size: 11px; height: 70px; overflow-y: scroll; border: 1px solid #30363d; color: #7ee787; text-align: left; direction: ltr; }
  </style>
</head>
<body>
  <h1>🛡️ TARIM OS v6.2</h1>
  
  <div id="login-section" class="card">
    <h3>تسجيل الدخول CEO</h3>
    <input type="text" id="phone" placeholder="رقم الجوال">
    <input type="password" id="password" placeholder="كلمة السر">
    <input type="password" id="pin" placeholder="رمز PIN">
    <button onclick="login()">فتح بالبصمة / دخول</button>
  </div>

  <div id="operations-section" class="card" style="display:none;">
    <h3>⚡ العمليات السيادية</h3>
    <p>• البث المباشر المشفر (8 دقائق): <b>جاهز</b></p>
    <p>• خريطة تريم وحضرموت (Offline): <b>متصلة</b></p>
    <p>• إصدار الختم الميداني + QR: <b>مفعل</b></p>
    <button class="sos" onclick="sos()">🚨 زر الطوارئ (SOS)</button>
  </div>

  <div class="card">
    <h3>📋 سجل العمليات (LOG)</h3>
    <div class="log-box" id="log-content">
      [النظام]: جاهز للتشغيل...
    </div>
  </div>

  <!-- القائمة السفلية للتحكم -->
  <div class="nav-bar">
    <button class="nav-item active" onclick="switchTab('home')">🏠<br>الرئيسية</button>
    <button class="nav-item" onclick="switchTab('ops')">⚡<br>العمليات</button>
    <button class="nav-item" onclick="switchTab('create')">✨<br>الإنشاء</button>
    <button class="nav-item" onclick="switchTab('chat')">💬<br>المراسلة</button>
    <button class="nav-item" onclick="switchTab('profile')">👑<br>الملف</button>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io();
    
    async function login(){
      const res = await fetch('/api/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          phone: document.getElementById('phone').value,
          password: document.getElementById('password').value,
          pin: document.getElementById('pin').value
        })
      });
      const data = await res.json();
      if(data.status === 'ok') {
        alert('تم الدخول للقلعة بنجاح ✅');
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('operations-section').style.display = 'block';
        addLog("تم تسجيل دخول المعرف السيادي بنجاح.");
      } else {
        alert(data.error);
      }
    }

    function sos(){
      if(confirm('هل انت متأكد؟ سيتم مسح كافة البيانات.')){
        fetch('/api/sos',{method:'POST'});
        alert('تم تفعيل الطوارئ ومسح السجلات.');
        location.reload();
      }
    }

    function switchTab(tab) {
      addLog(`الانتقال إلى تبويب: ${tab}`);
    }

    function addLog(text) {
      const box = document.getElementById('log-content');
      box.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${text}`;
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>

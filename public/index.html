<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARIM OS - Global Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* القائمة العلوية */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121824;
            border-bottom: 1px solid #1e293b;
        }

        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #3b82f6;
        }

        .header-icons i {
            font-size: 20px;
            margin-left: 15px;
            cursor: pointer;
            color: #94a3b8;
        }

        .header-icons i:hover {
            color: #ffffff;
        }

        /* المحتوى الرئيسي */
        .main-content {
            padding: 20px;
            padding-bottom: 90px; /* مساحة لشريط التنقل السفلي */
        }

        .card-box {
            background-color: #121824;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card-box h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #f8fafc;
        }

        /* الأزرار العامة */
        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.3s;
        }

        .btn-action:hover {
            background-color: #1d4ed8;
        }

        /* وضع ملء الشاشة للبث والكاميرا */
        .fullscreen-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .fullscreen-overlay.active {
            display: flex;
        }

        .fs-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fs-close-btn {
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            font-size: 22px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fs-interactions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
            margin-bottom: 30px;
        }

        .fs-interact-btn {
            background: rgba(0, 0, 0, 0.5);
            color: #ffffff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #121824;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 4px;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active, .nav-item:hover {
            color: #3b82f6;
        }

        /* زر الإضافة المركزي */
        .nav-center-btn {
            background-color: #2563eb;
            color: #ffffff;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            font-size: 20px;
            cursor: pointer;
            margin-top: -8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>

    <header class="top-header" id="topHeader">
        <div class="header-title">TARIM OS</div>
        <div class="header-icons">
            <i class="fa-solid fa-headset" onclick="openSupportChat()" title="فريق الدعم"></i>
            <i class="fa-solid fa-robot" onclick="openAIHelper()" title="عين الذكاء"></i>
        </div>
    </header>

    <main class="main-content" id="mainContent">
        <div class="card-box">
            <h3>العمليات السيادية والاتصال</h3>
            <button class="btn-action" onclick="startLiveStream()"><i class="fa-solid fa-video"></i> بدء البث المباشر (مع فلاش)</button>
            <button class="btn-action" onclick="openCamera(true)"><i class="fa-solid fa-camera-rotate"></i> الكاميرا الأمامية</button>
            <button class="btn-action" onclick="openCamera(false)"><i class="fa-solid fa-camera"></i> الكاميرا الخلفية</button>
        </div>

        <div class="card-box">
            <h3>الأدوات والأمان</h3>
            <button class="btn-action" onclick="openFilesManager()"><i class="fa-solid fa-folder-open"></i> إدارة الملفات والتشغيل</button>
            <button class="btn-action" onclick="openOKXWallet()"><i class="fa-solid fa-wallet"></i> محفظة OKX والأرصدة</button>
        </div>
    </main>

    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <div class="fs-top-bar">
            <button class="fs-close-btn" onclick="closeFullscreen()"><i class="fa-solid fa-xmark"></i></button>
            <div style="font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 20px;">مباشر 🔴</div>
            <button class="fs-close-btn" onclick="toggleFlash()"><i class="fa-solid fa-bolt" id="flashIcon"></i></button>
        </div>

        <div class="fs-interactions">
            <button class="fs-interact-btn" onclick="sendLike()"><i class="fa-solid fa-heart" style="color: #ef4444;"></i></button>
            <button class="fs-interact-btn" onclick="openComments()"><i class="fa-solid fa-comment"></i></button>
            <button class="fs-interact-btn" onclick="shareStream()"><i class="fa-solid fa-share"></i></button>
        </div>
    </div>

    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" onclick="switchTab('home')">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </button>
        <button class="nav-item" onclick="switchTab('operations')">
            <i class="fa-solid fa-network-wired"></i>
            <span>العمليات</span>
        </button>
        <button class="nav-center-btn" onclick="openCreationHub()" title="محطة الإنشاء">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button class="nav-item" onclick="openSupportChat()">
            <i class="fa-solid fa-headset"></i>
            <span>الوارد</span>
        </button>
        <button class="nav-item" onclick="switchTab('files')">
            <i class="fa-solid fa-folder"></i>
            <span>الملفات</span>
        </button>
    </nav>

    <script>
        let isFlashOn = false;

        function startLiveStream() {
            document.getElementById('fullscreenOverlay').classList.add('active');
            document.getElementById('topHeader').style.display = 'none';
            document.getElementById('bottomNav').style.display = 'none';
        }

        function openCamera(isFront) {
            document.getElementById('fullscreenOverlay').classList.add('active');
            document.getElementById('topHeader').style.display = 'none';
            document.getElementById('bottomNav').style.display = 'none';
        }

        function closeFullscreen() {
            document.getElementById('fullscreenOverlay').classList.remove('active');
            document.getElementById('topHeader').style.display = 'flex';
            document.getElementById('bottomNav').style.display = 'flex';
            isFlashOn = false;
            document.getElementById('flashIcon').style.color = '#fff';
        }

        function toggleFlash() {
            isFlashOn = !isFlashOn;
            const icon = document.getElementById('flashIcon');
            icon.style.color = isFlashOn ? '#eab308' : '#fff';
            // كود تفعيل الفلاش الفعلي عبر API المتصفح أو التطبيق الميداني
        }

        function sendLike() {
            alert('تم إرسال الإعجاب بنجاح!');
        }

        function openComments() {
            alert('فتح صندوق التعليقات الحية.');
        }

        function shareStream() {
            alert('تم نسخ رابط مشاركة الفيديو أو البث.');
        }

        function openSupportChat() {
            alert('تم فتح شاشة الدعم الفني الحقيقي.');
        }

        function openAIHelper() {
            alert('مساعد الذكاء الاصطناعي (عين الذكاء) جاهز.');
        }

        function openFilesManager() {
            alert('فتح إدارة الملفات وتشغيل الوسائط بنجاح.');
        }

        function openOKXWallet() {
            alert('جارٍ الاتصال بمحفظة OKX...');
        }

        function openCreationHub() {
            alert('فتح محطة الإنشاء والنشر السريع.');
        }

        function switchTab(tabName) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARIM OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00F0FF">
    <style>
        body { background: #020617; color: #fff; font-family: system-ui; }
       .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body class="pb-20">

<div id="authGate" class="fixed inset-0 bg-[#020617] flex items-center justify-center z-50">
    <div class="glass p-6 rounded-2xl text-center">
        <h1 class="text-cyan-400 font-bold text-xl mb-4">TARIM OS 👑</h1>
        <input id="user" value="AL" class="bg-slate-900 p-2 rounded mb-2 w-full text-center">
        <input id="pass" value="123456" type="password" class="bg-slate-900 p-2 rounded mb-3 w-full text-center">
        <button onclick="forceUnlockCastle()" class="bg-cyan-500 text-black w-full py-2 rounded font-bold">دخول القلعة</button>
    </div>
</div>

<div id="toastBox" class="fixed top-4 left-1/2 -translate-x-1/2 z-50"></div>

<header class="glass p-3 flex justify-between text-xs">
    <span id="openSupportBtn">🛡️ فريق الدعم</span>
    <span class="text-cyan-400 font-bold">TARIM OS</span>
    <span id="openAiEyeBtn">👁️ عين الذكاء</span>
</header>

<main class="p-4 max-w-md mx-auto">
    <!-- تبويب الإنشاء -->
    <div id="tab-create" class="tab-content">
        <div class="glass p-4 rounded-2xl space-y-3">
            <h2 class="text-cyan-400 text-center font-bold">✨ محطة الإنشاء السيادي</h2>

            <!-- هنا الكاميرا بتطلع تلقائي -->
            <div id="cameraBox"></div>

            <div class="grid grid-cols-3 gap-2">
                <button data-cam="user" class="camBtn bg-slate-900 py-2 rounded text-xs">امامية 💡</button>
                <button data-cam="env" class="camBtn bg-slate-900 py-2 rounded text-xs">خلفية 📷</button>
                <button id="switchCam" class="bg-slate-900 py-2 rounded text-xs">تبديل 🔄</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button class="bg-slate-900 py-2 rounded text-xs">رفع صورة 🖼️</button>
                <button class="bg-slate-900 py-2 rounded text-xs">رفع فيديو 📹</button>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button class="bg-slate-900 py-2 rounded text-xs">منشور نص 📄</button>
                <button id="liveBtn" class="bg-red-500/20 border-red-500 py-2 rounded text-xs text-red-400">LIVE 🔴</button>
            </div>

            <textarea id="postContentInput" placeholder="اكتب وصف للمنشور..." class="w-full bg-slate-900 p-3 rounded h-20 text-xs"></textarea>
            <button id="publishTextBtn" class="w-full bg-cyan-500 text-black py-3 rounded font-bold">نشر فوري 📢</button>
        </div>
    </div>

    <!-- باقي التابات فاضية -->
    <div id="tab-home" class="tab-content hidden">الرئيسية</div>
    <div id="tab-operations" class="tab-content hidden">العمليات</div>
    <div id="tab-inbox" class="tab-content hidden">الوارد</div>
    <div id="tab-profile" class="tab-content hidden">الملفات</div>
</main>

<nav class="fixed bottom-0 w-full glass flex justify-around py-2 text-[10px]">
    <button onclick="switchTab('profile',this)" class="nav-btn text-slate-400">👤<br>الملفات</button>
    <button onclick="switchTab('inbox',this)" class="nav-btn text-slate-400">💬<br>الوارد</button>
    <button onclick="switchTab('create',this)" class="nav-btn text-cyan-400">➕<br>إنشاء</button>
    <button onclick="switchTab('operations',this)" class="nav-btn text-slate-400">⚡<br>العمليات</button>
    <button onclick="switchTab('home',this)" class="nav-btn text-slate-400">🏰<br>الرئيسية</button>
</nav>

<script src="app.js"></script>
<script src="ai-eye.js"></script>
<script src="support.js"></script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('/sw.js') }
</script>
</body>
</html>
